<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ゲーム置き場</title>
<style>
  :root{
    --gold:#e0b24f;
    --card-bg-a:rgba(96,58,30,0.42);
    --card-bg-b:rgba(36,20,14,0.60);
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; min-height:100%;
    background:
      radial-gradient(ellipse at 50% -10%, rgba(224,130,50,0.14), transparent 52%),
      radial-gradient(ellipse at 50% 110%, rgba(110,30,150,0.16), transparent 58%),
      #08060c;
    font-family:'Georgia','Yu Mincho',serif;
    color:#f0e4c8;
    -webkit-tap-highlight-color: transparent;
  }
  .wrap{ max-width:640px; margin:0 auto; padding:36px 20px 60px; }
  header{ text-align:center; margin-bottom:8px; }
  h1{
    color:var(--gold); font-size:clamp(28px,7vw,38px); letter-spacing:4px; margin:0 0 10px;
    text-shadow:0 0 24px rgba(224,178,79,0.75), 0 2px 1px rgba(0,0,0,0.7);
    position:relative; display:inline-block; padding-bottom:14px;
  }
  h1::after{
    content:''; position:absolute; bottom:0; left:50%; transform:translateX(-50%);
    width:140px; height:2px;
    background:linear-gradient(90deg, transparent, var(--gold), transparent);
  }
  .sub{ color:#c9b28a; font-size:12px; letter-spacing:2px; margin:0 0 40px; text-align:center; }

  .card{
    display:flex; align-items:center; gap:16px;
    background:linear-gradient(155deg, var(--card-bg-a), var(--card-bg-b));
    border:2px solid #6b4f2e; border-radius:12px;
    padding:16px 18px; margin-bottom:16px;
    box-shadow:inset 0 0 0 1px rgba(224,178,79,0.14), 0 4px 12px rgba(0,0,0,0.4);
  }
  .icon{
    width:56px; height:56px; flex-shrink:0; border-radius:10px;
    display:flex; align-items:center; justify-content:center; font-size:28px;
    background:radial-gradient(circle at 35% 30%, rgba(255,255,255,0.15), rgba(0,0,0,0.25));
    border:1px solid rgba(224,178,79,0.35);
  }
  .info{ flex:1; min-width:0; }
  .titleRow{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .gTitle{ color:var(--gold); font-size:16px; letter-spacing:1px; font-weight:bold; }
  .tag{
    font-size:9px; letter-spacing:1px; padding:2px 8px; border-radius:10px;
    border:1px solid; white-space:nowrap;
  }
  .tag.done{ color:#8fd694; border-color:#4a7a4e; background:rgba(80,160,90,0.12); }
  .tag.wip{ color:#ffd699; border-color:#a87a3a; background:rgba(200,140,50,0.14); }
  .tag.proto{ color:#a8c4e0; border-color:#4a6a8a; background:rgba(70,110,150,0.14); }
  .desc{ color:#c9b28a; font-size:12px; margin-top:5px; line-height:1.6; }
  .playBtn{
    flex-shrink:0;
    background:linear-gradient(180deg, #ff9257, #d1541c 55%, #a8391a);
    color:#fff8ec; border:2px solid var(--gold);
    padding:10px 18px; font-size:12px; letter-spacing:2px;
    border-radius:5px; cursor:pointer; font-family:inherit; text-decoration:none;
    text-shadow:0 1px 2px rgba(0,0,0,0.55);
    box-shadow:0 3px 0 #5a2408, 0 5px 10px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.25);
    transition:transform 0.08s, box-shadow 0.08s;
    display:inline-block; text-align:center;
  }
  .playBtn:active{
    transform:translateY(2px);
    box-shadow:0 1px 0 #5a2408, 0 2px 6px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.2);
  }
  footer{ text-align:center; color:#6b5a42; font-size:10px; margin-top:30px; letter-spacing:1px; }

  @media (max-width:420px){
    .card{ flex-wrap:wrap; }
    .playBtn{ width:100%; margin-top:4px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>ゲーム置き場</h1>
    <p class="sub">GAME COLLECTION — 遊びたいものをタップ</p>
  </header>

  <div class="card">
    <div class="icon">🏃</div>
    <div class="info">
      <div class="titleRow">
        <span class="gTitle">奈落回避ランナー</span>
        <span class="tag done">完成</span>
      </div>
      <div class="desc">崩れた足場を2段ジャンプで飛び越え、どこまで走れるかに挑む横スクロールランナー。能力解放・BGM・悲鳴音つき。</div>
    </div>
    <a class="playBtn" href="temple-run-clone.html">プレイする</a>
  </div>

  <div class="card">
    <div class="icon">⚔️</div>
    <div class="info">
      <div class="titleRow">
        <span class="gTitle">討伐2048</span>
        <span class="tag wip">開発中</span>
      </div>
      <div class="desc">2048の合体でボスにダメージを与える、勇者選択・ステージ制のRPG風バトルデモ。</div>
    </div>
    <a class="playBtn" href="boss-battle-demo.html">プレイする</a>
  </div>

  <footer>MADE WITH CLAUDE</footer>
</div>
</body>
</html>
