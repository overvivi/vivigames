<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>ゲーム置き場 試作（実機＋カセット）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600;700;900&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
/*
  実機＋カセット方式の試作。
  本体もカセットもCSSの図形で仮組みしてある。画像が届いたら差し替える。
  位置合わせに使う値は --slot-* / --panel-* に寄せてあるので、
  絵の差込口やパネルの位置がずれていてもここだけ直せば合う。
*/
:root{
  --black:#05040a; --panel:#111425; --cyan:#20e6ff; --magenta:#ff2ba6;
  --text:#f2f5ff; --muted:#98a2bd; --line:rgba(32,230,255,.32);
  /* いま挿さっているゲームの色。カセットを挿すと差し替わる */
  --game:#20e6ff; --game-dim:rgba(32,230,255,.22);
}
*{box-sizing:border-box;}
body{margin:0; background:
    radial-gradient(ellipse at 50% 0%,rgba(32,230,255,.07),transparent 55%),
    var(--black);
  color:var(--text); font-family:'Noto Sans JP',system-ui,sans-serif;
  min-height:100vh; padding:26px 16px 60px;}
h1{font-family:'Press Start 2P',monospace; font-size:clamp(11px,2.6vw,15px);
  letter-spacing:.1em; text-align:center; color:var(--cyan); margin:0 0 6px;}
.lead{text-align:center; font-size:11px; color:var(--muted); margin:0 0 26px; letter-spacing:.08em;}

.stage{width:min(880px,100%); margin:0 auto;}

/* ---------- カセット置き場 ---------- */
.rack{display:flex; flex-wrap:wrap; justify-content:center; gap:14px;}
.cart{position:relative; width:104px; padding:0; border:0; background:none;
  cursor:pointer; transition:transform .18s ease; font:inherit;}
.cart:hover:not(:disabled),.cart:focus-visible{transform:translateY(-6px);}
.cart:focus-visible{outline:2px solid var(--cyan); outline-offset:6px;}
.cart:disabled{cursor:not-allowed;}
/* 仮のカセット本体。画像が来たら shell の background へ置き換える。
   ラベルの位置は変数に寄せてある。絵のくぼみがどこに来ても、
   ここの4つを測って入れれば合う（docs/reference/cartridge-layout.svg と同じ値）。 */
.shell{display:block; position:relative; aspect-ratio:1086/1448;
  /* ラベルのくぼみの位置。絵から測った値 */
  --label-x:13.4%; --label-y:29.4%; --label-w:72.6%; --label-h:52.4%;
  background:url('images/portal/cartridge-shell.png') center/contain no-repeat;
  filter:drop-shadow(0 8px 14px rgba(0,0,0,.6));}

/* ラベル。ここへ 800x800 の絵が入る */
.label{position:absolute; left:var(--label-x); top:var(--label-y);
  width:var(--label-w); height:var(--label-h); border-radius:6px; overflow:hidden;
  background:var(--art,#1b2030) center/cover no-repeat;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.55), inset 0 2px 6px rgba(0,0,0,.5);}
.cart .name{display:block; margin-top:7px; font-size:9.5px; letter-spacing:.09em;
  color:var(--muted); text-align:center;}
.cart[aria-pressed="true"] .name{color:var(--text);}
.cart.blank .shell{opacity:.5;}
.cart.blank .label{background:repeating-linear-gradient(45deg,#171b26 0 6px,#12151e 6px 12px);}

/* 取り出した跡は空のくぼみとして残す。まるごと消すと列に穴が空いて見える */
.cart.inserted .shell{opacity:.3; box-shadow:none;}
.cart.inserted .label{background:none; box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);}
.cart.inserted .name{color:var(--game);}

/* ---------- 実機本体 ---------- */
/* 挿さったカセットは差込口から上へ伸びる。その高さぶん本体を下げないと
   カセット置き場と重なる。%は親(.stage)の幅を基準にするので端末幅に追従する */
.console{position:relative; margin:5% auto 0; width:min(660px,100%); aspect-ratio:1672/941;
  /* 絵の「空き地」から測った値。絵を描き直さずここだけで合わせられる */
  --slot-x:49.6%; --slot-y:34%;        /* 上面の平らな面の中心 */
  --panel-x:16%;  --panel-y:51.5%;     /* 前面の平らな面の左上 */
  --panel-w:68%;  --panel-h:16.5%;}
.body{position:absolute; inset:0;
  background:url('images/portal/console-body.png') center/contain no-repeat;
  filter:drop-shadow(0 22px 30px rgba(0,0,0,.65));}
/* 差込口 */
.slot{position:absolute; left:var(--slot-x); top:var(--slot-y); transform:translate(-50%,-50%);
  width:21%; height:2.6%; border-radius:3px; background:#04050a;
  box-shadow:inset 0 3px 7px rgba(0,0,0,.95), 0 1px 0 rgba(255,255,255,.10);}
.slot::after{content:''; position:absolute; inset:-5px -8px; border-radius:6px;
  box-shadow:0 0 18px var(--game-dim); opacity:0; transition:opacity .3s;}
.console.on .slot::after{opacity:1;}
/* 前面パネル */
.front{position:absolute; left:var(--panel-x); top:var(--panel-y);
  width:var(--panel-w); height:var(--panel-h);
  border-radius:7px; background:#03040a; border:1px solid rgba(255,255,255,.07);
  box-shadow:inset 0 2px 12px rgba(0,0,0,.9); overflow:hidden;}
/* 文字とPLAY。既定では窓の上に重ねる */
.readout{position:absolute; left:var(--panel-x); top:var(--panel-y);
  width:var(--panel-w); height:var(--panel-h);
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:0 clamp(10px,2.4vw,20px);}
.front::before{content:''; position:absolute; inset:0;
  background:linear-gradient(100deg,transparent 30%,var(--game-dim));
  opacity:0; transition:opacity .35s;}
.console.on .front{border-color:var(--game-dim); box-shadow:inset 0 2px 12px rgba(0,0,0,.9), 0 0 22px var(--game-dim);}
.console.on .front::before{opacity:1;}
.info{position:relative; min-width:0;}
.info .t{font-family:'Press Start 2P',monospace; font-size:clamp(9px,1.8vw,13px);
  letter-spacing:.06em; color:var(--game); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.info .d{margin-top:6px; font-size:clamp(8.5px,1.5vw,10.5px); color:var(--muted);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.play{position:relative; flex:0 0 auto; text-decoration:none;
  font-family:'Press Start 2P',monospace; font-size:clamp(9px,1.7vw,12px);
  color:var(--game); border:1px solid var(--game); border-radius:5px;
  padding:10px 16px; letter-spacing:.08em; background:rgba(0,0,0,.5);
  box-shadow:0 0 14px var(--game-dim);}
.play:hover,.play:focus-visible{background:var(--game); color:#04060d; outline:none;}
.console:not(.on) .play{display:none;}
.console:not(.on) .info .t{color:var(--muted);}

/* 挿さったカセット。差込口から頭だけ出す */
.stuck{position:absolute; left:var(--slot-x); top:var(--slot-y);
  width:19%; transform:translate(-50%,-100%); transform-origin:50% 100%;
  pointer-events:none; opacity:0;}
.stuck.show{opacity:1; animation:drop .4s cubic-bezier(.3,.9,.4,1);}
@keyframes drop{
  from{transform:translate(-50%,-168%);}
  70%{transform:translate(-50%,-96%);}
  to{transform:translate(-50%,-100%);}
}
.stuck .shell{border-radius:6px 6px 0 0; box-shadow:0 -6px 16px rgba(0,0,0,.6);}
.stuck .shell::after{display:none;}

@media (prefers-reduced-motion: reduce){
  .stuck.show{animation:none;}
  .cart{transition:none;}
}
@media (max-width:520px){
  .rack{gap:9px;} .cart{width:74px;}
  /* 実機の前面は細いので、携帯では文字とPLAYを本体の下へ出す。
     窓は点灯するだけにする */
  .console{margin-bottom:118px;}
  .readout{left:0; top:100%; width:100%; height:auto; padding:14px 2px 0;
    flex-direction:column; align-items:stretch; gap:10px;}
  .info .d{white-space:normal; line-height:1.6; margin-top:4px;}
  .info .t{font-size:13px;}
  .play{padding:13px; text-align:center;}
}
.toast{height:16px; margin-top:9px; text-align:center; font-size:10.5px; letter-spacing:.08em;
  color:var(--muted); opacity:0; transition:opacity .2s;}
.toast.show{opacity:1;}
@keyframes nudge{0%,100%{transform:translateX(0);} 25%{transform:translateX(-4px);} 75%{transform:translateX(4px);}}
.cart.nudge{animation:nudge .26s;}

.note{width:min(880px,100%); margin:30px auto 0; padding:14px 16px;
  border:1px solid var(--line); background:rgba(17,20,37,.6);
  font-size:11px; line-height:1.9; color:var(--muted);}
.note b{color:var(--text);}
</style>
</head>
<body>

<h1>GAME CONSOLE</h1>
<p class="lead">カセットを選ぶと実機に挿さります</p>

<div class="stage">
  <div class="rack" id="rack"></div>
  <div class="toast" id="toast"></div>

  <div class="console" id="console">
    <div class="body">
      <div class="vent l"></div>
      <div class="vent r"></div>
      <div class="feet"></div>
    </div>
    <div class="slot"></div>
    <div class="stuck" id="stuck"><div class="shell"><div class="label" id="stuckLabel"></div></div></div>
    <div class="front"></div>
    <div class="readout">
      <div class="info">
        <div class="t" id="frontTitle">カセットを挿してください</div>
        <div class="d" id="frontDesc">上のカセットから選ぶ</div>
      </div>
      <a class="play" id="playLink" href="#">PLAY</a>
    </div>
  </div>
</div>

<div class="note">
  <b>これは試作です。</b>届いた画像を組み込んで、差込口と表示窓の位置を合わせた状態です。
  差込口・表示窓・点灯・PLAYはすべてCSSで描いており、絵には描かれていません。
  画像はまだ原寸のPNG（合計約11MB）なので、公開前に縮小と変換が要ります。
</div>

<script>
(function(){
  // ラベルは本番では画像1枚に置き換わる。試作では色で代用する。
  const GAMES = [
    { id:'hell',  name:'HELL RUNNER', desc:'崩れる足場を駆け抜ける', href:'games/temple-run-clone.html',
      color:'#ff4b2b', art:"url('images/portal/cart-label-hell-runner.png')" },
    { id:'boss',  name:'討伐2048',     desc:'合体させてボスを討伐',   href:'games/boss-battle-demo.html',
      color:'#a855f7', art:"url('images/portal/cart-label-boss-2048.png')" },
    { id:'hexa',  name:'HEXAMINE',    desc:'分子構造を論理だけで復元', href:'games/hexamine.html',
      color:'#20e6ff', art:"url('images/portal/cart-label-hexamine.png')" },
    { id:'next',  name:'COMING SOON', desc:'次のゲームは準備中',      href:null, blank:true }
  ];

  const rack = document.getElementById('rack');
  const box  = document.getElementById('console');
  const stuck = document.getElementById('stuck');
  const stuckLabel = document.getElementById('stuckLabel');
  const fTitle = document.getElementById('frontTitle');
  const fDesc  = document.getElementById('frontDesc');
  const play   = document.getElementById('playLink');
  const toast = document.getElementById('toast');
  const buttons = [];
  let inserted = null, toastTimer = null;

  // 「動きを減らす」設定では演出を飛ばす
  const calm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  GAMES.forEach(g=>{
    const b = document.createElement('button');
    b.className = 'cart' + (g.blank ? ' blank' : '');
    b.type = 'button';
    b.setAttribute('aria-pressed','false');
    b.innerHTML = '<span class="shell"><span class="label"></span></span><span class="name"></span>';
    b.querySelector('.name').textContent = g.name;
    if(g.art) b.querySelector('.label').style.setProperty('--art', g.art);
    b.addEventListener('click', ()=> insert(g, b));
    rack.appendChild(b);
    buttons.push(b);
  });

  function insert(g, btn){
    buttons.forEach(x=>{ x.setAttribute('aria-pressed','false'); x.classList.remove('inserted'); });

    if(g.blank){
      // 空のカセットは挿さらない。いま挿さっているものを外す理由も無いので触らない
      buttons.forEach((x,i)=>{ if(GAMES[i].id === inserted) x.setAttribute('aria-pressed','true'); });
      btn.classList.remove('nudge'); void btn.offsetWidth; btn.classList.add('nudge');
      toast.textContent = '次のゲームは準備中です';
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(()=> toast.classList.remove('show'), 2400);
      return;
    }
    toast.classList.remove('show');
    inserted = g.id;

    btn.setAttribute('aria-pressed','true');
    btn.classList.add('inserted');
    box.style.setProperty('--game', g.color);
    box.style.setProperty('--game-dim', hexA(g.color, .28));
    stuckLabel.style.setProperty('--art', g.art);

    // 同じ演出を出し直すため、一度クラスを外して再描画させる
    stuck.classList.remove('show');
    void stuck.offsetWidth;
    stuck.classList.add('show');

    fTitle.textContent = g.name;
    fDesc.textContent = g.desc;
    play.href = g.href;
    play.setAttribute('aria-label', g.name + 'をプレイ');
    // 演出中でも押せるようにする。待たせる理由が無い
    box.classList.add('on');
  }

  function hexA(hex, a){
    const n = parseInt(hex.slice(1), 16);
    return 'rgba(' + (n>>16 & 255) + ',' + (n>>8 & 255) + ',' + (n & 255) + ',' + a + ')';
  }

  // 最初は一番新しいゲームを挿しておく
  insert(GAMES[2], buttons[2]);
})();
</script>
</body>
</html>
