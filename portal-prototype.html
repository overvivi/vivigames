<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>ゲーム置き場 試作（携帯機＋カセット）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600;700;900&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
/*
  横長スケルトン携帯機＋カセットの試作。本体はCSSの図形で仮組み。

  据置機に携帯機用カセットを挿す形は縮尺が食い違って見えたので、本体を携帯機にした。
  カセットは本体の「裏」へ潜り込ませて完全に消す。こうすると
  ・浮いて見えない（奥まで挿さる）
  ・差込口と1ピクセル単位で合わせる必要が無い（絵は作り込ませてよい）
  ・ラベルの絵を画面へ大きく出せる（小さいと何のゲームか読めなかった）
*/
:root{
  --black:#05040a; --cyan:#20e6ff; --magenta:#ff2ba6;
  --text:#f2f5ff; --muted:#98a2bd; --line:rgba(32,230,255,.32);
  --game:#20e6ff; --game-dim:rgba(32,230,255,.22);
}
*{box-sizing:border-box;}
body{margin:0; background:
    radial-gradient(ellipse at 50% 0%,rgba(32,230,255,.07),transparent 55%), var(--black);
  color:var(--text); font-family:'Noto Sans JP',system-ui,sans-serif;
  min-height:100vh; padding:26px 16px 70px;}
h1{font-family:'Press Start 2P',monospace; font-size:clamp(11px,2.6vw,15px);
  letter-spacing:.1em; text-align:center; color:var(--cyan); margin:0 0 6px;}
.lead{text-align:center; font-size:11px; color:var(--muted); margin:0 0 24px; letter-spacing:.08em;}
.stage{width:min(880px,100%); margin:0 auto;}

/* ---------- カセット置き場 ---------- */
.rack{display:flex; flex-wrap:wrap; justify-content:center; gap:14px;}
.cart{position:relative; width:108px; padding:0; border:0; background:none;
  cursor:pointer; transition:transform .18s ease; font:inherit;}
.cart:hover,.cart:focus-visible{transform:translateY(-6px);}
.cart:focus-visible{outline:2px solid var(--cyan); outline-offset:6px;}
/* 透明の殻。本体がスケルトンなので、カセットも中身が透けて光る作りにする。
   絵は「印刷したラベル」ではなく「中で発光しているもの」として見せる。 */
.shell{display:block; position:relative; aspect-ratio:35/32;
  --label-x:7%; --label-y:15%; --label-w:86%; --label-h:70%;
  border-radius:7px 7px 4px 4px;
  background:linear-gradient(158deg,rgba(255,255,255,.13),rgba(255,255,255,.04) 42%,rgba(0,0,0,.30));
  border:1px solid rgba(255,255,255,.20);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.34), inset 0 -8px 14px rgba(0,0,0,.35),
             0 0 18px var(--glow,transparent), 0 8px 15px rgba(0,0,0,.55);}
/* 殻の中の基板と端子 */
.shell::before{content:''; position:absolute; left:31%; right:31%; top:2.5%; height:7%;
  border-radius:3px; background:rgba(255,255,255,.07);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.26);}
.shell::after{content:''; position:absolute; left:20%; right:20%; bottom:2.5%; height:5%;
  border-radius:2px; background:repeating-linear-gradient(90deg,
    var(--glow,rgba(255,255,255,.25)) 0 3px,transparent 3px 7px); opacity:.9;}
/* 中で光っている絵 */
.label{position:absolute; left:var(--label-x); top:var(--label-y);
  width:var(--label-w); height:var(--label-h); border-radius:5px; overflow:hidden;
  background:var(--art,#1b2030) center/cover no-repeat;
  opacity:.92; filter:saturate(1.25) brightness(1.06);
  box-shadow:0 0 14px var(--glow,transparent), inset 0 0 0 1px rgba(255,255,255,.14);}
/* 樹脂のツヤ。透明感を出す */
.label::after{content:''; position:absolute; inset:0;
  background:linear-gradient(122deg,rgba(255,255,255,.22) 0 18%,transparent 34%);}
.cart .name{display:block; margin-top:7px; font-size:9.5px; letter-spacing:.09em;
  color:var(--muted); text-align:center;}
.cart.blank .shell{opacity:.45;}
.cart.blank .shell::after{opacity:.3;}
.cart.blank .label{background:repeating-linear-gradient(45deg,#171b26 0 6px,#12151e 6px 12px);}
/* 挿さっているカセットの跡。列に穴が空かないよう空のくぼみを残す */
.cart.inserted .shell{opacity:.3; box-shadow:inset 0 1px 0 rgba(255,255,255,.14);}
.cart.inserted .label{background:none; opacity:1; filter:none;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);}
.cart.inserted .name{color:var(--game);}

.toast{height:16px; margin-top:9px; text-align:center; font-size:10.5px;
  letter-spacing:.08em; color:var(--muted); opacity:0; transition:opacity .2s;}
.toast.show{opacity:1;}
@keyframes nudge{0%,100%{transform:translateX(0);} 25%{transform:translateX(-4px);} 75%{transform:translateX(4px);}}
.cart.nudge{animation:nudge .26s;}

/* ---------- 携帯機 ---------- */
.deck{position:relative; width:min(760px,100%); margin:52px auto 0;
  aspect-ratio:1600/760;
  /* 絵へ差し替えたら、ここの数値を測り直せば合う */
  --screen-x:33%; --screen-y:13%; --screen-w:34%; --screen-h:63%;
  --slot-x:50%;                       /* 上端の差込口の中心 */
  --play-x:38%; --play-y:80%; --play-w:24%; --play-h:14%;}

/* 潜り込むカセット。本体より下の層に置くので、下がるほど隠れる */
.cartFlight{position:absolute; left:var(--slot-x); top:0; width:22%;
  transform:translate(-50%,-105%); z-index:1; pointer-events:none; opacity:0;}
.cartFlight.go{animation:sink .55s cubic-bezier(.35,.05,.25,1) forwards;}
@keyframes sink{
  0%  {transform:translate(-50%,-118%); opacity:0;}
  28% {transform:translate(-50%,-88%);  opacity:1;}
  58% {transform:translate(-50%,-66%);  opacity:1;}
  100%{transform:translate(-50%,22%);   opacity:1;}
}
.cartFlight .shell{filter:drop-shadow(0 6px 10px rgba(0,0,0,.7));}

/* 本体。仮の図形。画像が来たらここを background へ置き換える */
.machine{position:absolute; inset:0; z-index:2; border-radius:22px/26px;
  background:
    linear-gradient(178deg,rgba(150,168,200,.14) 0 3%,rgba(30,36,50,.9) 4%,rgba(12,15,22,.96)),
    #0a0c12;
  border:1px solid rgba(190,210,255,.16);
  box-shadow:0 26px 44px rgba(0,0,0,.7), inset 0 2px 0 rgba(255,255,255,.16),
             inset 0 -14px 26px rgba(0,0,0,.6);}
/* スケルトン。内部の基板が透けて見え、挿さると配線がゲームの色に光る */
.pcb{position:absolute; inset:3% 2.5%; border-radius:16px; overflow:hidden; opacity:.4;
  background:
    linear-gradient(90deg,transparent 0 12%,var(--game-dim) 12% 12.4%,transparent 12.4% 30%,
      var(--game-dim) 30% 30.3%,transparent 30.3% 63%,var(--game-dim) 63% 63.4%,transparent 63.4%),
    linear-gradient(0deg,transparent 0 18%,var(--game-dim) 18% 18.7%,transparent 18.7% 52%,
      var(--game-dim) 52% 52.6%,transparent 52.6% 81%,var(--game-dim) 81% 81.6%,transparent 81.6%),
    repeating-linear-gradient(90deg,transparent 0 54px,rgba(255,255,255,.03) 54px 55px);
  transition:opacity .4s;}
.deck.on .pcb{opacity:1;}
.pcb::after{content:''; position:absolute; inset:0;
  background:radial-gradient(ellipse at 72% 50%,var(--game-dim),transparent 62%);
  opacity:0; transition:opacity .5s;}
.deck.on .pcb::after{opacity:1;}
/* 上端の差込口 */
.chip{position:absolute; border-radius:2px; background:rgba(6,9,15,.85);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.07), 0 1px 3px rgba(0,0,0,.6);}
.slotLip{position:absolute; left:var(--slot-x); top:-1.2%; transform:translateX(-50%);
  width:24%; height:4.5%; border-radius:4px 4px 2px 2px; background:#04050a; z-index:3;
  box-shadow:inset 0 4px 8px rgba(0,0,0,.95), 0 1px 0 rgba(255,255,255,.18);}

/* 候補の絵を敷いたときは、仮の図形を消す */
.deck.real .machine{background:var(--body) center/contain no-repeat; border:0; box-shadow:none;
  filter:drop-shadow(0 20px 26px rgba(0,0,0,.6));}
.deck.real .pcb,.deck.real .dpad,.deck.real .knobs,.deck.real .grill,.deck.real .chip,
.deck.real .slotLip{display:none;}
/* 内部の発光。絵のアルファを切り抜きに使い、暗い部分だけが色を拾うよう screen で重ねる。
   これが「背景の透過」を絶対条件にしている理由。 */
.bodyGlow{position:absolute; inset:0; z-index:2; pointer-events:none; opacity:0;
  -webkit-mask-image:var(--body); mask-image:var(--body);
  -webkit-mask-size:contain; mask-size:contain;
  -webkit-mask-repeat:no-repeat; mask-repeat:no-repeat;
  -webkit-mask-position:center; mask-position:center;
  background:radial-gradient(ellipse at 50% 55%,var(--game-dim),transparent 68%);
  mix-blend-mode:screen; transition:opacity .6s;}
/* 走る光より後に点く。同時だと走った瞬間が埋もれる */
.deck.on .bodyGlow{opacity:1; transition-delay:.55s;}
.deck:not(.real) .bodyGlow{display:none;}

/* 流れ込んだデータが本体の中を走る。
   線を1本描くとリボンに見えてしまうので、描くのは光だけにする。
   bodyGlow と同じくアルファで切り抜き、screen で重ねるので絵に馴染む。 */
.bodySurge{position:absolute; inset:0; z-index:2; pointer-events:none; opacity:0;
  -webkit-mask-image:var(--body); mask-image:var(--body);
  -webkit-mask-size:contain; mask-size:contain;
  -webkit-mask-repeat:no-repeat; mask-repeat:no-repeat;
  -webkit-mask-position:center; mask-position:center;
  background:linear-gradient(96deg,
    transparent 36%, var(--game-dim) 44%, var(--game) 50%,
    var(--game-dim) 56%, transparent 64%);
  background-size:300% 100%; background-position:150% 0;
  mix-blend-mode:screen;}
.deck.flow .bodySurge{animation:surge 1.15s cubic-bezier(.3,.5,.35,1);}
@keyframes surge{
  0%  {opacity:0; background-position:150% 0;}
  12% {opacity:.85;}
  78% {opacity:.72;}
  100%{opacity:0; background-position:-55% 0;}
}
.deck:not(.real) .bodySurge{display:none;}
@media (prefers-reduced-motion: reduce){ .deck.flow .bodySurge{animation:none;} }

/* 候補の切り替え */
.picker{display:flex; justify-content:center; gap:8px; margin:0 0 18px;}
.picker button{padding:7px 14px; font:inherit; font-size:11px; letter-spacing:.08em;
  background:rgba(12,16,26,.9); color:var(--muted); border:1px solid var(--line);
  border-radius:4px; cursor:pointer;}
.picker button[aria-pressed="true"]{color:var(--cyan); border-color:var(--cyan);
  box-shadow:0 0 12px rgba(32,230,255,.25);}

/* 吸い込まれた瞬間、差込口が一度だけ強く光る。
   「カセットを挿した」より「データを流し込んだ」に見せたいため */
.flash{position:absolute; left:var(--slot-x); top:0; transform:translate(-50%,-50%);
  width:30%; height:9%; border-radius:50%; z-index:3; pointer-events:none; opacity:0;
  background:radial-gradient(ellipse,var(--game) 0%,var(--game-dim) 42%,transparent 70%);}
.flash.go{animation:absorb .55s ease-out;}
@keyframes absorb{
  0%,52%{opacity:0; transform:translate(-50%,-50%) scaleX(.5);}
  66%   {opacity:1; transform:translate(-50%,-50%) scaleX(1.15);}
  100%  {opacity:0; transform:translate(-50%,-50%) scaleX(1.4);}
}

/* 画面 */
.screen{position:absolute; left:var(--screen-x); top:var(--screen-y);
  width:var(--screen-w); height:var(--screen-h); z-index:3;
  border-radius:8px; overflow:hidden; background:#03050b;
  box-shadow:inset 0 0 0 2px rgba(0,0,0,.9), inset 0 3px 16px rgba(0,0,0,.9),
             0 0 0 6px rgba(20,24,34,.9);}
.art{position:absolute; inset:0; background:var(--art,#0a0d16) center/cover no-repeat;
  opacity:0; transform:scale(1.06); transition:opacity .45s, transform .6s;}
.deck.on .art{opacity:1; transform:scale(1);}
/* 走査線。液晶っぽさを足す */
.screen::after{content:''; position:absolute; inset:0; pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.30) 0 2px,transparent 2px 4px);}
.caption{position:absolute; left:0; right:0; bottom:0; z-index:1;
  padding:9% 7% 6%; background:linear-gradient(transparent,rgba(0,0,0,.88) 45%);
  opacity:0; transition:opacity .45s;}
.deck.on .caption{opacity:1;}
.caption .t{font-family:'Press Start 2P',monospace; font-size:clamp(7px,1.35vw,11px);
  color:#fff; letter-spacing:.04em; line-height:1.5;}
.caption .d{margin-top:5px; font-size:clamp(7.5px,1.1vw,9.5px); color:#b9c6e2;}
.idle{position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  font-size:clamp(8px,1.3vw,11px); color:#3d4761; letter-spacing:.1em;}
.deck.on .idle{display:none;}

/* 操作系（飾り） */
.dpad{position:absolute; left:10%; top:30%; width:11%; aspect-ratio:1; z-index:3;}
.dpad i{position:absolute; background:linear-gradient(180deg,#2b3143,#141824);
  border-radius:3px; box-shadow:inset 0 1px 0 rgba(255,255,255,.14), 0 2px 4px rgba(0,0,0,.6);}
.dpad i:nth-child(1){left:34%; top:0; width:32%; height:100%;}
.dpad i:nth-child(2){top:34%; left:0; height:32%; width:100%;}
.knobs{position:absolute; right:8%; top:31%; width:20%; z-index:3;
  display:flex; gap:10%; transform:rotate(-14deg);}
.knobs b{flex:1; aspect-ratio:1; border-radius:50%;
  background:radial-gradient(circle at 34% 30%,#3a4157,#171c2a 60%,#0b0e16);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.2), 0 3px 6px rgba(0,0,0,.65);}
.grill{position:absolute; right:7%; bottom:8%; width:13%; height:13%; z-index:3;
  background:repeating-linear-gradient(114deg,rgba(255,255,255,.09) 0 2px,transparent 2px 7px);
  border-radius:3px;}

/* PLAY（本物のリンク） */
.play{position:absolute; left:var(--play-x); top:var(--play-y);
  width:var(--play-w); height:var(--play-h); z-index:4;
  display:flex; align-items:center; justify-content:center; text-decoration:none;
  font-family:'Press Start 2P',monospace; font-size:clamp(9px,1.6vw,13px);
  letter-spacing:.08em; color:var(--game); border-radius:40px;
  border:1px solid var(--game); background:rgba(4,7,14,.82);
  box-shadow:0 0 16px var(--game-dim), inset 0 1px 0 rgba(255,255,255,.12);
  transition:transform .1s, background .18s, color .18s;}
.play:hover,.play:focus-visible{background:var(--game); color:#04060d; outline:none;}
.play:active{transform:translateY(2px);}
.deck:not(.on) .play{display:none;}

@media (prefers-reduced-motion: reduce){
  .cartFlight.go{animation:none; opacity:0;}
  .cart,.art,.caption,.pcb{transition:none;}
}
@media (max-width:560px){
  .rack{gap:9px;} .cart{width:78px;}
  .deck{margin-bottom:92px;}
  /* 本体が小さくなるとPLAYが押しにくいので、下へ出して全幅にする */
  .play{left:0; top:100%; width:100%; height:auto; margin-top:14px; padding:14px 0;}
}

.note{width:min(880px,100%); margin:34px auto 0; padding:14px 16px;
  border:1px solid var(--line); background:rgba(17,20,37,.6);
  font-size:11px; line-height:1.9; color:var(--muted);}
.note b{color:var(--text);}
</style>
</head>
<body>

<h1>GAME CONSOLE</h1>
<p class="lead">カセットを選ぶと本体に吸い込まれます</p>

<div class="picker" id="picker"></div>

<div class="stage">
  <div class="rack" id="rack"></div>
  <div class="toast" id="toast"></div>

  <div class="deck" id="deck">
    <div class="cartFlight" id="flight"><span class="shell"><span class="label" id="flightLabel"></span></span></div>

    <div class="machine">
      <div class="pcb"></div>
      <span class="chip" style="left:22%; top:70%; width:11%; height:14%"></span>
      <span class="chip" style="left:70%; top:66%; width:9%;  height:11%"></span>
      <span class="chip" style="left:12%; top:14%; width:14%; height:5%"></span>
      <span class="chip" style="left:76%; top:14%; width:10%; height:5%"></span>
    </div>
    <!-- 発光は本体の絵より後に描く。同じ z-index なのでDOM順が描画順になり、
         前に置くと不透明な絵に隠れてしまう -->
    <div class="bodyGlow"></div>
    <div class="bodySurge"></div>
    <div class="slotLip"></div>
    <div class="flash" id="flash"></div>

    <div class="screen">
      <div class="art" id="art"></div>
      <div class="caption">
        <div class="t" id="capTitle"></div>
        <div class="d" id="capDesc"></div>
      </div>
      <div class="idle">NO CARTRIDGE</div>
    </div>

    <div class="dpad"><i></i><i></i></div>
    <div class="knobs"><b></b><b></b></div>
    <div class="grill"></div>

    <a class="play" id="playLink" href="#">PLAY</a>
  </div>
</div>

<div class="note">
  <b>これは試作です。</b>本体はCSSの図形で仮に組んであります。ゲームの絵は本物です。
  カセットもCSSで描いているので、<b>発注した殻の画像はもう要りません</b>。形も色も自由に変えられます。
  配置はGBA準拠（十字キー左・画面中央・ボタン右）、カセットもGBAと同じほぼ正方形にしてあります。
</div>

<script>
(function(){
  const GAMES = [
    { id:'hell', name:'HELL RUNNER', desc:'崩れる足場を駆け抜ける', href:'games/temple-run-clone.html',
      color:'#ff4b2b', art:"url('images/portal/cart-label-hell-runner.webp')" },
    { id:'boss', name:'討伐2048',     desc:'合体させてボスを討伐',   href:'games/boss-battle-demo.html',
      color:'#a855f7', art:"url('images/portal/cart-label-boss-2048.webp')" },
    { id:'hexa', name:'HEXAMINE',    desc:'分子構造を論理だけで復元', href:'games/hexamine.html',
      color:'#20e6ff', art:"url('images/portal/cart-label-hexamine.webp')" },
    { id:'next', name:'COMING SOON', desc:'次のゲームは準備中',      href:null, blank:true }
  ];

  // 届いた本体の候補。座標は絵から目視で拾った概算。選んだあと詰める。
  const SRC = 'images/portal/source/console-body-pattern-';
  const BODIES = [
    { n:0, name:'仮図形' },
    { n:1, name:'案1 標準',   screen:[31.6,18.4,36.9,49.3], play:[34.5,73.5,31,10.5], slot:50, cart:20 },
    { n:2, name:'案2 マンタ', screen:[36.2,20.3,27.5,42.2], play:[39.5,67.5,21,12],   slot:50, cart:15 },
    { n:3, name:'案3 六角',   screen:[34.1,22.0,31.6,43.4], play:[36.0,68.0,28,12.5], slot:50, cart:17 },
    { n:4, name:'案4 装置',   screen:[34.1,26.0,31.9,33.6], play:[36.0,62.5,28.8,11], slot:50, cart:16 }
  ];
  function useBody(b){
    const deck = document.getElementById('deck');
    if(!b.n){ deck.classList.remove('real'); deck.style.removeProperty('--body'); return; }
    deck.classList.add('real');
    // 採用した案1だけ変換済みの webp を使う。他は見比べ用なので原本のまま
    const url = (b.n === 1) ? 'images/portal/console-body.webp' : (SRC + b.n + '.png');
    deck.style.setProperty('--body', "url('" + url + "')");
    deck.style.setProperty('--screen-x', b.screen[0]+'%');
    deck.style.setProperty('--screen-y', b.screen[1]+'%');
    deck.style.setProperty('--screen-w', b.screen[2]+'%');
    deck.style.setProperty('--screen-h', b.screen[3]+'%');
    deck.style.setProperty('--play-x', b.play[0]+'%');
    deck.style.setProperty('--play-y', b.play[1]+'%');
    deck.style.setProperty('--play-w', b.play[2]+'%');
    deck.style.setProperty('--play-h', b.play[3]+'%');
    deck.style.setProperty('--slot-x', b.slot+'%');
    document.querySelector('.cartFlight').style.width = b.cart+'%';
  }

  const rack = document.getElementById('rack');
  const deck = document.getElementById('deck');
  const flight = document.getElementById('flight');
  const flightLabel = document.getElementById('flightLabel');
  const flash = document.getElementById('flash');
  const art = document.getElementById('art');
  const capT = document.getElementById('capTitle');
  const capD = document.getElementById('capDesc');
  const play = document.getElementById('playLink');
  const toast = document.getElementById('toast');
  const buttons = [];
  let inserted = null, toastTimer = null, onTimer = null;

  GAMES.forEach(g=>{
    const b = document.createElement('button');
    b.className = 'cart' + (g.blank ? ' blank' : '');
    b.type = 'button';
    b.setAttribute('aria-pressed','false');
    b.innerHTML = '<span class="shell"><span class="label"></span></span><span class="name"></span>';
    b.querySelector('.name').textContent = g.name;
    if(g.art) b.querySelector('.label').style.setProperty('--art', g.art);
    // 中で光っている状態にする。挿すとこの光がそのまま本体へ移る
    if(g.color) b.querySelector('.shell').style.setProperty('--glow', rgba(g.color, .45));
    b.addEventListener('click', ()=> insert(g, b));
    rack.appendChild(b);
    buttons.push(b);
  });

  function insert(g, btn){
    if(g.blank){
      // 空のカセットは挿さらない。挿さっているものを外す理由も無いので触らない
      btn.classList.remove('nudge'); void btn.offsetWidth; btn.classList.add('nudge');
      toast.textContent = '次のゲームは準備中です';
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(()=> toast.classList.remove('show'), 2400);
      return;
    }
    if(inserted === g.id) return;   // 同じものを挿し直さない

    toast.classList.remove('show');
    inserted = g.id;
    buttons.forEach((x,i)=>{
      const me = GAMES[i].id === g.id;
      x.setAttribute('aria-pressed', me ? 'true' : 'false');
      x.classList.toggle('inserted', me);
    });

    deck.style.setProperty('--game', g.color);
    deck.style.setProperty('--game-dim', rgba(g.color, .28));
    flightLabel.style.setProperty('--art', g.art);
    flight.querySelector('.shell').style.setProperty('--glow', rgba(g.color, .6));
    art.style.setProperty('--art', g.art);
    capT.textContent = g.name;
    capD.textContent = g.desc;
    play.href = g.href;
    play.setAttribute('aria-label', g.name + 'をプレイ');

    // 落とし込む。潜り切ってから画面を点ける
    deck.classList.remove('on');
    flight.classList.remove('go');
    void flight.offsetWidth;
    flight.classList.add('go');
    flash.classList.remove('go'); void flash.offsetWidth; flash.classList.add('go');
    // 本体の内部を光が走る
    deck.classList.remove('flow'); void deck.offsetWidth;
    setTimeout(()=> deck.classList.add('flow'), calmNow() ? 0 : 400);
    clearTimeout(onTimer);
    const calm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    onTimer = setTimeout(()=> deck.classList.add('on'), calm ? 0 : 430);
  }

  function calmNow(){ return window.matchMedia('(prefers-reduced-motion: reduce)').matches; }
  function rgba(hex, a){
    const n = parseInt(hex.slice(1), 16);
    return 'rgba(' + (n>>16 & 255) + ',' + (n>>8 & 255) + ',' + (n & 255) + ',' + a + ')';
  }

  // 切り替えボタン
  const picker = document.getElementById('picker');
  const pbtns = [];
  BODIES.forEach(b=>{
    const el = document.createElement('button');
    el.type='button'; el.textContent = b.name; el.setAttribute('aria-pressed','false');
    el.addEventListener('click', ()=>{
      useBody(b);
      pbtns.forEach(x=> x.setAttribute('aria-pressed','false'));
      el.setAttribute('aria-pressed','true');
    });
    picker.appendChild(el); pbtns.push(el);
  });

  insert(GAMES[2], buttons[2]);
  pbtns[1].click();   // 既定は案1
})();
</script>
</body>
</html>
