<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CHAMPIONSHIP RE — Character Art Review</title>
  <style>
    :root { color-scheme:dark; font-family:Arial,sans-serif; background:#060a10; color:#e7eef4; }
    body { margin:0; padding:18px 12px 48px; background:radial-gradient(circle at 50% 0,#142637,#060a10 45%); }
    main { max-width:720px; margin:auto; }
    h1 { margin:0; font-size:18px; letter-spacing:.08em; } p { color:#aebdca; line-height:1.55; font-size:13px; }
    .tools { position:sticky; top:0; z-index:2; padding:10px 0; background:rgba(6,10,16,.94); }
    button { min-height:40px; padding:0 14px; border:1px solid #77dce2; background:#102732; color:#dffcff; font-weight:bold; }
    .list { display:grid; gap:14px; }
    article { border:1px solid #3d5a6c; background:#0c151e; overflow:hidden; }
    h2 { margin:0; padding:11px 12px 4px; font-size:16px; } .status { margin:0; padding:0 12px 10px; color:#ffce7b; font-size:12px; }
    .pair { display:grid; grid-template-columns:1fr 1fr; gap:1px; background:#3d5a6c; }
    figure { min-width:0; margin:0; background:#111820; } figcaption { padding:8px; color:#c9d5de; font-size:11px; font-weight:bold; }
    .asset { aspect-ratio:2/3; display:grid; place-items:center; background-color:#161d25; background-image:linear-gradient(45deg,#252d35 25%,transparent 25%),linear-gradient(-45deg,#252d35 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#252d35 75%),linear-gradient(-45deg,transparent 75%,#252d35 75%); background-size:24px 24px; background-position:0 0,0 12px,12px -12px,-12px 0; }
    .asset.black { background:#020407; background-image:none; } .asset img { width:100%; height:100%; object-fit:contain; }
    .pending { color:#6f8190; font-size:12px; text-align:center; padding:24px 8px; }
    details { margin:10px; border-top:1px solid #304657; padding-top:8px; } summary { color:#8de9ef; font-size:12px; font-weight:bold; cursor:pointer; }
    .sheet { position:relative; margin-top:10px; background:#020407; } .sheet img { width:100%; display:block; }
    .guide { position:absolute; top:0; bottom:0; width:2px; background:#f5d36b; box-shadow:0 0 0 1px #020407; pointer-events:none; }
    .cut-fields { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px; } label { display:grid; gap:4px; color:#b9c9d5; font-size:11px; }
    input { min-height:34px; box-sizing:border-box; width:100%; border:1px solid #4d7187; background:#07131b; color:#edfbff; font-weight:bold; padding:0 7px; }
    .copy-cut { width:100%; margin-top:10px; }
  </style>
</head>
<body>
  <main>
    <h1>CHAMPIONSHIP RE / ART REVIEW</h1>
    <p>生成途中の確認専用。通常と選択を並べて、同一人物性・身長・足元・透過縁を携帯で確認する。ここに載っただけでは採用ではない。</p>
    <div class="tools"><button id="background">黒背景で確認</button></div>
    <section class="list" id="list"></section>
  </main>
  <script>
    const rows = [
      ['raven','RAVEN','生成途中（ペアと全体の統一感を検収中）','raven-normal.png','raven-selected.png'],
      ['mika','MIKA','生成途中（ペアと全体の統一感を検収中）','mika-normal.png','mika-selected.png'],
      ['brick','BRICK','生成途中（ペアと全体の統一感を検収中）','brick-normal.png','brick-selected.png'],
      ['noise','NOISE','生成途中（ペアと全体の統一感を検収中）','noise-normal.png','noise-selected.png'],
      ['kiri','KIRI','生成途中（ペアと全体の統一感を検収中）','kiri-normal.png','kiri-selected.png'],
      ['vivi','VIVI','生成途中（ペアと全体の統一感を検収中）','vivi-normal.png','vivi-selected.png'],
      ['to9','TΩ9','生成途中（ペアと全体の統一感を検収中）','to9-normal.png','to9-selected.png']
    ];
    const root = document.querySelector('#list');
    for (const [key,name,status,normal,selected] of rows) {
      const card = document.createElement('article');
      card.innerHTML = `<h2>${name}</h2><p class="status">${status}</p><div class="pair">${slot('NORMAL',normal)}${slot('SELECTED',selected)}</div>${cutTuner(key)}`;
      root.append(card);
    }
    function slot(label,file) {
      return `<figure><figcaption>${label}</figcaption><div class="asset">${file ? `<img src="assets/championship-re/gates/reviews/v11/${file}" alt="${label}">` : '<div class="pending">PENDING</div>'}</div></figure>`;
    }
    function cutTuner(key) {
      return `<details><summary>✂ CUT TUNER — 元シート上で切り取り範囲を指定</summary><p class="status">武器や翼が境界をまたぐ場合、左右それぞれの開始／終了を％で指定。線がその範囲を示す。数値をコピーして送って。</p><div class="sheet"><img src="assets/championship-re/gates/reviews/v11-sheets/${key}.png" alt="${key} source sheet"><i class="guide" data-guide="${key}:normal-left"></i><i class="guide" data-guide="${key}:normal-right"></i><i class="guide" data-guide="${key}:selected-left"></i><i class="guide" data-guide="${key}:selected-right"></i></div><div class="cut-fields">${field(key,'normal-left','NORMAL 開始',0)}${field(key,'normal-right','NORMAL 終了',50)}${field(key,'selected-left','SELECTED 開始',50)}${field(key,'selected-right','SELECTED 終了',100)}</div><button class="copy-cut" data-copy="${key}">このキャラのカット値をコピー</button></details>`;
    }
    function field(key,field,label,value) { return `<label>${label}<input type="number" min="0" max="100" step="0.1" value="${value}" data-cut="${key}:${field}"></label>`; }
    document.addEventListener('input',(event)=>{ if (!event.target.matches('[data-cut]')) return; const [key,field]=event.target.dataset.cut.split(':'); document.querySelector(`[data-guide="${key}:${field}"]`)?.style.setProperty('left',`${event.target.value}%`); localStorage.setItem(`champion-cut-${key}-${field}`,event.target.value); });
    document.querySelectorAll('[data-cut]').forEach((input)=>{ const [key,field]=input.dataset.cut.split(':'); const saved=localStorage.getItem(`champion-cut-${key}-${field}`); if(saved!==null){ input.value=saved; input.dispatchEvent(new Event('input')); } else input.dispatchEvent(new Event('input')); });
    document.addEventListener('click',async(event)=>{ const key=event.target.dataset.copy; if(!key) return; const values={}; document.querySelectorAll(`[data-cut^="${key}:"]`).forEach((input)=>values[input.dataset.cut.split(':')[1]]=Number(input.value)); await navigator.clipboard.writeText(JSON.stringify({[key]:values})); event.target.textContent='コピー済み'; setTimeout(()=>event.target.textContent='このキャラのカット値をコピー',1200); });
    document.querySelector('#background').addEventListener('click',(event)=>{
      document.querySelectorAll('.asset').forEach((item)=>item.classList.toggle('black'));
      event.currentTarget.textContent = document.querySelector('.asset').classList.contains('black') ? '市松で確認' : '黒背景で確認';
    });
  </script>
</body>
</html>
