<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>本日の最強決定戦 | IN DEVELOPMENT</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;background:#050915;color:#eef5ff;font-family:system-ui,"Yu Gothic",sans-serif}.wrap{width:min(1100px,100%);margin:auto;padding:22px 16px 38px}.back{display:inline-block;color:#b6c6e5;font-size:12px;text-decoration:none;margin-bottom:14px}.back:hover,.back:focus-visible{color:#ffdc42}.eyebrow{color:#ffdc42;font-weight:800;letter-spacing:.12em;font-size:12px}.title{font-size:clamp(27px,7vw,54px);margin:4px 0 0;letter-spacing:.04em}.sub{margin:4px 0 20px;color:#aebbd1;font-size:14px}.selection{margin-bottom:18px}.selection-label{margin:0 0 8px;font-weight:800;color:#b7c6e3;font-size:13px}.cards{display:grid;grid-template-columns:repeat(5,minmax(100px,1fr));gap:9px}.card{appearance:none;cursor:pointer;min-height:180px;border:1px solid #354466;background:#0e1426;color:#fff;padding:0;text-align:left;position:relative;overflow:hidden}.card::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 35%,#071021ee)}.card img{display:block;width:100%;height:180px;object-fit:cover;object-position:center top;opacity:.68;transition:.18s}.card strong,.card small{position:absolute;z-index:1;left:10px}.card strong{bottom:24px;font-size:15px;letter-spacing:.08em}.card small{bottom:9px;color:#d0dcf6}.card[aria-pressed="true"]{border-color:#ffdc42;box-shadow:0 0 0 2px #ffdc4255}.card[aria-pressed="true"] img{opacity:1;transform:scale(1.04)}.duel-start{display:block;width:min(420px,100%);margin:14px auto 0;padding:14px;border:1px solid #ffdc42;background:#17182a;color:#ffdc42;font:800 16px inherit;letter-spacing:.1em;cursor:pointer}.duel-start:hover,.duel-start:focus-visible{background:#ffdc42;color:#10111c}.retry[hidden]{display:none}.stage{position:relative;overflow:hidden;min-height:clamp(370px,58vw,570px);border:1px solid #313d5a;background:#071121 url('../images/todays-champion/stage-bg.webp') center/cover;touch-action:manipulation;cursor:default}.stage::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#02081466 22%,transparent 48%,#02040bb8 100%);pointer-events:none}.stage.live{cursor:crosshair}.signal{position:relative;z-index:5;text-align:center;padding:20px 0 3px;font-weight:900;letter-spacing:.2em;color:#bfeeff;font-size:clamp(16px,4vw,28px);text-shadow:0 0 16px #55bfff}.vs{position:absolute;z-index:4;left:50%;top:51%;transform:translate(-50%,-50%);font-size:42px;font-weight:1000;color:#ffdc42;text-shadow:0 0 15px #f77720}.fighters{position:absolute;z-index:2;inset:48px 0 0;display:grid;grid-template-columns:1fr 1fr;align-items:end}.fighter{height:100%;position:relative;transform-origin:bottom center}.fighter canvas{position:absolute;bottom:-28px;width:100%;height:min(102%,500px);image-rendering:pixelated;mix-blend-mode:screen}.name{position:absolute;bottom:24px;left:18px;font-weight:900;letter-spacing:.08em;text-shadow:0 2px 0 #000}.right .name{left:auto;right:18px}.stage[data-result="left"] .left-fighter{animation:dash-right .32s cubic-bezier(.1,.85,.22,1) both}.stage[data-result="left"] .right-fighter{animation:fall-right .42s .16s cubic-bezier(.15,.8,.2,1) both}.stage[data-result="right"] .right-fighter{animation:dash-left .32s cubic-bezier(.1,.85,.22,1) both}.stage[data-result="right"] .left-fighter{animation:fall-left .42s .16s cubic-bezier(.15,.8,.2,1) both}.stage[data-result="foul"] .left-fighter{animation:fall-left .42s cubic-bezier(.15,.8,.2,1) both}.stage[data-result="foul"] .right-fighter{animation:dash-left .32s cubic-bezier(.1,.85,.22,1) both}@keyframes dash-right{0%{transform:translateX(0)}58%{transform:translateX(96px) scale(1.06)}100%{transform:translateX(70px) scale(1.03)}}@keyframes dash-left{0%{transform:translateX(0)}58%{transform:translateX(-96px) scale(1.06)}100%{transform:translateX(-70px) scale(1.03)}}@keyframes fall-left{0%{filter:brightness(1)}16%{filter:brightness(2.6)}100%{transform:translate(-75px,50px) rotate(-14deg);opacity:.62;filter:brightness(.65)}}@keyframes fall-right{0%{filter:brightness(1)}16%{filter:brightness(2.6)}100%{transform:translate(75px,50px) rotate(14deg);opacity:.62;filter:brightness(.65)}}.duel-result{min-height:26px;text-align:center;margin:12px 0 8px;font-weight:800;color:#d8e5ff}.hint{text-align:center;color:#8d9bb8;font-size:13px;margin:18px 0 0}.in-duel .selection{display:none}.in-duel .sub{margin-bottom:10px}.in-duel .hint{display:none}@media(max-width:620px){.wrap{padding:18px 10px 28px}.cards{grid-template-columns:repeat(5,1fr);gap:5px}.card{min-height:128px}.card img{height:128px}.card strong{left:5px;bottom:20px;font-size:11px}.card small{left:5px;bottom:6px;font-size:9px}.stage{min-height:410px}.fighters{inset:45px 0 0}.fighter canvas{height:385px;bottom:0}.name{bottom:14px;left:9px;font-size:12px}.right .name{right:9px}.vs{font-size:29px;top:54%}}@media(prefers-reduced-motion:reduce){.stage[data-result] .fighter{animation:none}}
.fighter canvas{mix-blend-mode:normal}.stage[data-result]::after{content:"";position:absolute;z-index:6;left:50%;top:60%;width:14px;height:14px;border-radius:50%;background:#fff9bb;box-shadow:0 0 0 7px #ffcf4266,0 0 30px 16px #ff8d2455;animation:impact .28s ease-out both;pointer-events:none}@keyframes impact{0%{transform:translate(-50%,-50%) scale(.2);opacity:1}100%{transform:translate(-50%,-50%) scale(5);opacity:0}}.card .card-sprite{position:absolute;z-index:1;inset:auto 0 7px;width:100%;height:118px;pointer-events:none;image-rendering:pixelated}.card strong,.card small{z-index:2}.drone{position:absolute;z-index:4;left:50%;top:76px;width:34px;height:16px;transform:translateX(-50%);border:2px solid #6a7999;border-radius:50%;background:#101b31;box-shadow:0 0 8px #000}.drone::before{content:"";position:absolute;left:50%;top:4px;width:7px;height:7px;transform:translateX(-50%);border-radius:50%;background:#8090b5;box-shadow:0 0 8px #8090b5}.drone::after{content:"";position:absolute;left:50%;top:14px;width:1px;height:190px;transform:translateX(-50%);background:linear-gradient(#ff3654aa,transparent);opacity:0}.stage[data-phase="waiting"] .drone{border-color:#ff596d;animation:drone-hover .85s ease-in-out infinite}.stage[data-phase="waiting"] .drone::before{background:#ff3654;box-shadow:0 0 12px #ff3654}.stage[data-phase="waiting"] .drone::after{opacity:1;animation:scan 1.1s linear infinite}.stage[data-phase="signal"] .drone{border-color:#c9f8ff;box-shadow:0 0 18px #75edff;animation:drone-engage .36s ease-out infinite alternate}.stage[data-phase="signal"] .drone::before{background:#d8fbff;box-shadow:0 0 22px 8px #4de8ff}.stage[data-phase="signal"]::before{background:linear-gradient(180deg,#7eeeff4d 0,transparent 52%,#68dfff33 100%)}@keyframes drone-hover{50%{transform:translate(-50%,-4px)}}@keyframes scan{0%{transform:translate(-50%,0)}100%{transform:translate(-50%,42px)}}@keyframes drone-engage{to{transform:translateX(-50%) scale(1.18)}}.caution{position:absolute;z-index:9;inset:0;display:grid;place-content:center;text-align:center;background:repeating-linear-gradient(-45deg,#15100b 0 20px,#ffd02d 20px 40px);color:#111;font-size:clamp(34px,11vw,72px);font-weight:1000;letter-spacing:.08em;text-shadow:2px 2px #ffe68a}.caution[hidden]{display:none}.caution small{font-size:.28em;letter-spacing:.18em}.score-form{display:flex;gap:7px;justify-content:center;align-items:center;margin:10px auto;max-width:420px;font-size:13px}.score-form[hidden]{display:none}.score-form input{width:150px;padding:9px;background:#0b1122;border:1px solid #60729b;color:#fff}.score-form button{padding:9px 12px;border:1px solid #ffdc42;background:#17182a;color:#ffdc42;font:800 12px inherit}
/* 決着後も背景と両キャラを見せるため、踏み込み・倒れ込みは半歩ぶんに留める。 */
@keyframes dash-right{0%{transform:translateX(0)}58%{transform:translateX(48px) scale(1.04)}100%{transform:translateX(36px) scale(1.02)}}@keyframes dash-left{0%{transform:translateX(0)}58%{transform:translateX(-48px) scale(1.04)}100%{transform:translateX(-36px) scale(1.02)}}@keyframes fall-left{0%{filter:brightness(1)}16%{filter:brightness(2.6)}100%{transform:translate(-24px,24px) rotate(-8deg);opacity:.76;filter:brightness(.65)}}@keyframes fall-right{0%{filter:brightness(1)}16%{filter:brightness(2.6)}100%{transform:translate(24px,24px) rotate(8deg);opacity:.76;filter:brightness(.65)}}
</style>
</head>
<body>
<main class="wrap">
  <a class="back" href="../index.html">← GAME BASE</a>
  <div class="eyebrow">IN DEVELOPMENT / TODAY'S DUEL</div>
  <h1 class="title">本日の最強決定戦</h1>
  <p class="sub">選んだキャラで、雨の路地にいるNPCへ反応速度で挑め。</p>
  <section class="selection" id="selection" aria-label="キャラクター選択">
    <p class="selection-label">FIGHTER SELECT</p>
    <div class="cards" id="cards"></div>
    <button class="duel-start" id="duelStart" type="button">START DUEL</button>
  </section>
  <section class="stage" id="stage" aria-label="反応速度の決闘">
    <div class="drone" aria-hidden="true"></div>
    <div class="caution" id="caution" hidden>CAUTION!<small>CURRENT CHAMPION</small></div>
    <div class="signal" id="signal">SELECT A FIGHTER</div><div class="vs">VS</div>
    <div class="fighters"><div class="fighter left-fighter"><canvas id="left" width="500" height="660"></canvas><div class="name" id="leftName"></div></div><div class="fighter right right-fighter"><canvas id="right" width="500" height="660"></canvas><div class="name" id="rightName"></div></div></div>
  </section>
  <p class="duel-result" id="result" aria-live="polite">キャラを選んで START DUEL。</p>
  <button class="duel-start retry" id="retry" type="button" hidden>RETRY DUEL</button>
  <form class="score-form" id="scoreForm" hidden><label>今日の記録へ登録 <input id="playerName" maxlength="20" required placeholder="PLAYER NAME"></label><button type="submit">REGISTER</button></form>
  <p class="hint">※ 日替わり王者・ランキングは実装中。ボイスは追加予定。</p>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const fighters=[
  {id:'raven',name:'RAVEN',tag:'ZERO BLADE',color:'#32d9ff',portrait:'../images/todays-champion/portraits/raven.webp'},
  {id:'mika',name:'MIKA',tag:'PINK RIOT',color:'#ff4ca9',portrait:'../images/todays-champion/portraits/mika.webp'},
  {id:'brick',name:'BRICK',tag:'IRON FIST',color:'#ff9c20',portrait:'../images/todays-champion/portraits/brick.webp'},
  {id:'noise',name:'NOISE',tag:'BEAT BREAKER',color:'#9a62ff',portrait:'../images/todays-champion/portraits/noise.webp'},
  {id:'kiri',name:'KIRI',tag:'GHOST SIGNAL',color:'#d5a4ff',portrait:'../images/todays-champion/portraits/kiri.webp'}
];
const sheet=new Image();sheet.src='../images/todays-champion/chibi-duel-poses.webp';
const resultSheet=new Image();resultSheet.src='../images/todays-champion/chibi-result-poses-v2.webp';
const sb=window.supabase?supabase.createClient('https://hqbjlblvijynijvgknih.supabase.co','sb_publishable_QSUrJMJKz0tZwBYBiskyWQ_usDk6Wj9'):null;
const RANK_TABLE='todays_champion_scores',NPC_BENCHMARK_MS=280;
let selected=0,opponent=3,champion=null,lastWinMs=null,leftPose=0,rightPose=0,state='select',signalAt=0,npcMs=0,waitTimer=null,npcTimer=null,resultTimer=null;
const cards=document.querySelector('#cards'),stage=document.querySelector('#stage'),result=document.querySelector('#result'),start=document.querySelector('#duelStart'),retry=document.querySelector('#retry'),caution=document.querySelector('#caution'),scoreForm=document.querySelector('#scoreForm'),playerName=document.querySelector('#playerName');
let audioCtx=null;
// 音源ファイルを増やさず、短音だけを端末内で合成する。最初のSTARTタップで解禁するため、
// Safariでも合図や決着だけが無音になる自動再生制限を避けられる。
function unlockAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();}
function tone(freq,seconds,type='sine',gain=.05,slide=0){if(!audioCtx)return;const t=audioCtx.currentTime,o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.setValueAtTime(freq,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,freq+slide),t+seconds);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(gain,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+seconds);o.connect(g).connect(audioCtx.destination);o.start(t);o.stop(t+seconds+.02);}
function sfx(kind){if(!audioCtx)return;if(kind==='scan'){tone(132,.11,'square',.035,36);setTimeout(()=>tone(168,.08,'square',.025,-24),100);}if(kind==='engage'){tone(440,.08,'sine',.07,380);setTimeout(()=>tone(880,.16,'sine',.08,620),55);}if(kind==='hit'){tone(130,.09,'sawtooth',.09,-75);setTimeout(()=>tone(520,.055,'square',.045,-180),25);}if(kind==='win'){tone(523,.09,'square',.05,100);setTimeout(()=>tone(784,.16,'sine',.07,220),90);}if(kind==='lose'){tone(210,.16,'sawtooth',.06,-115);}}
fighters.forEach((f,i)=>{const b=document.createElement('button');b.type='button';b.className='card';b.setAttribute('aria-pressed',String(i===0));b.innerHTML=`<img src="${f.portrait}" alt="${f.name}"><canvas class="card-sprite" data-index="${i}" width="180" height="240"></canvas><strong>${f.name}</strong><small>${f.tag}</small>`;b.addEventListener('click',()=>{if(state==='waiting'||state==='signal')return;selected=i;if(!champion)opponent=(selected+3)%fighters.length;document.querySelectorAll('.card').forEach((el,n)=>el.setAttribute('aria-pressed',String(n===i)));ready();});cards.append(b)});
// 生成したポーズ表は行の間隔が等しくない。均等に切ると次の行の頭が足元へ混ざるため、
// ちびキャラ用シートは5列×6行を厳密に揃え、待機だけでも2コマを持たせる。
const FRAME_W=230,FRAME_H=228;
function draw(canvas,index,flip,pose){const c=canvas.getContext('2d');c.imageSmoothingEnabled=false;c.clearRect(0,0,500,660);const result=pose===6||pose===7;if(result){if(!resultSheet.complete)return;const cellW=resultSheet.naturalWidth/5,cellH=resultSheet.naturalHeight/2,dw=245,dh=245,dx=(500-dw)/2,dy=510-dh;c.save();if(flip){c.translate(500,0);c.scale(-1,1)}c.drawImage(resultSheet,index*cellW,pose===6?0:cellH,cellW,cellH,dx,dy,dw,dh);c.restore();return;}if(!sheet.complete)return;const dw=255,dh=255,sx=index*FRAME_W+20,sy=pose*FRAME_H+22,dx=(500-dw)/2,dy=510-dh;c.save();if(flip){c.translate(500,0);c.scale(-1,1)}c.drawImage(sheet,sx,sy,190,190,dx,dy,dw,dh);c.restore();}
function renderCardSprites(){if(!sheet.complete)return;document.querySelectorAll('.card-sprite').forEach(canvas=>{const i=Number(canvas.dataset.index),c=canvas.getContext('2d');c.imageSmoothingEnabled=false;c.clearRect(0,0,180,240);c.drawImage(sheet,i*FRAME_W+20,22,190,190,15,22,150,150);});}
function todayJst(){const p=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts();return Number(p.filter(x=>x.type!=='literal').map(x=>x.value).join(''));}
async function loadChampion(){if(!sb)return;const {data,error}=await sb.from(RANK_TABLE).select('name,character_id,ms').eq('day',todayJst()).order('ms',{ascending:true}).limit(1);if(error||!data?.[0]||data[0].ms>=NPC_BENCHMARK_MS)return;champion=data[0];opponent=Math.max(0,fighters.findIndex(f=>f.id===champion.character_id));render();}
function render(){draw(document.querySelector('#left'),selected,false,leftPose);draw(document.querySelector('#right'),opponent,true,rightPose);const a=fighters[selected],b=fighters[opponent];document.querySelector('#leftName').textContent=a.name;document.querySelector('#leftName').style.color=a.color;document.querySelector('#rightName').textContent=champion?champion.name:b.name;document.querySelector('#rightName').style.color=b.color;}
function ready(){clearTimeout(waitTimer);clearTimeout(npcTimer);clearTimeout(resultTimer);state='select';leftPose=0;rightPose=0;stage.dataset.result='';stage.dataset.phase='select';stage.classList.remove('live');document.body.classList.remove('in-duel');retry.hidden=true;scoreForm.hidden=true;document.querySelector('#signal').textContent='SELECT A FIGHTER';result.textContent='キャラを選んで START DUEL。';start.textContent='START DUEL';renderCardSprites();render();}
function startRound(){state='waiting';leftPose=2;rightPose=2;stage.dataset.result='';stage.dataset.phase='waiting';stage.classList.add('live');document.body.classList.add('in-duel');retry.hidden=true;caution.hidden=true;document.querySelector('#signal').textContent='DRONE SCANNING';result.textContent='合図が出るまで、路地をタップしない。';sfx('scan');render();waitTimer=setTimeout(signal,1500+Math.random()*2500);}
function begin(){unlockAudio();clearTimeout(waitTimer);clearTimeout(npcTimer);clearTimeout(resultTimer);scoreForm.hidden=true;if(champion){state='caution';stage.dataset.phase='caution';stage.classList.add('live');document.body.classList.add('in-duel');caution.hidden=false;document.querySelector('#signal').textContent='CHAMPION DETECTED';result.textContent=`${champion.name}  ${champion.ms}ms が今日の最強。`;waitTimer=setTimeout(startRound,950);return;}startRound();}
function signal(){state='signal';stage.dataset.phase='signal';signalAt=performance.now();document.querySelector('#signal').textContent='ENGAGE!';result.textContent='今！ 決闘画面をタップ！';sfx('engage');npcMs=310+Math.round(Math.random()*110);npcTimer=setTimeout(()=>resolve(false,null,npcMs),npcMs);}
function resolve(win,playerMs,npcMs){if(state!=='signal')return;clearTimeout(npcTimer);state='result';lastWinMs=win&&playerMs>=90?playerMs:null;stage.dataset.phase='result';leftPose=win?3:2;rightPose=win?2:3;stage.dataset.result='';retry.hidden=false;scoreForm.hidden=!lastWinMs;document.querySelector('#signal').textContent=win?'YOU WIN!':'NPC WINS';result.textContent=win?`WIN  ${playerMs}ms  /  NPC ${npcMs}ms`:`LOSE  ${playerMs===null?'NPC '+npcMs+'ms':playerMs+'ms  /  NPC '+npcMs+'ms'}`;render();resultTimer=setTimeout(()=>{leftPose=win?4:2;rightPose=win?2:4;stage.dataset.result=win?'left':'right';sfx('hit');render();resultTimer=setTimeout(()=>{leftPose=win?6:7;rightPose=win?7:6;sfx(win?'win':'lose');render();},110);},100);}
function foul(){clearTimeout(waitTimer);state='result';stage.dataset.phase='result';leftPose=2;rightPose=3;stage.dataset.result='';retry.hidden=false;document.querySelector('#signal').textContent='FEINT!';result.textContent='フライング！ この試合はNPCの勝ち。';render();resultTimer=setTimeout(()=>{leftPose=2;rightPose=4;stage.dataset.result='foul';sfx('hit');render();resultTimer=setTimeout(()=>{leftPose=7;rightPose=6;sfx('lose');render();},110);},100);}
stage.addEventListener('pointerdown',()=>{if(state==='waiting')foul();else if(state==='signal'){const playerMs=Math.round(performance.now()-signalAt);resolve(playerMs<npcMs,playerMs,npcMs);}});
start.addEventListener('click',begin);
retry.addEventListener('click',begin);
scoreForm.addEventListener('submit',async e=>{e.preventDefault();const name=playerName.value.trim();if(!sb||!name||!lastWinMs)return;const button=scoreForm.querySelector('button');button.disabled=true;const {error}=await sb.from(RANK_TABLE).insert({day:todayJst(),name,character_id:fighters[selected].id,ms:lastWinMs});button.disabled=false;if(error){result.textContent='登録できませんでした。通信を確認してもう一度。';return;}scoreForm.hidden=true;result.textContent=`REGISTERED  ${name}  ${lastWinMs}ms`;champion=null;await loadChampion();});
setInterval(()=>{if(state==='select'){leftPose=leftPose===0?1:0;rightPose=rightPose===0?1:0;render();}},460);
sheet.addEventListener('load',ready);ready();loadChampion();
</script>
</body>
</html>
