<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>本日の最強決定戦 | IN DEVELOPMENT</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;background:#050915;color:#eef5ff;font-family:system-ui,"Yu Gothic",sans-serif}.wrap{width:min(1100px,100%);margin:auto;padding:22px 16px 38px}.back{display:inline-block;color:#b6c6e5;font-size:12px;text-decoration:none;margin-bottom:14px}.back:hover,.back:focus-visible{color:#ffdc42}.eyebrow{color:#ffdc42;font-weight:800;letter-spacing:.12em;font-size:12px}.title{font-size:clamp(27px,7vw,54px);margin:4px 0 0;letter-spacing:.04em}.sub{margin:4px 0 20px;color:#aebbd1;font-size:14px}.stage{position:relative;overflow:hidden;min-height:390px;border:1px solid #313d5a;background:radial-gradient(circle at 50% 25%,#372158 0,transparent 42%),linear-gradient(#111a34,#050812);touch-action:manipulation;cursor:crosshair}.stage::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 47px,#ffffff09 48px 49px),linear-gradient(180deg,transparent 70%,#04050e);pointer-events:none}.signal{position:relative;z-index:2;text-align:center;padding:18px 0 3px;font-weight:900;letter-spacing:.2em;color:#bfeeff;font-size:clamp(16px,4vw,28px);text-shadow:0 0 16px #55bfff}.fighters{position:relative;z-index:1;display:grid;grid-template-columns:1fr 1fr;align-items:end;min-height:310px}.fighter{height:305px;position:relative}.fighter canvas{position:absolute;bottom:-22px;width:100%;height:330px;image-rendering:pixelated}.name{position:absolute;bottom:12px;left:14px;font-weight:900;letter-spacing:.08em;text-shadow:0 2px 0 #000}.right .name{left:auto;right:14px}.vs{position:absolute;z-index:3;left:50%;top:56%;transform:translate(-50%,-50%);font-size:42px;font-weight:1000;color:#ffdc42;text-shadow:0 0 15px #f77720}.duel-result{min-height:26px;text-align:center;margin:12px 0 8px;font-weight:800;color:#d8e5ff}.duel-start{display:block;width:min(420px,100%);margin:0 auto 18px;padding:14px;border:1px solid #ffdc42;background:#17182a;color:#ffdc42;font:800 16px inherit;letter-spacing:.1em;cursor:pointer}.duel-start:hover,.duel-start:focus-visible{background:#ffdc42;color:#10111c}.cards{display:grid;grid-template-columns:repeat(5,minmax(100px,1fr));gap:9px}.card{appearance:none;cursor:pointer;min-height:180px;border:1px solid #354466;background:#0e1426;color:#fff;padding:0;text-align:left;position:relative;overflow:hidden}.card::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 35%,#071021ee)}.card img{display:block;width:100%;height:180px;object-fit:cover;object-position:center top;opacity:.68;transition:.18s}.card strong,.card small{position:absolute;z-index:1;left:10px}.card strong{bottom:24px;font-size:15px;letter-spacing:.08em}.card small{bottom:9px;color:#d0dcf6}.card[aria-pressed="true"]{border-color:#ffdc42;box-shadow:0 0 0 2px #ffdc4255}.card[aria-pressed="true"] img{opacity:1;transform:scale(1.04)}.hint{text-align:center;color:#8d9bb8;font-size:13px;margin:18px 0 0}@media(max-width:620px){.wrap{padding:18px 10px 28px}.stage{min-height:330px}.fighters{min-height:250px}.fighter{height:255px}.fighter canvas{height:280px;bottom:-18px}.cards{grid-template-columns:repeat(5,1fr);gap:5px}.card{min-height:128px}.card img{height:128px}.card strong{left:5px;bottom:20px;font-size:11px}.card small{left:5px;bottom:6px;font-size:9px}.vs{font-size:29px}}
</style>
</head>
<body>
<main class="wrap">
  <a class="back" href="../index.html">← GAME BASE</a>
  <div class="eyebrow">IN DEVELOPMENT / MOTION CHECK</div>
  <h1 class="title">本日の最強決定戦</h1>
  <p class="sub">キャラを選んで、監視ドローンの合図へタップ。NPCとの練習決闘ができます。</p>
  <section class="stage" id="stage" aria-label="反応速度の練習決闘">
    <div class="signal" id="signal">SCAN READY</div><div class="vs">VS</div>
    <div class="fighters"><div class="fighter"><canvas id="left" width="500" height="660"></canvas><div class="name" id="leftName"></div></div><div class="fighter right"><canvas id="right" width="500" height="660"></canvas><div class="name" id="rightName"></div></div></div>
  </section>
  <p class="duel-result" id="result" aria-live="polite">キャラを選んで練習決闘を始めよう。</p>
  <button class="duel-start" id="duelStart" type="button">START PRACTICE</button>
  <div class="cards" id="cards"></div>
  <p class="hint">※ 現在はNPCとの練習決闘。本編では日替わり王者・ランキング・ボイス・決着演出を追加する。</p>
</main>
<script>
const fighters=[
  {id:'raven',name:'RAVEN',tag:'ZERO BLADE',color:'#32d9ff',portrait:'../images/todays-champion/portraits/raven.webp'},
  {id:'mika',name:'MIKA',tag:'PINK RIOT',color:'#ff4ca9',portrait:'../images/todays-champion/portraits/mika.webp'},
  {id:'brick',name:'BRICK',tag:'IRON FIST',color:'#ff9c20',portrait:'../images/todays-champion/portraits/brick.webp'},
  {id:'noise',name:'NOISE',tag:'BEAT BREAKER',color:'#9a62ff',portrait:'../images/todays-champion/portraits/noise.webp'},
  {id:'kiri',name:'KIRI',tag:'GHOST SIGNAL',color:'#d5a4ff',portrait:'../images/todays-champion/portraits/kiri.webp'}
];
const sheet=new Image();sheet.src='../images/todays-champion/pixel-character-poses.webp';
let selected=0,opponent=3,leftPose=0,rightPose=0,state='ready',signalAt=0,npcMs=0,waitTimer=null,npcTimer=null;
const cards=document.querySelector('#cards'),stage=document.querySelector('#stage'),result=document.querySelector('#result'),start=document.querySelector('#duelStart');
fighters.forEach((f,i)=>{const b=document.createElement('button');b.type='button';b.className='card';b.setAttribute('aria-pressed',String(i===0));b.innerHTML=`<img src="${f.portrait}" alt="${f.name}"><strong>${f.name}</strong><small>${f.tag}</small>`;b.addEventListener('click',()=>{if(state==='waiting'||state==='signal')return;selected=i;opponent=(selected+3)%fighters.length;document.querySelectorAll('.card').forEach((el,n)=>el.setAttribute('aria-pressed',String(n===i)));ready();});cards.append(b)});
// 生成したポーズ表は行の間隔が等しくない。均等に切ると次の行の頭が足元へ混ざるため、
// 各行の実際の終端で切り、縮めた分だけ下へ寄せて足元を揃える。
const poseRows=[{y:15,h:330},{y:350,h:300},{y:670,h:330}];
const spriteColumns=[70,375,680,985,1295];
function draw(canvas,index,flip,pose){const c=canvas.getContext('2d');c.imageSmoothingEnabled=false;c.clearRect(0,0,500,660);if(!sheet.complete)return;const sw=240,dw=360,row=poseRows[pose],sx=spriteColumns[index],dh=dw/sw*row.h,dx=(500-dw)/2,dy=472-dh;c.save();if(flip){c.translate(500,0);c.scale(-1,1)}c.drawImage(sheet,sx,row.y,sw,row.h,dx,dy,dw,dh);c.restore();}
function render(){draw(document.querySelector('#left'),selected,false,leftPose);draw(document.querySelector('#right'),opponent,true,rightPose);const a=fighters[selected],b=fighters[opponent];document.querySelector('#leftName').textContent=a.name;document.querySelector('#leftName').style.color=a.color;document.querySelector('#rightName').textContent=b.name;document.querySelector('#rightName').style.color=b.color;}
function ready(){clearTimeout(waitTimer);clearTimeout(npcTimer);state='ready';leftPose=0;rightPose=0;document.querySelector('#signal').textContent='SCAN READY';result.textContent='キャラを選んで練習決闘を始めよう。';start.textContent='START PRACTICE';render();}
function begin(){clearTimeout(waitTimer);clearTimeout(npcTimer);state='waiting';leftPose=1;rightPose=1;document.querySelector('#signal').textContent='DRONE SCANNING';result.textContent='合図が出るまで、決闘画面をタップしない。';start.textContent='WAIT FOR SIGNAL';render();waitTimer=setTimeout(signal,1500+Math.random()*2500);}
function signal(){state='signal';signalAt=performance.now();document.querySelector('#signal').textContent='ENGAGE!';result.textContent='今！ 決闘画面をタップ！';npcMs=310+Math.round(Math.random()*110);npcTimer=setTimeout(()=>resolve(false,null,npcMs),npcMs);}
function resolve(win,playerMs,npcMs){if(state!=='signal')return;clearTimeout(npcTimer);state='result';leftPose=win?2:1;rightPose=win?1:2;document.querySelector('#signal').textContent=win?'YOU WIN!':'NPC WINS';result.textContent=win?`WIN  ${playerMs}ms  /  NPC ${npcMs}ms`:`LOSE  ${playerMs===null?'NPC '+npcMs+'ms':playerMs+'ms  /  NPC '+npcMs+'ms'}`;start.textContent='RETRY';render();}
function foul(){clearTimeout(waitTimer);state='result';leftPose=1;rightPose=2;document.querySelector('#signal').textContent='FEINT!';result.textContent='フライング！ この試合はNPCの勝ち。';start.textContent='RETRY';render();}
stage.addEventListener('pointerdown',()=>{if(state==='waiting')foul();else if(state==='signal'){const playerMs=Math.round(performance.now()-signalAt);resolve(playerMs<npcMs,playerMs,npcMs);}});
start.addEventListener('click',()=>{if(state==='waiting'||state==='signal')return;begin();});
sheet.addEventListener('load',ready);ready();
</script>
</body>
</html>
