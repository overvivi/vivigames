<body>
<main class="wrap">
  <a class="back" href="../index.html">← GAME BASE</a>
  <div class="eyebrow">IN DEVELOPMENT / TODAY'S DUEL</div>
  <h1 class="title">本日の最強決定戦</h1>
  <p class="sub">選んだキャラで、雨の路地にいるNPCへ反応速度で挑め。</p>
  <section class="selection" id="selection" aria-label="キャラクター選択">
    <p class="selection-label">FIGHTER SELECT</p>
    <div class="cards" id="cards"></div>
    <button class="duel-start" id="duelStart" type="button">START DUEL</button>
    <a class="debug-launch" href="todays-champion.html?debug=1">OPEN DEV TUNER</a>
  </section>
  <section class="stage" id="stage" aria-label="反応速度の決闘">
    <div class="traffic-lamps" id="trafficLamps" aria-hidden="true"><i class="lamp-red"></i><i class="lamp-yellow"></i><i class="lamp-green"></i></div>
    <div class="caution" id="caution" hidden><span>CAUTION!</span><small>CURRENT CHAMPION</small><em>BREAK THE RECORD. TAKE THE CROWN.</em></div>
    <div class="signal" id="signal">SELECT A FIGHTER</div><div class="vs">VS</div>
    <div class="fighters"><div class="fighter left-fighter"><img class="fighter-sprite" id="leftSprite" alt=""><img class="attack-effect" id="leftEffect" alt="" hidden><div class="name" id="leftName"></div></div><div class="fighter right right-fighter"><img class="fighter-sprite" id="rightSprite" alt=""><img class="attack-effect" id="rightEffect" alt="" hidden><div class="name" id="rightName"></div></div></div>
  </section>
  <p class="duel-result" id="result" aria-live="polite">キャラを選んで START DUEL。</p>
  <button class="duel-start retry" id="retry" type="button" hidden>RETRY DUEL</button>
  <button class="select-return" id="selectReturn" type="button">← FIGHTER SELECT</button>
  <a class="base-return" href="../index.html">← GAME BASE</a>
  <form class="score-form" id="scoreForm" hidden><label>今日の記録へ登録 <input id="playerName" maxlength="20" required placeholder="PLAYER NAME"></label><button type="submit">REGISTER</button></form>
  <p class="hint">※ 日替わり王者・ランキングは実装中。ボイスは追加予定。</p>
</main>

function begin(){unlockAudio();clearTimers();scoreForm.hidden=true;if(champion){state='caution';stage.dataset.phase='caution';stage.classList.add('live');document.body.classList.add('in-duel');caution.hidden=false;caution.querySelector('small').textContent=`CURRENT CHAMPION — ${champion.name} / ${champion.ms}ms`;document.querySelector('#signal').textContent='CHAMPION DETECTED';result.textContent=`${champion.name}  ${champion.ms}ms が今日の最強。`;playChampionBgm();waitTimer=setTimeout(startRound,CAUTION_DURATION);return;}startRound();}
function signal(){state='signal';stage.dataset.phase='signal';signalAt=performance.now();document.querySelector('#signal').textContent='RED — GO!';result.textContent='今！ 交差点をタップ！';playSignal(signalThree,audioMix.signalThree);npcMs=champion?champion.ms:310+Math.round(Math.random()*110);npcTimer=setTimeout(()=>finish(false,null,npcMs),npcMs);}
function finish(win,playerMs,npcTime){if(state==='result')return;clearTimeout(npcTimer);state='result';lastWinMs=win&&playerMs>=90?playerMs:null;stage.dataset.phase='result';leftState='dash';rightState='dash';showEffects=false;const duration=Math.round(400/playbackSpeed);stage.style.setProperty('--cross-duration',`${duration}ms`);stage.classList.remove('is-crossed');stage.classList.add('is-charging');document.querySelector('#signal').textContent=win?'YOU WIN!':'NPC WINS';result.textContent=win?`WIN  ${playerMs}ms  /  NPC ${npcTime}ms`:`LOSE  ${playerMs===null?'NPC '+npcTime+'ms':playerMs+'ms  /  NPC '+npcTime+'ms'}`;render();motionTimer=setTimeout(()=>{leftState='attack';rightState='attack';showEffects=true;playImpact();render();},Math.round(duration*.39));resultTimer=setTimeout(()=>{showEffects=false;leftState=win?'win':'lose';rightState=win?'lose':'win';stage.classList.remove('is-charging');stage.classList.add('is-crossed');retry.hidden=false;scoreForm.hidden=!lastWinMs;render();sfx(win?'win':'lose');},duration+10);}
function foul(){clearTimeout(waitTimer);npcMs=300;finish(false,null,npcMs);document.querySelector('#signal').textContent='RED LIGHT!';result.textContent='フライング！ この試合はNPCの勝ち。';}
async function loadChampion(){if(!sb)return;const {data,error}=await sb.from(RANK_TABLE).select('name,character_id,ms').eq('day',todayJst()).order('ms',{ascending:true}).limit(1);if(error||!data?.[0]||data[0].ms>=NPC_BENCHMARK_MS)return;champion=data[0];opponent=Math.max(0,fighters.findIndex(f=>f.id===champion.character_id));render();}
fighters.forEach((f,i)=>{const b=document.createElement('button');b.type='button';b.className='card';b.setAttribute('aria-pressed',String(i===0));b.innerHTML=`<img src="${f.portrait}" alt="${f.name}"><strong>${f.name}</strong><small>${f.tag}</small>`;b.addEventListener('click',()=>{if(state==='waiting'||state==='signal')return;selected=i;if(!champion)opponent=(selected+3)%fighters.length;document.querySelectorAll('.card').forEach((el,n)=>el.setAttribute('aria-pressed',String(n===i)));render();});cards.append(b)});new ResizeObserver(render).observe(stage);
stage.addEventListener('pointerdown',()=>{if(state==='waiting'||state==='yellow')foul();else if(state==='signal'){const playerMs=Math.round(performance.now()-signalAt);finish(playerMs<npcMs,playerMs,npcMs);}});start.addEventListener('click',begin);retry.addEventListener('click',begin);selectReturn.addEventListener('click',ready);
scoreForm.addEventListener('submit',async e=>{e.preventDefault();const name=playerName.value.trim();if(!sb||!name||!lastWinMs)return;const button=scoreForm.querySelector('button');button.disabled=true;const {error}=await sb.from(RANK_TABLE).insert({day:todayJst(),name,character_id:fighters[selected].id,ms:lastWinMs});button.disabled=false;if(error){result.textContent='登録できませんでした。通信を確認してもう一度。';return;}scoreForm.hidden=true;result.textContent=`REGISTERED  ${name}  ${lastWinMs}ms`;champion=null;await loadChampion();});
function mountDevTools(){if(!DEBUG)return;const panel=document.createElement('aside');panel.className='dev-tools';panel.innerHTML=`<div class="dev-head"><h2>DUEL TUNER</h2><button id="devToggle" type="button">−</button></div><p class="dev-note">キャラごとの全ポーズと攻撃エフェクトを調整。X / Yは390×844の基準座標、SIZEは倍率。端末やPCでも同じ比率で反映されます。</p><label>FIGHTER <select id="tuneFighter">${fighters.map(f=>`<option value="${f.id}">${f.name}</option>`).join('')}</select></label><label>ASSET <select id="tuneAsset">${[...STATES,'effect'].map(v=>`<option value="${v}">${v.toUpperCase()}</option>`).join('')}</select></label><div id="assetFields"></div><hr><h2>SIGNAL LAMPS</h2><div id="lampFields"></div><button id="copyTune">COPY VALUES</button><button id="resetTune">RESET ITEM</button><p class="dev-note" id="tuneOutput"></p>`;document.body.append(panel);const speedHost=document.createElement('div');speedHost.innerHTML='<hr><h2>MOTION SPEED</h2>';panel.querySelector('hr').before(speedHost);const f=panel.querySelector('#tuneFighter'),a=panel.querySelector('#tuneAsset'),assetFields=panel.querySelector('#assetFields'),lampFields=panel.querySelector('#lampFields'),out=panel.querySelector('#tuneOutput');panel.querySelector('#devToggle').addEventListener('click',e=>{panel.classList.toggle('compact');e.currentTarget.textContent=panel.classList.contains('compact')?'+':'−';});function field(host,label,obj,key,min,max,step,onchange){const row=document.createElement('label');const range=document.createElement('input'),number=document.createElement('input');range.type='range';range.min=min;range.max=max;range.step=step;number.type='number';number.min=min;number.max=max;number.step=step;row.append(label,range,number);const sync=v=>{obj[key]=Number(v);range.value=obj[key];number.value=obj[key];onchange();};range.addEventListener('input',()=>sync(range.value));number.addEventListener('input',()=>sync(number.value));host.append(row);sync(obj[key]);}function renderFields(){assetFields.innerHTML='';const item=tuning[f.value][a.value];field(assetFields,'X (BASE)',item,'x',-240,240,1,render);field(assetFields,'Y (BASE)',item,'y',-240,240,1,render);field(assetFields,'SIZE',item,'scale',.4,2.2,.01,render);}function renderLampFields(){lampFields.innerHTML='';['red','yellow','green'].forEach(color=>{const item=lampTuning[color];field(lampFields,`${color.toUpperCase()} X`,item,'x',-240,240,1,render);field(lampFields,`${color.toUpperCase()} Y`,item,'y',-240,240,1,render);});field(lampFields,'SIZE',lampTuning,'scale',.4,3,.01,render);}f.addEventListener('change',renderFields);a.addEventListener('change',renderFields);panel.querySelector('#copyTune').addEventListener('click',async()=>{const value=JSON.stringify({sprites:tuning,signal:lampTuning,speed:playbackSpeed});out.textContent=value;try{await navigator.clipboard.writeText(value);out.textContent='COPIED: '+value;}catch{out.textContent='COPY THIS: '+value;}});panel.querySelector('#resetTune').addEventListener('click',()=>{const item=tuning[f.value][a.value];Object.assign(item,{x:0,y:0,scale:1,flip:false});renderFields();render();});field(speedHost,'SPEED',speedTuning,'speed',.1,1,.01,()=>{playbackSpeed=speedTuning.speed;});renderFields();renderLampFields();}mountDevTools();ready();loadChampion();
</script>
<script>
if(DEBUG){
  // 調整中だけ基準線と左右反転を出し、本番画面へ判定用の線を混ぜない。
  const panel=document.querySelector('.dev-tools'),assetFields=panel.querySelector('#assetFields'),fighterSelect=panel.querySelector('#tuneFighter'),assetSelect=panel.querySelector('#tuneAsset'),lampFields=panel.querySelector('#lampFields'),copyTune=panel.querySelector('#copyTune'),tuneOutput=panel.querySelector('#tuneOutput');
  const guide=document.createElement('div');guide.className='debug-guide-line';document.body.append(guide);
  const guideTitle=document.createElement('h2');guideTitle.textContent='ALIGNMENT LINE';const guideFields=document.createElement('div');panel.querySelector('#copyTune').before(guideTitle,guideFields);
  const guideLabel=document.createElement('label'),guideRange=document.createElement('input'),guideNumber=document.createElement('input');guideRange.type='range';guideRange.min=0;guideRange.max=500;guideRange.step=1;guideNumber.type='number';guideNumber.min=0;guideNumber.max=500;guideNumber.step=1;guideLabel.append('HEIGHT',guideRange,guideNumber);guideFields.append(guideLabel);
  const syncGuide=value=>{guideTuning.y=Number(value);guideRange.value=guideTuning.y;guideNumber.value=guideTuning.y;render();};guideRange.addEventListener('input',()=>syncGuide(guideRange.value));guideNumber.addEventListener('input',()=>syncGuide(guideNumber.value));syncGuide(guideTuning.y);
  [...lampFields.querySelectorAll('input')].slice(-2).forEach(input=>input.max=5);
  let allLamps=false;const allLampsButton=document.createElement('button');allLampsButton.type='button';allLampsButton.id='allLamps';const syncAllLamps=()=>{stage.classList.toggle('dev-all-lamps',allLamps);allLampsButton.textContent=allLamps?'ALL LAMPS: ON':'ALL LAMPS: OFF';};allLampsButton.addEventListener('click',()=>{allLamps=!allLamps;syncAllLamps();});panel.querySelector('#copyTune').before(allLampsButton);syncAllLamps();
  function addFlipButton(){if(assetFields.querySelector('.flip-image'))return;const button=document.createElement('button');button.type='button';button.className='flip-image';const item=()=>tuning[fighterSelect.value][assetSelect.value];button.textContent=item().flip?'FLIP IMAGE: ON':'FLIP IMAGE: OFF';button.addEventListener('click',()=>{item().flip=!item().flip;button.textContent=item().flip?'FLIP IMAGE: ON':'FLIP IMAGE: OFF';render();});assetFields.append(button);}
  fighterSelect.addEventListener('change',()=>setTimeout(addFlipButton));assetSelect.addEventListener('change',()=>setTimeout(addFlipButton));addFlipButton();
  copyTune.addEventListener('click',async()=>{const value=JSON.stringify({sprites:tuning,signal:lampTuning,guide:guideTuning,speed:playbackSpeed});tuneOutput.textContent=value;try{await navigator.clipboard.writeText(value);tuneOutput.textContent='COPIED: '+value;}catch{tuneOutput.textContent='COPY THIS: '+value;}});
  render();
}
</script>
<script>
// 新記録の入力中は結果画面を専用状態にし、RETRYや決着テキストと重ならないようにする。
const rankingForm=document.querySelector('#scoreForm');
const syncRankingScreen=()=>document.body.classList.toggle('is-registering',!rankingForm.hidden);
new MutationObserver(syncRankingScreen).observe(rankingForm,{attributes:true,attributeFilter:['hidden']});
syncRankingScreen();
</script>
<script>
if(DEBUG){
  // 音量は確定前に実機で聴き比べられるよう、通常画面へは出さない。
  const panel=document.querySelector('.dev-tools'),copyTune=panel.querySelector('#copyTune'),tuneOutput=panel.querySelector('#tuneOutput');
  const audioTitle=document.createElement('h2');audioTitle.textContent='AUDIO MIX';const audioFields=document.createElement('div');panel.querySelector('#copyTune').before(audioTitle,audioFields);
  function addAudioField(label,key){const row=document.createElement('label'),range=document.createElement('input'),number=document.createElement('input');range.type='range';range.min=0;range.max=1.5;range.step=.01;number.type='number';number.min=0;number.max=1.5;number.step=.01;row.append(label,range,number);const sync=value=>{audioMix[key]=Number(value);range.value=audioMix[key];number.value=audioMix[key];};range.addEventListener('input',()=>sync(range.value));number.addEventListener('input',()=>sync(number.value));sync(audioMix[key]);audioFields.append(row);}
  addAudioField('SIGNAL 1/2','signalOneTwo');addAudioField('SIGNAL 3','signalThree');addAudioField('IMPACT','impact');addAudioField('CHAMPION','championBgm');addAudioField('WIN','win');addAudioField('LOSE','lose');
  copyTune.addEventListener('click',async()=>{const value=JSON.stringify({sprites:tuning,signal:lampTuning,guide:guideTuning,audio:audioMix,speed:playbackSpeed});tuneOutput.textContent=value;try{await navigator.clipboard.writeText(value);tuneOutput.textContent='COPIED: '+value;}catch{tuneOutput.textContent='COPY THIS: '+value;}});
  const copyParts=[['COPY SPRITES',()=>({sprites:tuning})],['COPY SIGNAL',()=>({signal:lampTuning})],['COPY GUIDE',()=>({guide:guideTuning})],['COPY AUDIO',()=>({audio:audioMix})],['COPY SPEED',()=>({speed:playbackSpeed})]];copyParts.forEach(([label,value])=>{const button=document.createElement('button');button.type='button';button.textContent=label;button.addEventListener('click',async()=>{const text=JSON.stringify(value());tuneOutput.textContent=`${label}: ${text}`;try{await navigator.clipboard.writeText(text);tuneOutput.textContent=`COPIED ${label}: ${text}`;}catch{tuneOutput.textContent=`COPY ${label}: ${text}`;}});copyTune.before(button);});
}
</script>
<script>
if(DEBUG){
  // 触る項目が多くても、調整パネルを上下へ寄せれば反対側のモーションを常に見比べられる。
  const panel=document.querySelector('.dev-tools'),head=panel.querySelector('.dev-head'),viewSwitch=document.createElement('span');
  viewSwitch.className='view-switch';
  viewSwitch.innerHTML='<button type="button" data-view="top" aria-pressed="true">↑ TOP VIEW</button><button type="button" data-view="bottom" aria-pressed="false">↓ BOTTOM VIEW</button>';
  head.querySelector('h2').after(viewSwitch);
  const setView=view=>{const bottom=view==='bottom';panel.classList.toggle('view-bottom',bottom);viewSwitch.querySelector('[data-view="top"]').setAttribute('aria-pressed',String(!bottom));viewSwitch.querySelector('[data-view="bottom"]').setAttribute('aria-pressed',String(bottom));};
  viewSwitch.addEventListener('click',event=>{const button=event.target.closest('button[data-view]');if(button)setView(button.dataset.view);});
}
</script>
<script>
if(DEBUG){
  // 王者の反応速度に関係なく、勝敗ポーズを静止表示して位置調整だけに集中できるようにする。
  const previewPanel=document.querySelector('.dev-tools'),previewFighter=previewPanel.querySelector('#tuneFighter'),previewTitle=document.createElement('h2'),previewControls=document.createElement('div');
  previewTitle.textContent='FORCE RESULT PREVIEW';previewControls.className='preview-controls';previewControls.innerHTML='<button type="button" data-preview="player">PLAYER WIN</button><button type="button" data-preview="npc">NPC WIN</button><button type="button" data-preview="loop">POSE LOOP</button><button type="button" data-preview="mirror">MIRROR CHECK</button><button type="button" class="preview-exit">SELECT SCREEN</button>';
  previewPanel.querySelector('.dev-note').after(previewTitle,previewControls);
  let previewMode='player';
  const preparePreview=()=>{clearTimers();stopChampionBgm();state='preview';stage.dataset.phase='result';stage.dataset.result='';stage.classList.remove('is-charging','is-crossed');stage.classList.add('live');document.body.classList.add('in-duel');caution.hidden=true;retry.hidden=true;scoreForm.hidden=true;};
  const mirrorAsset=()=>{const asset=previewPanel.querySelector('#tuneAsset').value;showEffects=asset==='effect';return asset==='effect'?'attack':asset;};
  const previewResult=mode=>{previewMode=mode;preparePreview();const picked=fighters.findIndex(f=>f.id===previewFighter.value),other=(picked+1)%fighters.length;if(mode==='player'){selected=picked;opponent=other;leftState='win';rightState='lose';document.querySelector('#signal').textContent='PREVIEW — PLAYER WIN';}else if(mode==='npc'){selected=other;opponent=picked;leftState='lose';rightState='win';document.querySelector('#signal').textContent='PREVIEW — NPC WIN';}else{selected=picked;opponent=picked;leftState=rightState=mirrorAsset();document.querySelector('#signal').textContent=mode==='mirror'?'PREVIEW — MIRROR CHECK':'PREVIEW — POSE LOOP';}result.textContent=mode==='loop'?'ポーズを自動再生中。サイズ差と足元を確認。':'結果を固定表示中。スライダーで位置を調整。';render();if(mode==='loop'){let pose=0;const next=()=>{const asset=STATES[pose++%STATES.length];leftState=rightState=asset;showEffects=asset==='attack';render();};next();previewTimer=setInterval(next,900);}};
  previewControls.addEventListener('click',event=>{const button=event.target.closest('button');if(button?.dataset.preview)previewResult(button.dataset.preview);if(button?.classList.contains('preview-exit'))ready();});
  previewFighter.addEventListener('change',()=>{if(state==='preview')previewResult(previewMode);});previewPanel.querySelector('#tuneAsset').addEventListener('change',()=>{if(state==='preview'&&(previewMode==='mirror'||previewMode==='loop'))previewResult(previewMode);});
}
</script>
