.reincarnation-class-grid .game-icon{width:39px;height:39px}.reincarnation-class-grid span{font-size:15px;font-weight:600}.reincarnation-class-grid b{font-size:17px;line-height:22px;color:#e7dcc0;font-variant-numeric:tabular-nums}
.reincarnation-class-bonus{display:grid;place-items:center;min-height:95px;margin:0 17px 10px;border:1px solid #8f805f;border-radius:4px;background:linear-gradient(130deg,#2b3e5288,#142338);text-align:center;padding:20px;font-size:17px;font-weight:600;line-height:1.7;flex:1}
.reincarnation-growth{display:grid;grid-template-columns:repeat(5,1fr);margin:0 17px 19px;border:1px solid #8f805f;background:#102136;border-radius:4px;padding:14px 5px;gap:4px}.reincarnation-growth div{text-align:center;display:grid;gap:9px}.reincarnation-growth span{font-size:13px;color:#b9cad8}.reincarnation-growth b{font-size:22px;color:#e7d5a7}
.reincarnation-level{flex:none;text-align:center;margin:13px 14px 9px;padding:10px 10px 6px;border:1px solid #95805b;border-radius:4px;background:#182c3e}.reincarnation-level>span{display:block;font-size:17px}.reincarnation-level>span b{font-size:22px;color:#f0deb3}.reincarnation-level>strong{display:block;font-size:22px;color:#c1d9aa;margin:3px 0 8px}.reincarnation-level small{font-size:15px;font-weight:500;color:#c6d4dc}
.reincarnation-xp{height:25px;position:relative;background:#0b1829;border:1px solid #596f78;border-radius:3px;overflow:hidden}.reincarnation-xp i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#416948,#799b61)}.reincarnation-xp span{position:relative;display:block;line-height:23px;font-size:13px;text-shadow:0 1px 3px #091927}
.reincarnation-breakdown{flex:1;min-height:190px;display:flex;flex-direction:column;justify-content:center;margin:0 14px;padding:18px 14px 12px;border:1px solid #95805b;border-radius:4px;background:radial-gradient(ellipse at center,#3c485b55,#122338 75%)}
.reincarnation-layout dl{margin:0}.reincarnation-layout dl>div{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:13px 0;font-size:15px}.reincarnation-layout dt{flex:none}.reincarnation-layout dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;font-weight:600;color:#e4d8b8}.reincarnation-breakdown small{font-size:13px;color:#b6c9d4;white-space:nowrap;font-weight:500}
.reincarnation-total{display:flex;justify-content:space-between;gap:8px;border-top:1px solid #a48c5f99;padding-top:14px;margin-top:auto;font-size:18px}.reincarnation-total b{color:#ead39e;font-size:21px}
.reincarnation-ritual{display:flex;align-items:center;justify-content:center;gap:25px;flex:none;margin:18px 0 4px;height:119px}.reincarnation-ritual [data-reinc-cycle]{width:40px;height:45px;font-size:32px;line-height:1;padding:0;color:#d7bc88}
#reincarnate{width:119px;height:119px;border-radius:50%;border:2px solid #c8ad77;outline:1px solid #c8ad7766;outline-offset:5px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:radial-gradient(ellipse at 45% 30%,#6b755c,#2b4b4c 50%,#1a3048 80%);box-shadow:inset 0 0 0 5px #132238,0 0 24px #bc9d4c22;color:#fff0c9;font-size:17px;font-weight:600}
#reincarnate .game-icon{width:44px;height:44px;color:var(--class-color)}#reincarnate:hover:not(:disabled){filter:brightness(1.2)}#reincarnate:disabled{opacity:.6;background:#26384b;box-shadow:inset 0 0 0 5px #132238}
.reincarnation-target{text-align:center;font-size:16px;color:#ead6a9;margin-top:4px}.reincarnation-lock{height:30px;flex:none;text-align:center;font-size:13px;color:#bac8d6;padding-top:5px}
.reincarnation-info-scroll{overflow:auto;scrollbar-width:thin;min-height:0;flex:1;padding:13px 14px 14px;display:flex}.reincarnation-bonus-sheet{border:1px solid #95805b;border-radius:4px;padding:17px 15px;background:radial-gradient(ellipse at top,#35495d55,#132237);box-shadow:inset 0 0 0 3px #0e1c2d66;min-height:min-content;flex:1;display:flex;flex-direction:column;justify-content:center}
.reincarnation-bonus-sheet h3{padding:16px 0 20px;font-size:17px}.reincarnation-bonus-sheet dl>div{margin:14px 0;font-size:15px}.reincarnation-bonus-sheet dd{display:flex;align-items:baseline;justify-content:flex-end;gap:5px;flex-wrap:wrap}.reincarnation-bonus-sheet dd span{color:#b6c6d5;font-weight:400}.reincarnation-bonus-sheet dd em{font-style:normal;color:#879aae}.reincarnation-bonus-sheet dd b{color:#d3dfb0;font-weight:600}.reincarnation-next{text-align:center;font-size:13px;color:#a9bacc;line-height:1.7;margin:22px 0}
dialog:has(.offline-result){width:min(480px,94vw);padding:24px}.offline-result{text-align:center;padding:8px 12px}.offline-result>span{display:flex;justify-content:center}.offline-result>span .game-icon{width:52px;height:52px;color:#dfc593}.offline-result h2{margin:8px 0 0}.offline-duration{color:#acbfcc;font-variant-numeric:tabular-nums;margin:9px 0}.offline-level{display:block;color:#caddae;font-size:21px;margin:14px 0}.offline-result dl{border-block:1px solid #8e795b77;padding:8px 0;margin:18px 0}.offline-result dl>div{display:flex;justify-content:space-between;padding:7px 8px;gap:20px;font-size:16px}.offline-result dt{color:#bfccd4}.offline-result dd{margin:0;color:#ebd59f;font-weight:600;font-variant-numeric:tabular-nums}.offline-result>p{font-size:14px}.offline-result>button{margin:10px 0 2px;min-width:220px;padding:12px;color:#f4e7c9}

/* 原寸素材を枠内へ収め、同じ資源はどの画面でも同じ図柄にする。 */
.item-art{display:inline-block;flex-shrink:0;background-position:center;background-repeat:no-repeat;background-size:contain;vertical-align:middle}.item-art.equipment-icon{display:block}.material-gem:has(.material-art){display:grid;place-items:center;width:38px;height:38px;flex:none;border:1px solid var(--quality);border-radius:5px;background:color-mix(in srgb,var(--quality) 16%,#142235)}.material-art{width:34px;height:34px}.item-art.game-icon{filter:drop-shadow(0 2px 2px #0007)}
/* 施設の原画は前後を分け、資源欄や配分操作に光を重ねない。 */
.sanctuary-stage{position:relative;isolation:isolate;aspect-ratio:400/290;height:auto;max-height:100%;overflow:hidden;border:1px solid #8d967477;border-radius:9px;box-shadow:inset 0 0 24px #0c1a29;pointer-events:none}
.sanctuary-stage .item-art{position:absolute;display:block}
.sanctuary-stage .sanctuary-backdrop{inset:0;width:100%;height:100%;background-size:cover;background-position:center;z-index:0}
.sanctuary-stage .sanctuary-circle{left:7%;bottom:0;width:86%;height:37%;z-index:1;filter:drop-shadow(0 0 7px #76efcf88);opacity:.86}
.sanctuary-stage .sanctuary-crystal{left:32%;top:16%;width:36%;height:61%;z-index:3;filter:drop-shadow(0 0 15px #f2965066)}
.sanctuary-halo{position:absolute;inset:9% 19% 17%;z-index:1;background:radial-gradient(ellipse,#ffba8733,transparent 66%)}
.sanctuary-fairy{position:absolute;width:19%;height:28%;will-change:transform;z-index:5;left:50%;top:50%}
.sanctuary-fairy .sanctuary-pixie{inset:0;width:100%;height:100%;filter:drop-shadow(0 0 5px #b8ffdba6) drop-shadow(0 0 13px #7df4cf77)}
.sanctuary-fairy>b{position:absolute;left:41%;top:68%;width:16%;height:38%;background:linear-gradient(#c6fff66b,transparent);filter:blur(2px);border-radius:50%;transform:rotate(18deg)}
.sanctuary-mote{position:absolute;width:3px;height:3px;border-radius:50%;background:var(--spark);box-shadow:0 0 5px var(--spark),0 0 12px var(--spark);z-index:4;pointer-events:none}
.talent-root .class-emblem{width:56px;height:56px;display:block;margin:auto}
.reincarnation-class-grid .item-art.game-icon{width:49px;height:49px}
.reincarnation-breakdown{position:relative;isolation:isolate;overflow:hidden}
.reincarnation-gateway{position:absolute;inset:4% 12%;z-index:-1;width:76%;height:92%;opacity:.16;pointer-events:none}

:root{--heading-font:"Heppoko UI Serif","Yu Mincho",serif;--folio-ink:#382a21;--folio-muted:#725a42;--frame-light:#dec393;--frame-shadow:#3b271b}
:root body{font-weight:500}
h1,h2,.equipment-panel h3,.reincarnation-layout h3,#tabs button,#begin,.map-detail h3,.shop-row h3{font-family:var(--heading-font);font-weight:700}
button{border-color:#af9566;border-bottom-width:3px;background:linear-gradient(180deg,#455267 0,#29374b 46%,#172337 49%,#25344a 100%);box-shadow:inset 0 1px #efddb580,inset 0 0 0 2px #152232,0 2px 2px #0007;text-shadow:0 1px 2px #0008;font-weight:600}
button:hover:not(:disabled){filter:brightness(1.12);border-color:#f2d59a}
button:active:not(:disabled){box-shadow:inset 0 3px 7px #0009;filter:brightness(.9)}
button:disabled{opacity:.62;filter:saturate(.45)}
button.selected,button.active{color:#fff3d2;border-color:#e5c588;background:linear-gradient(#967345,#634529 48%,#46321f 50%,#775736);box-shadow:inset 0 1px #fff0cb88,inset 0 0 0 2px #392c24,0 2px 2px #0008}
.primary,#begin,.buy-cost:not(:disabled),#enter-area:not(:disabled),.talent-board-actions [data-talent-buy="1"]:not(:disabled){background:linear-gradient(#fae4a4,#d7ac55 46%,#b78031 49%,#dfb35e);color:#3c2313;border-color:#f2d5a0 #b78c43 #785121;text-shadow:0 1px #ffefba;box-shadow:inset 0 0 0 2px #9b6b3866,inset 0 3px 3px #fff5c8aa,0 3px 3px #0007}
#close-window,#close-dialog{background:linear-gradient(#916954,#614237 48%,#422a26 49%,#674237);color:#ffefd0;border-color:#d5b28a;box-shadow:inset 0 0 0 2px #39211e,0 2px 4px #0008}
select,input{border-color:#ab9064;background:#101b26;box-shadow:inset 0 2px 4px #0007;color:#f7e8c9}

/* 戦闘HUDは奥の景色を残し、紋章・ゲージ・操作盤を別の材質にする。 */
.hero-info{background:linear-gradient(90deg,#151923ed,#202a34ba);border:1px solid #b49a6166;border-radius:3px 12px 12px 3px;box-shadow:inset 0 1px #e9cf8255,0 2px 5px #0005;padding:5px 10px 7px}
.hero-name b,.field-title h1{font-family:var(--heading-font);font-weight:700;color:#fff0d0}
.hero-name strong{font-family:Georgia,serif;font-weight:700;color:#ffe9aa}
.meter{border-color:#b99b66;border-radius:4px;box-shadow:inset 0 1px 5px #000b,0 1px #040812}
.meter.hp i{background:linear-gradient(#fac79b,#d66256 47%,#932b36 51%,#cb5353)}
.meter.xp i{background:linear-gradient(#abf2ef,#439dc1 48%,#225e97 53%,#4babc9)}
.meter.atk i{background:linear-gradient(#fff0a7,#dca64b 45%,#956626 51%,#dbb053)}
.field-title>div:first-child{background:linear-gradient(#796044,#3e3025 48%,#201a1b 50%,#403122);border-color:#d4b77c;box-shadow:inset 0 0 0 3px #b18d5133,0 3px 8px #0008}
.top-controls button{background:linear-gradient(#555b64,#282f3c 48%,#192330 52%,#384452);border-color:#c4aa78;box-shadow:inset 0 0 0 3px #17202c,inset 0 2px #fff2c877,0 3px 4px #0007}
.resources{background:linear-gradient(#2d211be8,#151315ef);border:1px solid #c7a567;box-shadow:inset 0 1px #ebd5a233,0 2px 4px #0005;color:#ffe6a6}

/* 一列の機能メダル。枠幅は増設を許容し、機能ごとの色を覚えられるようにする。 */
#tabs{height:66px;padding:3px 9px 2px;gap:4px;background:linear-gradient(#0c1425aa,#080e1be8),var(--ui-astral-slate);background-size:cover;border-top:3px ridge #d1b174;border-bottom:2px solid #695133;box-shadow:0 -4px 10px #03071399,inset 0 1px #f7de9d77}
#tabs button{--nav-color:#679daf;flex:0 0 65px;gap:0;font-size:13px;line-height:16px;letter-spacing:.06em;border:0;border-radius:0;color:#e9dfcb;background:transparent;box-shadow:none;text-shadow:0 2px 3px #000}
#tabs button>span[data-icon]{width:39px;height:39px;display:grid;place-items:center;padding:3px;border:2px ridge #d3b684;outline:1px solid #201814;border-radius:50%;background:radial-gradient(ellipse at 40% 25%,color-mix(in srgb,var(--nav-color) 80%,white),color-mix(in srgb,var(--nav-color) 40%,#111320) 48%,#111522 85%);box-shadow:inset 0 0 0 2px #241d23,0 2px 4px #0009}
#tabs .game-icon{width:31px;height:31px}
#tabs button.selected{background:linear-gradient(transparent,#dcb66a35);border:0;box-shadow:inset 0 -2px #f1d085;color:#ffe1a1}
#tabs button.selected>span[data-icon]{border-color:#ffe7ae;background:radial-gradient(ellipse at 40% 25%,color-mix(in srgb,var(--nav-color) 65%,#fff0c2),color-mix(in srgb,var(--nav-color) 65%,#161829) 58%,#23212b);box-shadow:inset 0 0 0 2px #644524,0 0 9px #e1b66544}
#tabs small{right:2px;top:1px;padding:0 2px;background:#191c24;border:1px solid #a48a5f;color:#fff1c7;font-family:Arial,sans-serif;line-height:13px}
#tabs #battle-home{--nav-color:#659da8}#tabs [data-tab="gold"]{--nav-color:#b97944}#tabs [data-tab="gear"]{--nav-color:#538ab9}#tabs [data-tab="skulls"]{--nav-color:#8861b1}#tabs [data-tab="talents"]{--nav-color:#ca9c4c}#tabs [data-tab="map"]{--nav-color:#619665}#tabs [data-tab="production"]{--nav-color:#46a78c}#tabs [data-tab="reinc"]{--nav-color:#aa687c}#tabs [data-tab="alchemy"]{--nav-color:#647cba}#tabs [data-tab="record"]{--nav-color:#987f5a}

/* 全面窓は額縁、左の操作面は機能の素材、右の情報面は紙にする。 */
#window-layer{--feature-color:#59729a;--feature-deep:#1b263c}
#window-layer[data-feature="gold"]{--feature-color:#a87342;--feature-deep:#39261d}
#window-layer[data-feature="skulls"]{--feature-color:#8469ad;--feature-deep:#292139}
#window-layer[data-feature="gear"]{--feature-color:#927b62;--feature-deep:#2a211e}
#window-layer[data-feature="production"]{--feature-color:#438d79;--feature-deep:#162d2a}
#window-layer[data-feature="reinc"]{--feature-color:#8e6385;--feature-deep:#352638}
#window-layer[data-feature="map"]{--feature-color:#728b58;--feature-deep:#263125}
#feature-window{background:linear-gradient(#090e18b8,#090d17de),var(--ui-astral-slate);background-size:cover;border:3px ridge #bea06c;box-shadow:inset 0 0 0 2px #070c15,-6px 0 18px #0008}
.window-heading{background:linear-gradient(110deg,var(--feature-color),var(--feature-deep));border-bottom:3px ridge #b99c6a;box-shadow:inset 0 1px #fff0c344,inset 0 -3px #0e122255;text-shadow:0 2px 3px #0009}
.window-heading h2{letter-spacing:.1em;color:#fff1cd}
.equipment-panel,.talent-board,.talent-detail,.production-layout>section,.production-layout>aside,.reincarnation-layout>section,.reincarnation-layout>aside{border:2px ridge #ba9d6c;border-radius:5px;box-shadow:inset 0 0 0 2px #130f1966,0 2px 5px #0009}
.equipment-panel h3,.talent-board header,.talent-detail h2,.production-layout h2,.reincarnation-layout h2{background:linear-gradient(105deg,var(--feature-color),var(--feature-deep));border-bottom:3px ridge #b99b67;box-shadow:inset 0 1px #ffedc744;text-shadow:0 2px 3px #0009;color:#fff1d0;font-family:var(--heading-font);font-weight:700;letter-spacing:.08em}

/* 鍛錬は革の作業台、刻印は魔導書。効果ごとに色を持つ購入札。 */
#window-layer.drawer #pane{background:linear-gradient(#251b20aa,#1a1419bb),var(--ui-workshop-leather);background-size:cover}
#window-layer[data-feature="skulls"] #pane{background:linear-gradient(#37244b99,#120e20bb),var(--ui-astral-slate);background-size:cover}
.shop{gap:9px}.shop-row{--effect-color:#6b81a3;position:relative;grid-template-columns:45px minmax(0,1fr) 92px;gap:8px;background:linear-gradient(100deg,color-mix(in srgb,var(--effect-color) 48%,#161626),color-mix(in srgb,var(--effect-color) 19%,#15131e));border:1px solid color-mix(in srgb,var(--effect-color) 65%,#dcc39b);border-left:4px solid var(--effect-color);border-radius:5px 13px 5px 5px;box-shadow:inset 0 1px #ffe7b62b,inset 0 0 0 2px #0d121799,0 3px 3px #0005;padding-left:7px}
.shop-row>.game-icon{width:40px;height:40px;border-radius:50%;background-color:#10111b44;filter:drop-shadow(0 2px 2px #080814)}
.shop-row h3{font-size:18px;color:#fff0d3}.shop-row .shop-level{color:#d7c8b6;font-size:12px}.shop-row .shop-value{font-weight:600;color:#eee7d5}.shop-row .shop-value strong{color:#b7edb5;font-weight:700}
.shop-row.locked{opacity:.58}.buy-cost{border-radius:4px;min-height:51px;font-weight:700}.buy-cost:disabled{background:linear-gradient(#625b50,#352f2b);color:#d5c8b3;border-color:#776757;opacity:.83;text-shadow:0 1px #151518}
.shop-row[data-effect="stat-strength"],.shop-row[data-effect="combat-critical"]{--effect-color:#b45c52}.shop-row[data-effect="stat-vitality"],.shop-row[data-effect="shield"]{--effect-color:#518fc2}.shop-row[data-effect="gold"]{--effect-color:#c69b42}.shop-row[data-effect="journey-journal"]{--effect-color:#669863}.shop-row[data-effect="combat-efficiency"]{--effect-color:#c77c4e}.shop-row[data-effect="remains"],.shop-row[data-effect="sanctuary-circle"]{--effect-color:#9d77b9}.shop-row[data-effect="combat-speed"],.shop-row[data-effect="combat-evade"]{--effect-color:#56aca8}
#quantity-bar{background:linear-gradient(#4f382555,#211b20f5),var(--ui-workshop-leather);background-size:cover;border-top:3px ridge #a98c5b;padding-top:10px}
#quantity-bar button{background:linear-gradient(#655a49,#342d28);border-color:#a99165;font-family:Georgia,serif;text-shadow:0 1px #100d0b}#quantity-bar .selected{background:linear-gradient(#f4d994,#bf8d3f 50%,#926129 52%,#c49952);color:#3d2717;text-shadow:0 1px #ffe7af}
#window-pages button{background:linear-gradient(90deg,#74634d,#433827);border:2px ridge #a99265;color:#e5d2ac;border-right:0}#window-pages button.selected{background:linear-gradient(90deg,#f0d18b,#b18243);color:#382217;text-shadow:0 1px #ffe9b8}

/* 才覚は天球の盤と象牙色の書面。経路の明暗、取得数、既存のドラッグを保つ。 */
.talent-board{background:#0e1222}.talent-board header{background:linear-gradient(100deg,#534b68,#22283f)}
.talent-board header h2{font-size:21px}.talent-board header>span{color:#dbd8e5}.talent-points{color:#e4d8bb}.talent-points b{font:700 27px Georgia,serif;color:#ffdf8c;text-shadow:0 1px #170f20}
.talent-classes{background:linear-gradient(#312939,#181525);gap:5px;padding:8px 10px;border-bottom:2px solid #b9995966}
:where(.talent-classes button){--class-tint:#777687}
[data-talent-class="1"]{--class-tint:#ae975e}[data-talent-class="2"]{--class-tint:#a55e56}[data-talent-class="3"]{--class-tint:#5288ad}[data-talent-class="4"]{--class-tint:#5b8e70}[data-talent-class="5"]{--class-tint:#77689d}[data-talent-class="6"]{--class-tint:#9875a9}
.talent-classes button{color:#e5dfd3;font-size:13px;min-height:33px;border:1px solid color-mix(in srgb,var(--class-tint) 65%,#c4b096);border-bottom-width:3px;background:linear-gradient(color-mix(in srgb,var(--class-tint) 50%,#352e40),color-mix(in srgb,var(--class-tint) 26%,#131322));box-shadow:inset 0 1px #fce0ad44,inset 0 0 0 2px #080a142e}
.talent-classes button.active{background:linear-gradient(color-mix(in srgb,var(--class-tint) 75%,#ead09e),var(--class-tint));color:#fff5d6;border-color:#ffe0a2;text-shadow:0 1px 3px #171020;box-shadow:inset 0 0 0 2px #39232d66,0 0 8px #dcb87733}
.talent-viewport{background:#080f20 var(--ui-astral-slate) center/cover;scrollbar-color:#9a866c #101421}
.talent-world line{stroke:#8c99b1;opacity:.7}.talent-world line.ready{stroke:#b8d8db;opacity:.95}.talent-world line.lit{stroke:#e2bd75}.talent-orbit{fill:#080d160c;stroke:#b69a6544}
.talent-star{--star-tint:#759da8;background:radial-gradient(ellipse at 40% 20%,color-mix(in srgb,var(--star-tint) 40%,#25374a),#121b2d);border-color:color-mix(in srgb,var(--star-tint) 60%,#938f92);box-shadow:inset 0 1px #eee0b455,0 0 0 3px #060b14b3,0 2px 4px #0008}
.talent-star.effect-str,.talent-star.effect-criticalMultiplier{--star-tint:#c47766}.talent-star.effect-con{--star-tint:#77b2de}.talent-star.effect-dex{--star-tint:#c19b57}.talent-star.effect-agi{--star-tint:#73bfbc}.talent-star.effect-lck{--star-tint:#71b080}.talent-star.effect-skulls,.talent-star.effect-confection{--star-tint:#9f88c3}
.talent-star:not(.learned):not(.available) .talent-emblem{filter:saturate(.85);opacity:.87}
.talent-star.available{border-color:#9fe8df;box-shadow:0 0 0 3px #67d8c54d,inset 0 1px #f9edb188,0 0 13px #82e4d744}.talent-star.learned{background:radial-gradient(#b38447,#392b27);border-color:#e7c88b}.talent-star.maxed{background:radial-gradient(#ebcc85,#805d32);border-color:#fff0b3}.talent-star.selected{outline-color:#fff0ac;outline-width:3px;outline-offset:5px}
.talent-root{background:radial-gradient(color-mix(in srgb,var(--class-tint) 55%,#263349),#0e1526);border:3px ridge color-mix(in srgb,var(--class-tint) 55%,#e3c697);box-shadow:0 3px 7px #0009;outline-color:#a4865759;color:#e5d7bd}.talent-root.current{border-color:#ffdfa0;background:radial-gradient(#9b7a40,#282438);box-shadow:0 0 0 4px #b68c4033,0 0 20px #d0a45244}
.talent-tools{background:linear-gradient(#302a35,#171923);border-top:2px ridge #a6885e}.talent-tools button{font-size:13px}
.talent-board-actions button{border-width:2px;border-bottom-width:4px;border-radius:5px;font-family:Georgia,serif;letter-spacing:.04em}.talent-board-actions [data-talent-buy="max"]:not(:disabled){background:linear-gradient(#abd7b1,#568c77 46%,#285b51 50%,#538877);border-color:#adcfad;color:#efffe8;text-shadow:0 1px #18382e;box-shadow:inset 0 0 0 2px #173c33,0 3px 4px #0008}
.talent-detail{background:#eee0bb var(--ui-folio-ivory) center/cover;color:var(--folio-ink);position:relative}
.talent-detail h2{background:linear-gradient(100deg,#746186,#363044);text-align:center;padding-left:44px;font-size:22px;letter-spacing:.1em}
.talent-detail-scroll{padding:14px;scrollbar-color:#9d794d #e2cba4}
.talent-facts{position:relative;min-height:100%;margin:0;padding:23px 21px;border:1px solid #b7975c;border-radius:2px;background:#fff7df22;box-shadow:inset 0 0 0 4px #f7edcc99,inset 0 0 0 5px #ac8d5244;display:flex;flex-direction:column;justify-content:center}
.talent-facts:before,.talent-facts:after{content:'◆';position:absolute;left:calc(50% - 16px);width:32px;background:#ead6a8;color:#9b7742;font-size:13px;line-height:14px;text-align:center;text-shadow:0 1px #fff1c9}.talent-facts:before{top:-7px}.talent-facts:after{bottom:-7px}
.talent-detail-emblem{width:68px;height:68px;margin:0 auto 15px;display:block;filter:drop-shadow(0 3px 3px #60422255)}
.talent-description{color:#3c2b22;font-weight:700;font-size:18px;line-height:1.7;margin:0 0 24px}.talent-facts dl{gap:24px}.talent-facts dt{color:#6c523a;font-weight:600;font-size:15px}.talent-facts dd{color:#49311e;font-weight:700;font-size:23px;line-height:1.4;margin-top:5px}.talent-facts dl>div:last-child dd{font-size:17px}
.talent-detail-scroll:has(.talent-watermark){display:grid;place-items:center}.talent-watermark{width:190px;height:190px;opacity:.16;filter:sepia(.5)}

/* 育成場は森の緑と書面。台座の光は背景に焼き込み、別体の床リングを置かない。 */
.production-layout>.production-nursery{background:linear-gradient(#1c4237c9,#122725ee),var(--ui-workshop-leather);background-size:cover}
.production-layout>section{background:linear-gradient(#18382de3,#101f26ed),var(--ui-astral-slate);background-size:cover}
.production-layout>.production-detail{background:#eee0bb var(--ui-folio-ivory) center/cover;color:var(--folio-ink)}
.production-layout h2{background:linear-gradient(100deg,#3f7966,#163b32)}
.nursery-resource{background:linear-gradient(90deg,#1a292a,#26372f);border-color:#8e9366;box-shadow:inset 0 1px #e0dea433,0 2px 3px #0005}.nursery-resource b{color:#f7e1a3}
.sanctuary-stage{height:100%;width:auto;max-width:100%;aspect-ratio:4/3;max-height:100%;border:2px ridge #b79b66;border-radius:5px;box-shadow:0 3px 10px #0008;align-self:center}
.sanctuary-stage .sanctuary-backdrop{background-size:cover}
.sanctuary-stage .sanctuary-crystal{left:33%;top:14%;width:34%;height:58%}
.sanctuary-halo{inset:12% 22% 21%;background:radial-gradient(ellipse,#ffbc9833,transparent 67%)}
.confection-row{background:linear-gradient(100deg,color-mix(in srgb,var(--confection-color) 40%,#18232a),#162329);border-color:color-mix(in srgb,var(--confection-color) 60%,#ab9968);border-left:4px solid var(--confection-color);box-shadow:inset 0 1px #ffecbc33,0 2px 3px #0006}
.confection-select{box-shadow:none;border:0;border-radius:3px;background:#07161799;text-shadow:0 1px #070c15}.confection-select:hover{filter:brightness(1.15)}
.confection-row.selected{outline:1px solid #f7dfa1;outline-offset:-1px}.confection-row.locked{background:#192e2b;opacity:.65}
.confection-allocation>button:first-child{background:linear-gradient(#c68b76,#804c43 48%,#5b3432 52%,#895748);border-color:#c39c7c}.confection-allocation>button:last-child,.confection-nuclei button{background:linear-gradient(#92c996,#527e63 48%,#2a513f 52%,#578469);border-color:#b5ce92}
.confection-progress{background:#102023;border-color:#899880;box-shadow:inset 0 2px 4px #0006}.confection-progress i{opacity:.82}
.production-facts{color:var(--folio-ink);background:#fff4d62e;border-color:#aa8757;box-shadow:inset 0 0 0 3px #fbebc680;position:relative}
.production-facts p{font-weight:700;color:#3b2b22}.production-facts dt{color:var(--folio-muted);font-weight:600}.production-facts dd{color:#42301e;font-weight:700}
.production-quantity{border-top:1px solid #ab86594d;padding-top:10px}.production-quantity label{color:#624a32}.production-quantity input{background:#fffbeb;color:#3d2c1f;border-color:#ae8d60;box-shadow:inset 0 2px 4px #85642f22}
.production-quantity button{background:linear-gradient(#577769,#2c4f44);border-color:#b7a877;color:#f4e8bd}.production-quantity button.selected{background:linear-gradient(#efd08a,#a2773c);color:#382715;text-shadow:0 1px #ffe7aa}

/* 装備は革張りの鞄と紙の比較表、転生は祭壇と職業紋章を主役にする。 */
.equipment-screen{background:transparent}.equipment-panel{background:linear-gradient(#2d211abd,#1d191dcf),var(--ui-workshop-leather);background-size:cover}
.equipment-panel h3{background:linear-gradient(100deg,#876d4c,#39302a)}
.equipment-totals,.equipment-detail{background:#eee0bb var(--ui-folio-ivory) center/cover;color:var(--folio-ink)}
.equipment-detail .equipment-empty{color:#66503a}.equipment-detail .equipment-empty span{color:#7d6147}
.equipment-stat-scroll b{color:#49331e;font-weight:700}.equipment-column-label{color:#745d45;border-color:#b69469}.equipment-compare-title{color:#6b513b;background:#ac855125;border-color:#b5996555}
.equipment-totals footer{color:#80674d;border-color:#b2916344}.equipment-effect .gain{color:#25764e}.equipment-effect .loss{color:#a43936}.equipment-effect .equal{color:#7d725d}
.equipment-detail-actions{border-color:#b5946444;background:#e7c99355}.equipment-detail-actions button{background:linear-gradient(#6d6151,#433d36);color:#f3e2bd;border-color:#9d855f}
.equipment-cell{background:radial-gradient(ellipse at 50% 30%,color-mix(in srgb,var(--quality,#7b7469) 45%,#3b332d),#171619 82%);border-width:2px;box-shadow:inset 0 0 0 2px #0a101b,0 2px 3px #0008;border-radius:5px}.equipment-cell.vacant{background:#140f1199;border-color:#88705555;box-shadow:inset 0 2px 8px #0006}
.material-row{background:linear-gradient(100deg,#3b332b,#1e1d21);border-color:#a58c5a88}
.reincarnation-layout>section{background:linear-gradient(#322540b5,#1a162bdb),var(--ui-astral-slate);background-size:cover}
.reincarnation-layout h2{background:linear-gradient(100deg,#8e6685,#39273b)}
.reincarnation-class-grid button{border:2px ridge color-mix(in srgb,var(--class-color) 65%,#b7a885);border-radius:6px;background:radial-gradient(ellipse at 50% 18%,color-mix(in srgb,var(--class-color) 38%,#473a40),#221c2b 80%);box-shadow:inset 0 0 0 2px #151321,0 3px 4px #0007}
.reincarnation-class-grid button.selected{border-color:#f3d496;background:radial-gradient(ellipse at 50% 18%,color-mix(in srgb,var(--class-color) 67%,#c1a87b),#473444 90%);box-shadow:inset 0 0 0 2px #47313d,0 0 9px #d5b66944}
.reincarnation-class-grid i{background:radial-gradient(#fff0c72e,#1c142677);border:2px ridge var(--class-color);outline:none}.reincarnation-class-grid .item-art.game-icon{width:53px;height:53px}
.reincarnation-layout>aside{background:#eee0bb var(--ui-folio-ivory) center/cover;color:var(--folio-ink)}

<script>'use strict';
// 大きな数。仮数 m(1<=|m|<10) × 10^e で持ち、1e308 を超えても無限に遊べるようにする

  sub(b){b=D.of(b);return this.add(new D(-b.m,b.e))}

'use strict';
// 原作確認済みの式だけを置く。内部番号と合成済み倍率を明示して、仮の値で穴埋めしない。
const FapiCore=(()=>{

  function deathReward({stage,areaInternal,difficultyInternal,endlessProgress,challenge,ascensions,ascensionSeconds,offline,portal,skullMultiplier,powderMultiplier}){
    for(const [k,v] of Object.entries({stage,areaInternal,difficultyInternal,endlessProgress,challenge,ascensions}))integer(v,k);
    nonnegative(ascensionSeconds,'ascensionSeconds');

// 六職の基礎168マス・大18マス・最初の奥義6マス。未接続の経路は購入させない。
const FapiTalents=(()=>{
  const byId=new Map(FapiTalentData.map(r=>[r.id,r]));
  const bigData=Object.freeze([...FapiBigTalentData,...FapiClassTalentData]);
  const bigById=new Map(bigData.map(r=>[r.id,r]));
  const bigLabels=Object.freeze({wormQty:'使い魔の群れ',larvaeQty:'精霊核の恵み',criticalMultiplier:'会心の威力',skill1:'捨て身の勇気',skill2:'追撃の構え',skill3:'堅守の闘志',skill4:'精霊の呼び声',skill5:'錬金のひらめき',skill6:'鑑定の眼'});
  const labels=Object.freeze({str:'腕力の極意',con:'体力の極意',dex:'技巧の極意',agi:'敏捷の極意',lck:'幸運の極意',efficiency:'戦闘効率',gold:'金貨獲得',xp:'職業経験',skulls:'残滓獲得',wormChance:'使い魔の縁',confection:'魔法陣の修練'});

  const bigLevels=s=>Object.fromEntries(s.talents.bigNodes.map(r=>[r.id,r.level]));
  function upgrade(s){if(s.talents&&!Object.hasOwn(s.talents,'bigNodes'))s.talents.bigNodes=[]}
  const points=s=>FapiMath.talentPoints({level:s.class.level,highestLevels:s.class.highestLevels,rewardPoints:s.talents.rewardPoints,invested:s.talents.invested});
  function connected(row,classId,nodes,big={},giant={}){return (!row.requiredClass||row.requiredClass===classId)&&(row.classes.includes(classId)||row.requires.some(r=>({Node:nodes,BigNode:big,GiantNode:giant}[r.type][r.id]||0)>=r.level))}
  function available(s,id){const row=byId.get(id);if(!row)return false;const nodes=levels(s);return(nodes[id]||0)<5&&connected(row,s.class.id,nodes,bigLevels(s))&&points(s).available>=1}
  function bigAvailable(s,id){const row=bigById.get(id);return !!row&&(!row.alchemy||s.alchemy.unlocked)&&(bigLevels(s)[id]||0)<row.cap&&connected(row,s.class.id,levels(s),bigLevels(s))&&points(s).available>=row.cost}

    const reached={};let changed=true;while(changed){changed=false;for(const row of s.talents.nodes)if(!reached[row.id]&&connected(byId.get(row.id),s.class.id,reached)){reached[row.id]=row.level;changed=true}}
    if(Object.keys(reached).length!==s.talents.nodes.length)throw new RangeError('talent path');
    if(!Array.isArray(s.talents.bigNodes))throw new TypeError('big talents');
    const bigSeen=new Set();for(const node of s.talents.bigNodes){const row=node&&bigById.get(node.id);if(!row||!Number.isInteger(node.level)||node.level<1||node.level>row.cap||bigSeen.has(node.id))throw new TypeError('big talent node');if(!connected(row,s.class.id,reached)||row.alchemy&&!s.alchemy?.unlocked)throw new RangeError('big talent path');bigSeen.add(node.id);spent+=node.level*row.cost}
    if(spent!==s.talents.invested)throw new RangeError('talent invested');
    points(s);
  }
  function buy(s,id){if(!available(s,id))throw new Error('隣のマスをLv5にするか、タレントポイントを貯めてください');const row=s.talents.nodes.find(r=>r.id===id);if(row)row.level++;else s.talents.nodes.push({id,level:1});s.talents.invested++}
  function buyBig(s,id){if(!bigAvailable(s,id))throw new Error('つながる星をLv5にし、5ptを貯めてください');const row=s.talents.bigNodes.find(r=>r.id===id);if(row)row.level++;else s.talents.bigNodes.push({id,level:1});s.talents.invested+=bigById.get(id).cost}
  function effects(s){const sums={str:0,con:0,dex:0,agi:0,lck:0,efficiency:0,gold:0,xp:0,skulls:0,wormChance:0,confection:0};for(const row of s.talents.nodes){const def=byId.get(row.id);if(!def)throw new Error('未対応のタレントです');sums[def.effect]+=row.level}const big={wormQty:0,larvaeQty:0,criticalMultiplier:0};for(const row of s.talents.bigNodes){const def=bigById.get(row.id);if(!def)throw new Error('未対応の大タレントです');if(Object.hasOwn(big,def.effect))big[def.effect]+=row.level}return{weights:Object.fromEntries(['str','con','dex','agi','lck'].map(k=>[k,5+2*sums[k]])),multipliers:{...Object.fromEntries(['gold','xp','skulls','efficiency','wormChance','confection'].map(k=>[k,1+sums[k]*(k==='gold'?.2:.1)])),wormQty:1+big.wormQty,larvaeQty:1+big.larvaeQty},criticalMultiplier:1.5+big.criticalMultiplier*.3}}

})();

// 原作の最初の職業奥義。A0の単一職なので発動状態も一組だけを保存する。
// 移動・死亡で全解除しないよう、出撃ごとに作り直すbattleの外へ置く。
const FapiSkills=(()=>{
  const ids=[4,18,32,46,60,74],names=['捨て身の勇気','追撃の構え','堅守の闘志','精霊の呼び声','錬金のひらめき','鑑定の眼'];
  const create=()=>({active:false,elapsed:0,killsLeft:0});
  const level=s=>FapiTalents.bigLevels(s)[ids[s.class.id-1]]||0;
  const duration=(id,n)=>id===1||id===3?n*.5:id===5?n:id===6?n*10:0;
  function upgrade(s){if(!Object.hasOwn(s,'skills'))s.skills=create()}
  function validate(s){const b=s.skills,n=level(s),id=s.class.id;
    if(!b||typeof b.active!=='boolean'||!Number.isFinite(b.elapsed)||b.elapsed<0||!Number.isInteger(b.killsLeft)||b.killsLeft<0||b.killsLeft>n)throw new TypeError('class skill');
    if((!n&&b.active)||(id!==4&&b.killsLeft!==0)||(![1,3,5,6].includes(id)&&b.elapsed!==0))throw new RangeError('class skill state');
    if(b.active&&duration(id,n)&&b.elapsed>=duration(id,n))throw new RangeError('expired class skill');
  }
  function activate(s){if(!level(s))return false;s.skills.active=true;s.skills.elapsed=0;s.skills.killsLeft=s.class.id===4?level(s):0;return true}
  function tick(s,dt){const b=s.skills;if(!b.active)return;const id=s.class.id,n=level(s);
    if(id===4){if(b.killsLeft<=0)b.active=false;return}
    if(id===2)return;
    b.elapsed=Math.fround(b.elapsed+Math.fround(dt));if(b.elapsed>=duration(id,n))b.active=false;
  }
  function multiplier(s,key){if(!s.skills.active)return 1;const id=s.class.id,n=level(s);
    if(key==='attack')return 1+n*(id===1||id===3?.1:id===2?.05:0);
    return 1+n*(key==='wormChance'&&id===4||key==='milk'&&id===5?.05:key==='rating'&&id===6?.025:0);
  }
  function attack(s){const bonus=multiplier(s,'attack');if(s.class.id===2)s.skills.active=false;return bonus}
  // 守護騎士は会心の追加ダメージを捨てて発動。狩人は会心ダメージも残る。
  function critical(s){if(!level(s))return false;if(s.class.id===3||s.class.id===4)activate(s);return s.class.id===3}
  // 冒険者は回避成功を被弾へ置換する。斥候は回避を維持する。
  function evade(s){if(!level(s))return false;if(s.class.id===1||s.class.id===5)activate(s);return s.class.id===1}
  function kill(s,finalClear=false){if(s.class.id===4&&s.skills.killsLeft>0)s.skills.killsLeft--;if(s.class.id===2&&!finalClear)activate(s)}
  function drop(s){if(s.class.id===6)activate(s)}
  function death(s){if(s.class.id===2)s.skills.active=false}
  function summary(id,n){const pct=x=>Number((x*n).toFixed(2));return [
    `攻撃+${pct(10)}% · ${n*.5}秒`, `次の攻撃+${pct(5)}%`, `攻撃+${pct(10)}% · ${n*.5}秒`,
    `入手率+${pct(5)}% · ${n}撃破`, `エキス+${pct(5)}% · ${n}秒`, `新規IR+${pct(2.5)}% · ${n*10}秒`
  ][id-1]}
  function description(id){return [
    '回避成功時、回避せず被弾して発動。攻撃+10%・0.5秒 / Lv。',
    '敵を倒すと次の攻撃+5% / Lv。攻撃で消費。最終波クリア時は発動せず、敵の攻撃で倒れると解除。',
    '会心時、会心の追加ダメージを捨てて発動。攻撃+10%・0.5秒 / Lv。',
    '会心で発動し、使い魔の入手率+5% / Lv。Lvと同数の敵を倒すまで持続。',
    '回避で発動。エキスの生産量+5%・1秒 / Lv。錬金炉の解放が必要。',
    '装備ドロップで発動。新規装備のIR+2.5%・10秒 / Lv。発動した装備から適用。'
  ][id-1]}
  function status(s){const n=level(s);if(!n)return '';const id=s.class.id,b=s.skills;
    return names[id-1]+' Lv'+n+' · '+(!b.active?'待機':id===2?'追撃待機':id===4?'残り'+b.killsLeft+'撃破':Math.max(0,duration(id,n)-b.elapsed).toFixed(1)+'秒');
  }
  return Object.freeze({ids,names,create,level,duration,upgrade,validate,activate,tick,multiplier,attack,critical,evade,kill,drop,death,summary,description,status});
})();

// 1.0749 OfflineMath / GameTimer の通常A0。戦闘24時間、経過時計は10日まで。

  const M=FapiMath,F=FapiState,P=FapiProduction,G=FapiGear;

    const trigger=()=>{for(let n=0;n<100&&pending>=100;n++){pending-=100;driver.produce(5000);result.productionSeconds+=100}};
    while(!done){
      if(++result.cycles>110)throw new Error('離席計算の周回上限');
      const c=driver.begin();let hp=c.health.mul(1+c.evade),cycleTime=0,gold=D.zero(),xp=D.zero(),killed=0,stage=1,over=false,targetDrop=1e12;
      const attack=c.attack.mul(1+c.crit),attackRate=1/Math.max(1/Math.min(c.attackSpeed/c.attackModifier,10),.2),regen=c.regen.mul(1+c.evade);
      const reward=(multi,gearMulti=1,ratio=1)=>{
        const skulls=(driver.skulls?driver.skulls():c.skulls).mul(stage).mul(multi).mul(1+.25*(c.difficulty-1)).mul(driver.area()%9===0?4:1).floor();
        const earned={gold:gold.mul(multi).mul(ratio),xp:xp.mul(multi).mul(ratio),skulls,kills:killed*multi,equipment:0};
        if(dropKills>=targetDrop){const drops=Math.floor(dropKills/targetDrop);dropKills-=targetDrop*drops;earned.equipment=drops*gearMulti}
        driver.credit(earned);for(const k of ['gold','xp','skulls'])result[k]=result[k].add(earned[k]);for(const k of ['kills','equipment'])result[k]+=earned[k];
      };
      while(!over){
        let left=c.required;

        for(let group=0;group<20;group++){
          const count=Math.min(left,10);left-=count;const elapsed=count/c.quantity*c.spawnSpeed;time+=elapsed;cycleTime+=elapsed;
          const e=driver.enemy(stage);let enemyHp=e.maxHp.mul(count);const damage=e.damage.mul(count).mul(1/Math.max(e.interval,.05));
          const hit=attack.mul(c.efficiency.div(e.maxHp.add(100))).mul(attackRate);targetDrop=100/Math.max(1e-10,e.dropChance);
          for(let hitCount=0;hitCount<50;hitCount++){

            if(hp.lt(0)){driver.death(stage);over=true;group=200;break}
            if(!enemyHp.gt(0)){killed+=count;dropKills+=count;gold=gold.add(e.gold.mul(count).mul(c.gold));xp=xp.add(e.xp.mul(c.xp).mul(1+c.catchUp));

            reward(1,1,battleSeconds/time);done=true;over=true;stage=1;

  }
  function supported(s){return s.ascensions===0&&s.mode===0&&s.challenge===0&&s.progression.area<=9&&s.progression.difficulty===1&&!s.alchemy.unlocked}

      begin(){s.progression.stage=s.progression.startStage=1;const c=F.combat(s),a=F.area(s),r=M.spawnRules({area:a,levels:s.shops.skulls,moreBonus:0,fewerBonus:0,speedBonus:0,maxMobCount:50,roll:.5});return{...c,crit:c.crit/100,evade:c.evade/100,attackModifier:a.AreaAttackSpdModifier,difficulty:1,quantity:r.quantity,required:r.required,spawnSpeed:r.interval,catchUp:s.class.activeCatchUp}},
      enemy(stage){const e=M.enemyStats({area:s.progression.area,stage,difficulty:1,ascensions:0,hpReduction:s.shops.skulls.enemyHealth,attackReduction:s.shops.skulls.enemyAttack,reincReduction:0,mobReward:1,mobStats:1,bossReward:1,bossStats:1,rolls:Array.from({length:4},()=>F.random(s))});return{...e,dropChance:G.chances(s).drop}},
      progress(stage){F.recordProgress(s,{area:s.progression.area,difficulty:1,stage});if(stage===100)s.progression.cleared[0][s.progression.area]=1},
      death(stage){s.stats.deaths++;if(stage<3&&s.progression.area>1)s.progression.area--},
      credit(r){s.wallet.gold=s.wallet.gold.add(r.gold);s.wallet.skulls=s.wallet.skulls.add(r.skulls);F.gainEarnedClassXp(s,r.xp);s.stats.kills+=r.kills;

const HeroSanctuaryArt=(()=>{
  const cache=new WeakMap(),reduced=typeof matchMedia==='function'?matchMedia('(prefers-reduced-motion: reduce)'):null;
  const count=p=>Math.min(8,Math.max(0,Math.ceil(p.worms.toNumber())));
  function render(p){
    const n=count(p),art=(id,kind)=>HeroItemArt.icon(id,kind);
    return '<div class="familiar-sanctuary sanctuary-stage" data-fairies="'+n+'" role="img" aria-label="結晶と魔法陣の周りを光る使い魔が漂う育成場">'
      +art('sanctuary-room-v2','sanctuary-backdrop')+'<i class="sanctuary-halo"></i>'+art('philosopher-stone','sanctuary-crystal')
      +Array.from({length:n},(_,i)=>'<i class="sanctuary-fairy" data-fairy="'+i+'">'+art('sanctuary-pixie','sanctuary-pixie')+'<b></b></i>').join('')
      +Array.from({length:18},(_,i)=>'<i class="sanctuary-mote" style="--spark:'+(i%2?'#e4fbd9':'#f4d18e')+'"></i>').join('')+'</div>';
  }
  function animate(stage,seconds){
    if(!stage)return;let parts=cache.get(stage);
    if(!parts){parts={fairies:[...stage.querySelectorAll('.sanctuary-fairy')],motes:[...stage.querySelectorAll('.sanctuary-mote')],crystal:stage.querySelector('.sanctuary-crystal')};cache.set(stage,parts)}
    const t=reduced?.matches?0:seconds,n=parts.fairies.length;
    parts.fairies.forEach((el,i)=>{
      const phase=t*.26+i*Math.PI*2/Math.max(n,1),depth=Math.sin(phase),x=50+Math.cos(phase)*(29+i%2*2),y=49+depth*21+Math.sin(t*1.8+i)*1.4;
      el.style.left=x+'%';el.style.top=y+'%';el.style.zIndex=depth<0?'2':'5';
      el.style.transform='translate(-50%,-50%) scale('+(0.85+depth*.18)+') rotate('+Math.sin(t*.8+i)*5+'deg)';el.style.opacity=String(.86+depth*.12);
    });
    parts.motes.forEach((el,i)=>{
      const phase=i*2.399+t*.12,radius=9+(i%5)*5.1;
      el.style.left=(50+Math.cos(phase)*radius)+'%';el.style.top=(54+Math.sin(phase)*radius*.75-Math.sin(t*.5+i)*2)+'%';el.style.opacity=String(.15+(Math.sin(t*1.3+i)+1)*.23);
    });
    parts.crystal.style.transform='translateY('+Math.sin(t*.85)*2.3+'%)';
  }
  // 定期的な数値更新で演出のDOMを作り直さず、浮遊を連続させる。
  function paint(root,p,html){
    const previous=root.querySelector('.sanctuary-stage');root.innerHTML=html;
    if(previous&&Number(previous.dataset.fairies)===count(p))root.querySelector('.sanctuary-stage').replaceWith(previous);
  }
  return Object.freeze({render,animate,paint});
})();

    const rect=el.getBoundingClientRect(),scale=rect.width/el.offsetWidth,old=talentView.zoom,next=Math.max(.2,Math.min(2.5,old*factor));if(next===old)return;
    const x=pointer?Math.max(0,Math.min(el.clientWidth,(pointer.clientX-rect.left)/scale)):el.clientWidth/2,y=pointer?Math.max(0,Math.min(el.clientHeight,(pointer.clientY-rect.top)/scale)):el.clientHeight/2;
    const worldX=(el.scrollLeft+x)/old,worldY=(el.scrollTop+y)/old;talentView.zoom=next;
    // ホイール中は盤を作り直さず、カーソル直下の座標を保って縮尺だけ変える。
    const space=el.querySelector('.talent-space');space.style.width=TalentUI.width*next+'px';space.style.height=TalentUI.height*next+'px';el.querySelector('.talent-world').style.transform='scale('+next+')';
    el.scrollLeft=worldX*next-x;el.scrollTop=worldY*next-y;talentView.x=(el.scrollLeft+el.clientWidth/2)/next;talentView.y=(el.scrollTop+el.clientHeight/2)/next;
    Q('pane').querySelector('[data-talent-scale]').textContent=Math.round(next*100)+'%';
  }
  Q('pane').addEventListener('wheel',e=>{const el=e.target.closest('.talent-viewport');if(!el||tab!=='talents')return;e.preventDefault();if(talentPan||!e.deltaY)return;const delta=e.deltaY*(e.deltaMode===1?16:e.deltaMode===2?el.clientHeight:1);zoomTalent(Math.exp(-Math.max(-240,Math.min(240,delta))*.002),e)},{passive:false});
  fitGame();addEventListener('resize',fitGame);document.querySelectorAll('[data-icon]').forEach(el=>el.innerHTML=U.icon(el.dataset.icon));
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!Q('dialog').open&&tab){e.preventDefault();closeWindow()}});
  if(qa)Q('build-label').textContent='検証用の保存領域 · A0 CORE';if(loadError)notify('元の保存は保持しています。設定から確認してください。');render();draw();requestAnimationFrame(loop);
})();
</script></body></html>
