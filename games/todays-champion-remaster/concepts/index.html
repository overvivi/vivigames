<!doctype html>
<html lang="ja">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070b12" />
    <link rel="stylesheet" href="./style.css" />
    <title>TODAY'S CHAMPION REMASTER — CONCEPT ART</title>
</head>
<body>
    <main class="gallery">
        <header class="gallery__header">
            <p class="eyebrow">TODAY'S CHAMPION REMASTER</p>
            <h1>FIGHTER CONCEPTS</h1>
            <p class="notice">DRAFT VISUALS — 調整中のキャラクター案</p>
        </header>

        <section class="fighters" aria-label="新規ファイター案">
            <article class="fighter fighter--vivi">
                <div class="fighter__art">
                    <img src="./assets/vivi-concept-v2.png" alt="VIVIのキャラクター案。白髪の美少年、白黒の天使と悪魔が混在した姿。" />
                </div>
                <div class="fighter__copy">
                    <p class="fighter__number">NEW FIGHTER 06</p>
                    <h2>VIVI <span>TWO-FACED</span></h2>
                    <p>白い翼と黒い影、砕けた光輪を纏う不安定な美少年。</p>
                </div>
            </article>

            <article class="fighter fighter--omega">
                <div class="fighter__art">
                    <img src="./assets/omega01-concept-v2.png" alt="Ω01のキャラクター案。赤黒い重装の男性型キメラ。巨大な両拳を持つ。" />
                </div>
                <div class="fighter__copy">
                    <p class="fighter__number">NEW FIGHTER 07</p>
                    <h2>Ω01 <span>DESTROYER</span></h2>
                    <p>破壊のために造られた、重量級の男性型キメラ。</p>
                </div>
            </article>
        </section>

        <a class="play-link" href="../">PLAY REMASTER</a>
    </main>
</body>
</html>
