<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#05070d">
<title>HEXAMINE</title>
<style>
  :root{
    --bg:#05070d; --panel:#0c1322; --line:rgba(32,230,255,.28);
    --cyan:#20e6ff; --magenta:#ff2ba6; --text:#dfe9ff; --muted:#7d8bab;
    --unknown:#243049; --void:#0a0f1c;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; height:100%; background:var(--bg); color:var(--text);
    font-family:'Segoe UI',system-ui,sans-serif; overflow:hidden;
    -webkit-user-select:none; user-select:none; touch-action:manipulation;}
  #app{position:relative; width:100%; height:100%; display:flex; flex-direction:column;}

  /* ---- HUD ---- */
  #hud{flex:0 0 auto; display:flex; align-items:center; justify-content:space-between;
    padding:10px 14px; border-bottom:1px solid var(--line); background:rgba(6,10,18,.9);}
  .brand{font-size:13px; letter-spacing:.28em; color:var(--cyan); text-shadow:0 0 14px rgba(32,230,255,.5);}
  .stats{display:flex; gap:16px; font-size:12px; letter-spacing:.08em;}
  .stat b{display:block; font-size:17px; font-weight:700; letter-spacing:0;}
  .stat span{color:var(--muted); font-size:10px;}
  .stat.bad b{color:var(--magenta);}

  /* ---- 盤面 ---- */
  #boardWrap{flex:1 1 auto; position:relative; overflow:hidden;}
  #board{position:absolute; inset:0; width:100%; height:100%;}
  .cell{cursor:pointer;}
  .cell .hexFill{transition:fill .18s, stroke .18s;}
  /* 中央揃えは全てのラベルに効かせる。.cell の内側だけに限定していたため、
     外側ヒントには適用されず、指定座標が文字の左下として扱われて右上へずれていた。 */
  .label{font-weight:700; text-anchor:middle; dominant-baseline:central;}
  .cell .label{pointer-events:none;}
  .bond{stroke:rgba(32,230,255,.10); stroke-width:2; pointer-events:none;}
  /* ヒントの対象範囲。どのマスを数えているのかが分からないと推理できないため、
     本家と同じく触れている間だけ範囲を光らせる。 */
  #hl{pointer-events:none;}
  #hl polygon{fill:rgba(255,43,166,.13); stroke:var(--magenta); stroke-width:2.4;}
  #hl .src{fill:rgba(255,43,166,.30);}
  .lineHint{cursor:pointer;}

  /* ---- 画面(タイトル・選択) ---- */
  .screen{position:absolute; inset:0; z-index:4; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:16px; padding:22px 16px;
    background:radial-gradient(ellipse at 50% 30%,rgba(32,230,255,.07),transparent 60%),rgba(5,7,13,.98);
    overflow-y:auto;}
  .screen.hidden{display:none;}
  .logo{font-size:clamp(30px,9vw,52px); letter-spacing:.22em; color:var(--cyan);
    text-shadow:0 0 26px rgba(32,230,255,.55),0 0 60px rgba(255,43,166,.22);}
  .sub{margin-top:-6px; font-size:11px; letter-spacing:.14em; color:var(--muted);}
  .menu{display:flex; flex-direction:column; gap:11px; width:min(100%,330px); margin-top:12px;}
  .menuBtn{display:flex; flex-direction:column; gap:4px; padding:14px 18px; text-align:left;
    background:linear-gradient(135deg,rgba(17,20,37,.95),rgba(6,8,16,.9));
    border:1px solid var(--line); color:var(--text); cursor:pointer; transition:border-color .2s, transform .1s;}
  .menuBtn b{font-size:15px; letter-spacing:.16em; color:var(--cyan);}
  .menuBtn span{font-size:11px; color:var(--muted);}
  .menuBtn:hover{border-color:var(--cyan);}
  .menuBtn:active{transform:translateY(1px);}
  .menuBtn.accent b{color:var(--magenta);}
  .menuBtn.accent:hover{border-color:var(--magenta);}
  .foot{font-size:10px; color:var(--muted); letter-spacing:.08em; text-align:center;}
  .screenHead{display:flex; align-items:center; gap:14px; width:min(100%,520px);}
  .screenHead h2{margin:0; font-size:14px; letter-spacing:.2em; color:var(--cyan);}
  .backBtn{padding:7px 13px; background:transparent; border:1px solid var(--line);
    color:var(--muted); font-size:11px; cursor:pointer;}
  .backBtn:hover{color:var(--cyan); border-color:var(--cyan);}
  .stageGrid,.sizeGrid{display:grid; gap:10px; width:min(100%,520px);
    grid-template-columns:repeat(auto-fit,minmax(150px,1fr));}
  .card{padding:13px 15px; text-align:left; background:rgba(17,20,37,.85);
    border:1px solid var(--line); color:var(--text); cursor:pointer; transition:border-color .2s, transform .1s;}
  .card:hover{border-color:var(--cyan);} .card:active{transform:translateY(1px);}
  .card .cName{font-size:14px; color:var(--cyan);}
  .card .cSub{margin-top:3px; font-size:10px; color:var(--muted);}
  .card .cRec{margin-top:6px; font-size:11px; color:#c8d6ef;}
  .card .cRec.none{color:#5c6884;}
  .badge{display:inline-block; margin-left:7px; padding:1px 6px; font-size:9px;
    border:1px solid rgba(255,43,166,.5); color:var(--magenta);}

  /* ---- 生成中 ---- */
  #loading{position:absolute; inset:0; z-index:5; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:18px; background:rgba(5,7,13,.96);}
  #loading.hidden{display:none;}
  .loadTitle{font-size:13px; letter-spacing:.2em; color:var(--cyan);}
  .loadBarOuter{width:min(70%,320px); height:6px; background:#111a2c; border:1px solid var(--line); overflow:hidden;}
  .loadBar{height:100%; width:0%; background:linear-gradient(90deg,var(--cyan),var(--magenta)); transition:width .12s linear;}
  .loadNote{font-size:10px; color:var(--muted); letter-spacing:.1em;}
  .spinner{width:74px; height:74px;}
  .spinner circle{fill:none; stroke:var(--cyan); stroke-width:2; opacity:.85;}
  .spinner .orbit{stroke:rgba(32,230,255,.22);}

  /* ---- 結果 ---- */
  #result{position:absolute; inset:0; z-index:6; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:14px; background:rgba(5,7,13,.93);}
  #result.hidden{display:none;}
  #result h2{margin:0; font-size:22px; letter-spacing:.2em; color:var(--cyan);}
  #result .molecule{font-size:13px; color:var(--text);}
  #result .trivia{max-width:min(90%,420px); font-size:12px; line-height:1.8; color:var(--muted); text-align:center;}
  .btn{margin-top:8px; padding:11px 26px; background:transparent; color:var(--cyan);
    border:1px solid var(--cyan); letter-spacing:.16em; font-size:12px; cursor:pointer;}
  .btn:active{transform:translateY(1px);}

  /* チュートリアルの解説。盤面の上に重ねる。
     読みながら操作できないと結局どれのことか分からないので、盤面は隠しきらない位置に置く。 */
  #lesson{position:absolute; left:50%; transform:translateX(-50%); top:10px; z-index:5;
    width:min(92%,520px); padding:11px 40px 11px 14px; box-sizing:border-box;
    background:rgba(6,14,26,.93); border:1px solid rgba(32,230,255,.35);
    border-left:3px solid var(--cyan);
    font-size:12px; line-height:1.85; color:var(--text); letter-spacing:.03em;
    box-shadow:0 6px 24px rgba(0,0,0,.5);}
  #lesson.hidden{display:none;}
  #lesson b{color:var(--cyan); font-weight:700;}
  #lesson .step{display:block; margin-bottom:4px; font-size:9.5px; letter-spacing:.18em; color:var(--muted);}
  #lessonClose{position:absolute; top:0; right:0; width:36px; height:100%;
    background:transparent; border:0; color:var(--muted); font-size:15px; cursor:pointer;}
  #lessonClose:hover{color:var(--cyan);}

  #hintbar{flex:0 0 auto; padding:8px 14px 12px; text-align:center; font-size:10.5px;
    color:var(--muted); letter-spacing:.06em; border-top:1px solid rgba(32,230,255,.12);}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div style="display:flex; gap:8px">
      <button class="backBtn" id="toTitle" style="visibility:hidden">← MENU</button>
      <button class="backBtn" id="hintBtn" style="visibility:hidden">HINT</button>
    </div>
    <div class="stats">
      <div class="stat"><span>TIME</span><b id="statTime">0:00</b></div>
      <div class="stat"><span>REMAINING</span><b id="statRemain">-</b></div>
      <div class="stat bad"><span>MISTAKES</span><b id="statMiss">0</b></div>
    </div>
  </div>

  <div id="boardWrap">
    <svg id="board" xmlns="http://www.w3.org/2000/svg"></svg>

    <div id="lesson" class="hidden"><span class="step"></span><span class="body"></span><button id="lessonClose">×</button></div>

    <div id="title" class="screen">
      <div class="logo">HEXAMINE</div>
      <div class="sub">分子構造を、論理だけで復元する</div>
      <div class="menu">
        <button class="menuBtn" data-go="stageSelect">
          <b>TUTORIAL</b><span>6つの分子。操作と規則を覚える</span>
        </button>
        <button class="menuBtn" data-go="sizeSelect">
          <b>INFINITE</b><span>好きな大きさで、何度でも</span>
        </button>
        <button class="menuBtn accent" id="dailyBtn">
          <b>DAILY</b><span id="dailyLabel">今日の分子。全員が同じ盤面</span>
        </button>
      </div>
      <div class="foot">推測は要りません。必ず論理だけで解けます</div>
    </div>

    <div id="stageSelect" class="screen hidden">
      <div class="screenHead"><button class="backBtn" data-back>← 戻る</button><h2>TUTORIAL</h2></div>
      <div class="stageGrid" id="stageGrid"></div>
    </div>

    <div id="sizeSelect" class="screen hidden">
      <div class="screenHead"><button class="backBtn" data-back>← 戻る</button><h2>INFINITE</h2></div>
      <div class="sizeGrid" id="sizeGrid"></div>
      <div class="foot">大きいほど生成に時間がかかります</div>
    </div>

    <div id="loading">
      <svg class="spinner" viewBox="0 0 100 100">
        <circle class="orbit" cx="50" cy="50" r="34"></circle>
        <circle cx="50" cy="16" r="5">
          <animateTransform attributeName="transform" type="rotate" from="0 50 50" to="360 50 50" dur="2.4s" repeatCount="indefinite"/>
        </circle>
        <circle cx="50" cy="84" r="4">
          <animateTransform attributeName="transform" type="rotate" from="0 50 50" to="-360 50 50" dur="3.2s" repeatCount="indefinite"/>
        </circle>
        <circle cx="50" cy="50" r="7" style="fill:var(--cyan); stroke:none; opacity:.9"></circle>
      </svg>
      <div class="loadTitle">分子構造を組み立てています</div>
      <div class="loadBarOuter"><div class="loadBar" id="loadBar"></div></div>
      <div class="loadNote" id="loadNote">結合を検証中…</div>
    </div>

    <div id="result" class="hidden">
      <h2 id="resultTitle">STRUCTURE RESTORED</h2>
      <div class="molecule" id="resultMolecule"></div>
      <div class="trivia" id="resultTrivia"></div>
      <button class="btn" id="againBtn">NEXT</button>
    </div>
  </div>

  <div id="hintbar">タップ＝原子あり　／　長押し＝空孔　／　ドラッグで移動・ピンチで拡大（PCは左右クリックとホイール、0キーで表示リセット）</div>
</div>

<!--
  盤面生成はここに書いたコードを Web Worker として動かす。
  生成には1〜3秒かかるため、同じスレッドで回すとロード画面のアニメーションまで止まる。
  Blob経由でWorker化しているので、単一HTMLのままで別スレッドにできる。

  ★このブロックがソルバーの唯一の正本。tools/hex/solver.test.mjs はここから
  　コードを取り出して検証する。二重管理して食い違うのを避けるため。
-->
<script type="javascript/worker" id="solverSource">
// ---------- 六角格子(axial座標) ----------
// 隣接の順序は時計回りで固定する。{n} の連続判定が順序に依存するため。
const DIRS = [[1,0],[1,-1],[0,-1],[-1,0],[-1,1],[0,1]];
const key = (q,r)=>q+','+r;
const hexDistance = (a,b)=>
  (Math.abs(a[0]-b[0]) + Math.abs(a[1]-b[1]) + Math.abs(a[0]+a[1]-b[0]-b[1])) / 2;
const UNKNOWN = 0, BLUE = 1, BLACK = 2;

function makeBoard(cellList){
  const cells = cellList.map(c=>[c[0],c[1]]);
  const index = new Map(cells.map((c,i)=>[key(c[0],c[1]), i]));
  const at = (q,r)=> index.has(key(q,r)) ? index.get(key(q,r)) : null;
  const ring = cells.map(c=>DIRS.map(d=>at(c[0]+d[0], c[1]+d[1])));
  const halo = cells.map((c,i)=>
    cells.map((o,j)=>[o,j]).filter(p=>{
      const d = hexDistance(c,p[0]);
      return p[1]!==i && d>=1 && d<=2;
    }).map(p=>p[1])
  );
  const lines = [];
  for(const axis of ['q','r','s']){
    const groups = new Map();
    cells.forEach((c,i)=>{
      const g = axis==='q' ? c[0] : axis==='r' ? c[1] : c[0]+c[1];
      if(!groups.has(g)) groups.set(g, []);
      groups.get(g).push(i);
    });
    for(const entry of groups){
      const list = entry[1];
      if(list.length < 2) continue;
      list.sort((a,b)=> axis==='q' ? cells[a][1]-cells[b][1] : cells[a][0]-cells[b][0]);
      // 列の途中に盤面の穴がある場合、その先のマスは「連続」ではない。
      // 数える対象は実在するマスだけだが、並びの判定には穴を含めた並びが要る。
      // 穴を詰めた配列で判定すると、離れた2マスが連続扱いになってしまう。
      const first = cells[list[0]], last = cells[list[list.length-1]];
      const order = [];
      if(axis === 'q'){
        for(let r = first[1]; r <= last[1]; r++) order.push(at(first[0], r));
      } else if(axis === 'r'){
        for(let q = first[0]; q <= last[0]; q++) order.push(at(q, first[1]));
      } else {
        const sv = first[0] + first[1];
        for(let q = first[0]; q <= last[0]; q++) order.push(at(q, sv - q));
      }
      lines.push({ axis, cells:list, order:order });
    }
  }
  return { cells, index, at, ring, halo, lines, size:cells.length };
}

// 盤外(null)は隙間として扱う。ring=true は輪として見る
function isConsecutive(order, blueSet, ring){
  const seq = order.map(i => (i!==null && blueSet.has(i)) ? '1' : '0').join('');
  const n = (seq.match(/1/g) || []).length;
  if(n <= 1) return true;
  const runs = (ring ? seq + seq : seq).match(/1+/g) || [];
  return runs.some(run => run.length >= n);
}

// ---------- ヒント ----------
// 黒マスの数字は「盤面に置かれた手がかり」ではなく、そのマスが黒だと分かった
// 時点で読めるようになる情報として扱う。マインスイーパで開けた場所に数字が
// 出るのと同じ考え方。これにより初期表示を減らしても解けるようになる。
//
// 黒マスのヒントは3段階を取る。後ろほど難しい。
//   shown + 数字 … 最初から見えている
//   hidden + 数字 … 隠れているが、黒と確定した時点で数字が読める
//   hidden + ?    … 黒と確定しても数字が出ない(情報を持たない)
//
// 青マスの数字は最初から見えているものだけ。プレイヤーが青と確定させても
// 数字は出ない。

function makeHint(kind, scope, order, ring, count, mode, owner, shown){
  return { kind:kind, cells:scope, order:order, ring:ring,
           count:count, mode:mode, owner:owner, shown:shown };
}

// notation は使ってよい記法の段階。チュートリアルで規則を1つずつ教えるために要る。
//   'plain'  … 数字だけ。{ } も - - も出さない
//   'consec' … { } まで。- - は出さない
//   'all'    … 全部(既定)
// 下げる方向にしか使わないので、{3} が普通の 3 になるだけで嘘にはならない。
function buildAllHints(board, truth, notation, omitBlue){
  const allow = notation || 'all';
  const pick = m => (allow === 'all') ? m
                  : (allow === 'consec' && m !== 'split') ? m
                  : 'plain';
  const hints = [];
  const blueSet = new Set();
  truth.forEach((v,i)=>{ if(v===BLUE) blueSet.add(i); });

  board.cells.forEach((c,i)=>{
    if(truth[i] === BLACK){
      const order = board.ring[i];
      const scope = order.filter(x=>x!==null);
      const count = scope.filter(j=>truth[j]===BLUE).length;
      const consec = isConsecutive(order, blueSet, true);
      const mode = pick((count>=2 && count<=4) ? (consec?'consec':'split') : 'plain');
      hints.push(makeHint('black', scope, order, true, count, mode, i, true));
    } else {
      const scope = board.halo[i];
      const count = scope.filter(j=>truth[j]===BLUE).length;
      if(omitBlue) return;   // 青の数え方をまだ教えていない面で使う
      hints.push(makeHint('blue', scope, scope, false, count, 'plain', i, true));
    }
  });

  for(const line of board.lines){
    const count = line.cells.filter(j=>truth[j]===BLUE).length;
    // 並びの判定には穴を含めた order を使う。数える対象は cells のまま。
    const consec = isConsecutive(line.order, blueSet, false);
    const mode = pick((count>=2) ? (consec?'consec':'split') : 'plain');
    hints.push(makeHint('line', line.cells, line.order, false, count, mode, null, false));
  }

  // 残り原子数のカウンター
  hints.push(makeHint('total', board.cells.map((_,i)=>i), null, false, blueSet.size, 'plain', null, false));
  return hints;
}

// 最初から見えているマス。隠れている黒マスはここに含めない。
const revealedFrom = hints =>
  hints.filter(h => h.shown && h.owner !== null)
       .map(h => [h.owner, h.kind === 'blue' ? BLUE : BLACK]);

// そのヒントが今の盤面で読める状態か。
// 黒マスの数字は、最初から見えているか、黒だと確定した後でなければ読めない。
function hintActive(h, state){
  if(h.count === null) return false;              // ? は情報を持たない
  if(h.kind !== 'black') return true;
  return h.shown || state[h.owner] === BLACK;
}

// ---------- 列挙 ----------
const ENUM_LIMIT = 16;

function enumerateHint(hint, state){
  const unknown = hint.cells.filter(i => state[i] === UNKNOWN);
  const knownBlue = hint.cells.filter(i => state[i] === BLUE).length;
  const need = hint.count - knownBlue;
  if(need < 0 || need > unknown.length) return { contradiction:true };
  if(unknown.length === 0) return { skip:true };

  // 素の個数指定から確定できるのは、両端の場合だけ。
  // 「この範囲に n 個ある」という情報だけでは、n が 0 でも全部でもない限り
  // どのマスが青かは決まらない。並べても答えが出ないので列挙しない。
  // 大きい盤面では長い列のヒントがここに来るため、効き幅が非常に大きい。
  if(hint.mode === 'plain'){
    if(need === 0) return { unknown:unknown, forced:BLACK };
    if(need === unknown.length) return { unknown:unknown, forced:BLUE };
    return { skip:true };
  }

  // 連続/非連続の指定がある時だけ、並び方を実際に試す必要がある
  if(unknown.length > ENUM_LIMIT) return { skip:true };
  const fixedBlue = hint.cells.filter(i => state[i] === BLUE);
  const valid = [];
  const combo = [];
  const check = ()=>{
    const set = new Set(fixedBlue);
    for(const i of combo) set.add(i);
    const consec = isConsecutive(hint.order, set, hint.ring);
    return hint.mode === 'consec' ? consec : !consec;
  };
  (function pick(pos, left){
    if(left === 0){ if(check()) valid.push(combo.slice()); return; }
    if(pos >= unknown.length || unknown.length - pos < left) return;
    combo.push(unknown[pos]); pick(pos+1, left-1); combo.pop();
    pick(pos+1, left);
  })(0, need);

  if(!valid.length) return { contradiction:true };
  return { unknown:unknown, valid:valid };
}

// ---------- ソルバー ----------
// 総当たりは使わない。人間と同じ推論だけで解け切るかを見るため、
// 解け切ること自体が「推測不要」の保証になる。
// depth1 = ヒント単独 / depth2 = 重なる2ヒントの突き合わせ
function solve(board, hints, revealed, opts){
  const maxDepth = (opts && opts.maxDepth) || 2;
  const state = new Array(board.size).fill(UNKNOWN);
  for(const rv of revealed) state[rv[0]] = rv[1];
  let usedDepth = 0, steps = 0;

  // どのマスがどのヒントに含まれるかを先に引けるようにする。
  // 1マス確定するたび全ヒントを見直していると、盤面が大きいほど無駄が効いてくる。
  const byCell = new Array(board.size);
  for(let i=0;i<board.size;i++) byCell[i] = [];
  hints.forEach((h,hi)=>{ for(const c of h.cells) byCell[c].push(hi); });

  // 見直すべきヒントだけを順に処理する。確定したマスを含むヒントだけを積み直す。
  // マスが黒だと分かった時点で、そのマスの数字が読めるようになる。
  // どのヒントがどのマスに属するかを引けるようにしておく。
  const ownerHint = new Array(board.size).fill(-1);
  hints.forEach((h,hi)=>{ if(h.owner !== null && h.kind === 'black') ownerHint[h.owner] = hi; });

  const queued = new Uint8Array(hints.length);
  let queue = [], qh = 0;
  const push = hi =>{ if(hi >= 0 && !queued[hi]){ queued[hi] = 1; queue.push(hi); } };
  const resolve = (i, v)=>{
    state[i] = v; steps++;
    for(const hi of byCell[i]) push(hi);
    if(v === BLACK) push(ownerHint[i]);   // 開いたことで読めるようになる数字
  };
  for(let hi=0; hi<hints.length; hi++) push(hi);

  const runQueue = ()=>{
    while(qh < queue.length){
      const hi = queue[qh++];
      queued[hi] = 0;
      if(!hintActive(hints[hi], state)) continue;
      const res = enumerateHint(hints[hi], state);
      if(res.contradiction) return false;
      if(res.skip) continue;
      if(res.forced !== undefined){
        for(const i of res.unknown) resolve(i, res.forced);
        usedDepth = Math.max(usedDepth, 1);
        continue;
      }
      for(const i of res.unknown){
        const inAll  = res.valid.every(v => v.indexOf(i) >= 0);
        const inNone = res.valid.every(v => v.indexOf(i) < 0);
        if(inAll){ resolve(i, BLUE); usedDepth = Math.max(usedDepth, 1); }
        else if(inNone){ resolve(i, BLACK); usedDepth = Math.max(usedDepth, 1); }
      }
    }
    queue = []; qh = 0;
    return true;
  };

  // 重なる2ヒントの突き合わせ。
  // 同じ未確定マスを含むヒント同士だけを候補にする(共有マスが確定済みの組は
  // 互いに新しい情報を与えないため見なくてよい)。同じ組を二度試さないよう記録する。
  const popcount = x =>{
    x = x - ((x >> 1) & 0x55555555);
    x = (x & 0x33333333) + ((x >> 2) & 0x33333333);
    x = (x + (x >> 4)) & 0x0f0f0f0f;
    return (x * 0x01010101) >> 24;
  };
  const PAIR_LIMIT = 14; // 2^14 まで。ここを上げると解ける範囲は広がるが急激に重くなる
  const applyPair = ()=>{
    // 1件見つけるたびに戻ると、そのたびに走査が最初からやり直しになる。
    // 1回の走査で見つかった分をまとめて適用してから戻す。
    let anyProgress = false;
    const seen = new Set();
    for(let c=0;c<board.size;c++){
      if(state[c] !== UNKNOWN) continue;
      const list = byCell[c];
      for(let a=0;a<list.length;a++){
        for(let b=a+1;b<list.length;b++){
          const ia = list[a], ib = list[b];
          const pairKey = ia * hints.length + ib;
          if(seen.has(pairKey)) continue;
          seen.add(pairKey);

          const A = hints[ia], B = hints[ib];
          if(!hintActive(A, state) || !hintActive(B, state)) continue;
          const union = [...new Set(A.cells.concat(B.cells))];
          const unknown = union.filter(i => state[i] === UNKNOWN);
          const n = unknown.length;
          if(!n || n > PAIR_LIMIT) continue;

          // 未確定マスをビット位置へ割り当て、配列を作り直さずに数え上げる。
          // ここで state.slice() を毎回作ると、桁違いに遅くなる。
          const slot = new Map();
          for(let k=0;k<n;k++) slot.set(unknown[k], k);
          const prep = h =>{
            let m = 0, known = 0;
            for(const i of h.cells){
              if(state[i] === BLUE) known++;
              else if(slot.has(i)) m |= (1 << slot.get(i));
            }
            return { m:m, need:h.count - known, h:h };
          };
          const pa = prep(A), pb = prep(B);
          if(pa.need < 0 || pb.need < 0) return 'contradiction';

          const ok = [];
          const total = 1 << n;
          for(let mask=0; mask<total; mask++){
            if(popcount(mask & pa.m) !== pa.need) continue;
            if(popcount(mask & pb.m) !== pb.need) continue;
            if(A.mode !== 'plain' || B.mode !== 'plain'){
              let fits = true;
              for(const p of [pa, pb]){
                if(p.h.mode === 'plain') continue;
                const blues = new Set();
                for(const i of p.h.cells){
                  if(state[i] === BLUE) blues.add(i);
                  else if(slot.has(i) && (mask >> slot.get(i) & 1)) blues.add(i);
                }
                const consec = isConsecutive(p.h.order, blues, p.h.ring);
                if(p.h.mode === 'consec' ? !consec : consec){ fits = false; break; }
              }
              if(!fits) continue;
            }
            ok.push(mask);
          }
          if(!ok.length) return 'contradiction';

          let progress = false;
          for(let k=0;k<n;k++){
            const all  = ok.every(m => (m >> k & 1));
            const none = ok.every(m => !(m >> k & 1));
            if(all){ resolve(unknown[k], BLUE); progress = true; }
            else if(none){ resolve(unknown[k], BLACK); progress = true; }
          }
          if(progress){ usedDepth = 2; anyProgress = true; }
        }
      }
    }
    return anyProgress;
  };

  for(;;){
    if(!runQueue()) return { ok:false, solved:false, state:state, depth:usedDepth, steps:steps };
    if(maxDepth < 2) break;
    const pair = applyPair();
    if(pair === 'contradiction') return { ok:false, solved:false, state:state, depth:usedDepth, steps:steps };
    if(!pair) break;
  }
  return { ok:true, solved: state.every(v => v !== UNKNOWN), state:state, depth:usedDepth, steps:steps };
}

// ---------- 次の一手 ----------
// 今の盤面から、次に確定できるマスとその根拠を探す。
// 推測なしで解けることが保証されているので、詰まった時は必ず見落としがある。
// 答えのマスではなく「どのヒントを見ればよいか」を返すのが目的。
function nextStep(board, hints, state){
  // まず単独のヒントで決まるものを探す。
  // プレイヤーに読めないヒント(隠れている黒マスの数字)を根拠にしてはいけない。
  for(let hi=0; hi<hints.length; hi++){
    if(!hintActive(hints[hi], state)) continue;
    const res = enumerateHint(hints[hi], state);
    if(res.contradiction || res.skip) continue;
    if(res.forced !== undefined && res.unknown.length){
      return { hints:[hi], cell:res.unknown[0], value:res.forced, depth:1 };
    }
    if(res.valid){
      for(const i of res.unknown){
        if(res.valid.every(v => v.indexOf(i) >= 0)) return { hints:[hi], cell:i, value:BLUE, depth:1 };
        if(res.valid.every(v => v.indexOf(i) < 0))  return { hints:[hi], cell:i, value:BLACK, depth:1 };
      }
    }
  }

  // 単独で決まらない場合は、重なる2つを見比べる必要がある
  const byCell = new Array(board.size);
  for(let i=0;i<board.size;i++) byCell[i] = [];
  hints.forEach((h,hi)=>{ for(const c of h.cells) byCell[c].push(hi); });
  const seen = new Set();
  for(let c=0;c<board.size;c++){
    if(state[c] !== UNKNOWN) continue;
    const list = byCell[c];
    for(let a=0;a<list.length;a++) for(let b=a+1;b<list.length;b++){
      const key = list[a]*hints.length + list[b];
      if(seen.has(key)) continue;
      seen.add(key);
      const A = hints[list[a]], B = hints[list[b]];
      if(!hintActive(A, state) || !hintActive(B, state)) continue;
      const union = [...new Set(A.cells.concat(B.cells))];
      const unknown = union.filter(i => state[i] === UNKNOWN);
      if(!unknown.length || unknown.length > 14) continue;
      const slot = new Map();
      for(let k=0;k<unknown.length;k++) slot.set(unknown[k], k);
      const prep = h =>{
        let m = 0, known = 0;
        for(const i of h.cells){
          if(state[i] === BLUE) known++;
          else if(slot.has(i)) m |= (1 << slot.get(i));
        }
        return { m:m, need:h.count - known, h:h };
      };
      const pa = prep(A), pb = prep(B);
      if(pa.need < 0 || pb.need < 0) continue;
      const ok = [];
      for(let mask=0; mask < (1<<unknown.length); mask++){
        let ca=0, cb=0;
        for(let k=0;k<unknown.length;k++) if(mask>>k & 1){ if(pa.m>>k & 1) ca++; if(pb.m>>k & 1) cb++; }
        if(ca !== pa.need || cb !== pb.need) continue;
        let fits = true;
        for(const p of [pa, pb]){
          if(p.h.mode === 'plain') continue;
          const blues = new Set();
          for(const i of p.h.cells){
            if(state[i] === BLUE) blues.add(i);
            else if(slot.has(i) && (mask >> slot.get(i) & 1)) blues.add(i);
          }
          const consec = isConsecutive(p.h.order, blues, p.h.ring);
          if(p.h.mode === 'consec' ? !consec : consec){ fits = false; break; }
        }
        if(fits) ok.push(mask);
      }
      if(!ok.length) continue;
      for(let k=0;k<unknown.length;k++){
        if(ok.every(m => (m>>k & 1)))  return { hints:[list[a],list[b]], cell:unknown[k], value:BLUE,  depth:2 };
        if(ok.every(m => !(m>>k & 1))) return { hints:[list[a],list[b]], cell:unknown[k], value:BLACK, depth:2 };
      }
    }
  }
  return null;
}


// ---------- 生成 ----------
// 全ヒントから始めて、解ける限り削る。削るほど難しくなるので、
// 「どこまで削るか」がそのまま難易度のつまみになる。
function mulberry32(seed){
  let a = seed >>> 0;
  return ()=>{
    a = (a + 0x6D2B79F5) >>> 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function generate(board, opts, onProgress){
  const o = opts || {};
  const seed = o.seed || 1, density = o.density || 0.42;
  const maxDepth = o.maxDepth || 2, keepRatio = o.keepRatio || 0;
  // 削る試行の上限。盤面が大きいほど試行数が増えて生成時間が伸びるため、
  // ここで頭打ちにする。上限に当たった場合はヒントが多めに残る＝少し易しくなるだけで、
  // 「推測なしで解ける」という保証は変わらない。
  const maxTries = o.maxTries || Infinity;
  // ? へ落とす割合。全部落とすと盤面が ? だらけになり、
  // 「開けたら数字が読める」という手応えが失われる。本家も ? は少数。
  const silentRatio = o.silentRatio === undefined ? 0.22 : o.silentRatio;
  // o.notation … 使ってよい記法。buildAllHints へそのまま渡す
  const rnd = mulberry32(seed);
  const truth = board.cells.map(()=> rnd() < density ? BLUE : BLACK);
  const blues = truth.filter(v=>v===BLUE).length;
  if(blues < 3 || blues > board.size - 3) return null;

  const all = buildAllHints(board, truth, o.notation, o.omitBlue);
  if(!solve(board, all, revealedFrom(all), {maxDepth:maxDepth}).solved) return null;

  const order = all.map((_,i)=>i);
  for(let i=order.length-1;i>0;i--){
    const j = Math.floor(rnd()*(i+1));
    const t = order[i]; order[i] = order[j]; order[j] = t;
  }
  // keepRatio の抽選は先に済ませる。手順を種だけで決まる形にしておく。
  const skipFlag = order.map(()=> keepRatio > 0 && rnd() < keepRatio);
  const silentFlag = order.map(()=> rnd() < silentRatio);

  // 黒マスのヒントは丸ごと消さず、段階的に落とす。
  //   最初から見せる → 隠す(黒と分かれば読める) → ? にする(読めない)
  // 隠しても情報が消えるわけではなく「後から手に入る」だけなので、
  // 初期表示を大きく減らしても解ける盤面が作れる。
  let kept = all.slice();
  let tries = 0;
  const canSolve = list => solve(board, list, revealedFrom(list), {maxDepth:maxDepth}).solved;

  for(let n=0; n<order.length; n++){
    if(tries >= maxTries) break;
    if(skipFlag[n]) continue;
    const target = all[order[n]];

    if(target.kind === 'black'){
      if(!target.shown) continue;
      // 1段目: 最初の表示から外す
      const hidden = Object.assign({}, target, { shown:false });
      let trial = kept.map(h => h === target ? hidden : h);
      tries++;
      if(!canSolve(trial)) continue;      // 隠せないなら ? はもっと無理
      kept = trial;
      // 2段目: 黒と分かっても数字を出さない。ここは一部だけに留める
      if(silentFlag[n]){
        const silent = Object.assign({}, hidden, { count:null, mode:'plain' });
        trial = kept.map(h => h === hidden ? silent : h);
        tries++;
        if(canSolve(trial)) kept = trial;
      }
      if(onProgress && (n & 3) === 0) onProgress(n, order.length);
      continue;
    }

    // 直線と青マスのヒントは丸ごと削る
    const trial = kept.filter(h => h !== target);
    if(!trial.length) continue;
    tries++;
    if(canSolve(trial)) kept = trial;
    if(onProgress && (n & 3) === 0) onProgress(n, order.length);
  }

  const final = solve(board, kept, revealedFrom(kept), {maxDepth:maxDepth});
  return { truth:truth, hints:kept, totalHints:all.length, blues:blues,
           depth:final.depth, steps:final.steps, solved:final.solved };
}

function hexagon(R){
  const out=[];
  for(let q=-R;q<=R;q++) for(let r=-R;r<=R;r++) if(Math.abs(q+r)<=R) out.push([q,r]);
  return out;
}

// ---------- Worker側の入口 ----------
// Worker として動いている時だけ待ち受ける。Node のテストから読んだ時は素通りする
if(typeof importScripts === 'function'){
  self.onmessage = function(e){
    const req = e.data;
    const board = makeBoard(req.shape);
    if(req.type === 'next'){
      postMessage({ type:'next', result: nextStep(board, req.hints, req.state) });
      return;
    }
    let puzzle = null, seed = req.seed;
    // 生成に失敗する種(青が偏りすぎ等)は隣の種へずらして再挑戦する
    for(let attempt=0; attempt<40 && !puzzle; attempt++, seed++){
      puzzle = generate(board, { seed:seed, density:req.density, keepRatio:req.keepRatio, notation:req.notation, omitBlue:req.omitBlue,
         silentRatio:req.silentRatio },
        (done,total)=> postMessage({ type:'progress', done:done, total:total, attempt:attempt }));
    }
    postMessage({ type:'done', puzzle:puzzle, seed:seed, shape:req.shape });
  };
}

  const dailySeed = ()=>{
    const d = new Date();
    return d.getFullYear()*10000 + (d.getMonth()+1)*100 + d.getDate();
  };

  const UNKNOWN = 0, BLUE = 1, BLACK = 2;
  const LONG_MS = 340; // 長押しで空孔。実機で詰める値
  const HINT_TEXT = 'タップ＝原子あり　／　長押し＝空孔　／　ドラッグで移動・ピンチで拡大（PCは左右クリックとホイール、0キーで表示リセット）';

  const $ = id => document.getElementById(id);
  const svg = $('board'), loading = $('loading'), loadBar = $('loadBar'), loadNote = $('loadNote');
  const result = $('result'), statRemain = $('statRemain'), statMiss = $('statMiss');

  let worker = null, puzzle = null, board = null, state = null;
  let cellNodes = [], mistakes = 0, cellHint = [], busy = false;
  let layout = null, hlLayer = null;   // ハイライト描画に位置情報が要る
  // 盤面が画面に収まらない大きさになるため、拡大縮小と移動を持つ。
  // 端末で盤面を小さくするとデイリーランキングの公平性が崩れるので、
  // 盤面はそのままにして見る側を動かす。
  let viewGroup = null;
  let view = { x:0, y:0, k:1 };
  const MIN_K = 0.4, MAX_K = 3.0;
  const DRAG_THRESHOLD = 10;           // これ以上動いたらタップではなく移動とみなす
  let activePress = null;              // 進行中のタップ/長押し
  const pointers = new Map();          // ピンチ判定用
  let panning = false, pinchStart = null;

  function applyView(){
    if(viewGroup) viewGroup.setAttribute('transform',
      'translate(' + view.x.toFixed(2) + ',' + view.y.toFixed(2) + ') scale(' + view.k.toFixed(4) + ')');
  }
  function zoomAt(cx, cy, factor){
    const k = Math.max(MIN_K, Math.min(MAX_K, view.k * factor));
    const real = k / view.k;
    // つまんだ点が動かないように、拡大の中心を合わせる
    view.x = cx - (cx - view.x) * real;
    view.y = cy - (cy - view.y) * real;
    view.k = k;
    applyView();
  }
  function svgPoint(e){
    const r = svg.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }

  // ---------- Worker を単一HTMLのまま作る ----------
  let workerBroken = false;
  function ensureWorker(){
    if(worker || workerBroken) return worker;
    try{
      const src = document.getElementById('solverSource').textContent;
      const blob = new Blob([src], { type:'application/javascript' });
      worker = new Worker(URL.createObjectURL(blob));
      worker.onerror = ()=>{ workerBroken = true; worker = null; };
    }catch(e){
      workerBroken = true; // file:// 直接起動などで作れない
    }
    return worker;
  }

  // Worker が使えない時の代替。同じソースを本体側で読み込んで直接動かす。
  // 生成中は画面が固まるため、ロード画面にその旨を出す。
  let localApi = null;
  function ensureLocalApi(){
    if(localApi) return localApi;
    const src = document.getElementById('solverSource').textContent;
    localApi = new Function(src + ';return { makeBoard, generate, nextStep };')();
    return localApi;
  }
  function generateLocally(req, onDone){
    loadNote.textContent = 'この環境では別スレッドを使えません。少しお待ちください…';
    loadBar.style.width = '100%';
    // 一度描画させてから重い処理へ入る
    setTimeout(()=>{
      const api = ensureLocalApi();
      const board = api.makeBoard(req.shape);
      let puzzle = null, seed = req.seed;
      for(let attempt=0; attempt<40 && !puzzle; attempt++, seed++){
        puzzle = api.generate(board, { seed:seed, density:req.density, keepRatio:req.keepRatio, notation:req.notation, omitBlue:req.omitBlue, silentRatio:req.silentRatio });
      }
      onDone({ type:'done', puzzle:puzzle, seed:seed, shape:req.shape });
    }, 60);
  }

  function hexagonShape(R){
    const out=[];
    for(let q=-R;q<=R;q++) for(let r=-R;r<=R;r++) if(Math.abs(q+r)<=R) out.push([q,r]);
    return out;
  }

  // ---------- 盤面の再構築(表示用。ソルバーと同じ規則) ----------
  const DIRS = [[1,0],[1,-1],[0,-1],[-1,0],[-1,1],[0,1]];
  function rebuildBoard(shape){
    const cells = shape.map(c=>[c[0],c[1]]);
    const index = new Map(cells.map((c,i)=>[c[0]+','+c[1], i]));
    const at = (q,r)=> index.has(q+','+r) ? index.get(q+','+r) : null;
    const lines = [];
    for(const axis of ['q','r','s']){
      const groups = new Map();
      cells.forEach((c,i)=>{
        const g = axis==='q' ? c[0] : axis==='r' ? c[1] : c[0]+c[1];
        if(!groups.has(g)) groups.set(g, []);
        groups.get(g).push(i);
      });
      for(const entry of groups){
        const list = entry[1];
        if(list.length < 2) continue;
        list.sort((a,b)=> axis==='q' ? cells[a][1]-cells[b][1] : cells[a][0]-cells[b][0]);
        lines.push({ axis:axis, cells:list });
      }
    }
    return { cells:cells, at:at, lines:lines, size:cells.length };
  }

  // ---------- 描画 ----------
  const SQRT3 = Math.sqrt(3);
  // フラットトップ。この向きだと「軸q＝真下に伸びる縦列」ができ、本家と同じ構成になる。
  // 縦列の数字は回転させずに読めるので、視認性でも有利。
  function axialToPixel(q, r, size){
    return { x: size * 1.5 * q, y: size * SQRT3 * (r + q/2) };
  }
  function hexPoints(cx, cy, size){
    const pts = [];
    for(let i=0;i<6;i++){
      const a = Math.PI/180 * (60*i); // 頂点が左右に来る = フラットトップ
      pts.push((cx + size*Math.cos(a)).toFixed(2) + ',' + (cy + size*Math.sin(a)).toFixed(2));
    }
    return pts.join(' ');
  }
  function decorate(count, mode){
    if(count === null || count === undefined) return '?'; // 数字を持たない黒マス
    if(mode === 'consec') return '{' + count + '}';
    if(mode === 'split')  return '-' + count + '-';
    return String(count);
  }
  const el = (tag, attrs)=>{
    const n = document.createElementNS('http://www.w3.org/2000/svg', tag);
    for(const k in attrs) n.setAttribute(k, attrs[k]);
    return n;
  };

  function render(){
    svg.innerHTML = '';
    viewGroup = el('g', { id:'view' });
    svg.appendChild(viewGroup);
    const wrap = svg.getBoundingClientRect();
    const W = wrap.width || 360, H = wrap.height || 480;

    // 盤面が枠へ収まる大きさを求める
    let minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9;
    for(const c of board.cells){
      const p = axialToPixel(c[0], c[1], 10);
      minX=Math.min(minX,p.x); maxX=Math.max(maxX,p.x);
      minY=Math.min(minY,p.y); maxY=Math.max(maxY,p.y);
    }
    const spanX = (maxX-minX)/10 + SQRT3, spanY = (maxY-minY)/10 + 2;
    // 小さい盤面で1マスが巨大になりすぎないよう上限を設ける
    const size = Math.min(Math.min(W/(spanX+2.6), H/(spanY+2.6)) * 0.96, 46);
    const ox = W/2 - (minX+maxX)/20*size, oy = H/2 - (minY+maxY)/20*size;
    const pos = i => {
      const p = axialToPixel(board.cells[i][0], board.cells[i][1], size);
      return { x:p.x+ox, y:p.y+oy };
    };
    layout = { size:size, at:pos };

    // 結合線(格子を分子らしく見せる薄い線)
    const bonds = el('g', {});
    board.cells.forEach((c,i)=>{
      for(const d of [[1,0],[0,1],[-1,1]]){
        const j = board.at(c[0]+d[0], c[1]+d[1]);
        if(j === null) continue;
        const a = pos(i), b = pos(j);
        bonds.appendChild(el('line', { class:'bond', x1:a.x, y1:a.y, x2:b.x, y2:b.y }));
      }
    });
    viewGroup.appendChild(bonds);

    // 直線ヒント(盤面の外側、マスの「面」へ置く)
    //
    // フラットトップの六角形では、3軸の列はいずれも上側の面から外へ出る。
    //   縦の列    → 上面      (列は真下へ伸びる)
    //   右下がりの斜め → 左上面 (列は右下へ伸びる)
    //   右上がりの斜め → 右上面 (列は右上へ伸びる)
    // 面は列の向きと直交するので、数字は 0° / -60° / +60° で置くと
    // 「数字の底面が面と平行」になる。本家と同じ見え方。
    //
    // 各面を使う列は1本しかないため、位置の衝突は起こらない。
    // 以前入れていた「重なったら外へ押し出す」処理は、面ではなく1マス外へ
    // 置いていたことによる自作の問題だったので廃止した。
    const lineHints = puzzle.hints.filter(h => h.kind === 'line');
    const lineNodeMap = new Map();
    const FACE = {
      q: { end:'first', nx:0,                ny:-1,   angle:0   }, // 上面
      r: { end:'first', nx:-Math.sqrt(3)/2,  ny:-0.5, angle:-60 }, // 左上面
      s: { end:'last',  nx: Math.sqrt(3)/2,  ny:-0.5, angle: 60 }  // 右上面
    };
    // マス中心からの距離(sizeの倍数)。
    // 面から離すほど良いわけではない。上面のラベルと、左上のマスが持つ右上面の
    // ラベルは、この距離が1.73に近づくほど互いに寄っていく関係にある。
    // 面に接する下限(内接半径0.80 + 文字の高さの半分)まで詰めた方が両者は離れる。
    const FACE_GAP = 1.12;
    const HINT_FONT = 0.30; // 0.34にすると上面と右上面のラベルが接触する // 上の理由で文字を大きくすると隣のラベルと当たる
    for(const line of board.lines){
      const h = lineHints.find(x => x.cells.length === line.cells.length &&
                                    x.cells.every((v,k)=> v === line.cells[k]));
      if(!h) continue;
      const f = FACE[line.axis];
      // 列のどちら端の面から出すかは軸ごとに決まる。逆端を使うと下側の面になる。
      const endIndex = f.end === 'first' ? line.cells[0] : line.cells[line.cells.length-1];
      const base = pos(endIndex);
      const lx = base.x + f.nx * size * FACE_GAP;
      const ly = base.y + f.ny * size * FACE_GAP;

      const t = el('text', { x:lx, y:ly, class:'label lineHint',
        fill:'#b9d6f2', 'font-size':(size*HINT_FONT).toFixed(1),
        transform:'rotate(' + f.angle + ',' + lx.toFixed(1) + ',' + ly.toFixed(1) + ')' });
      t.textContent = decorate(h.count, h.mode);
      // 外側ヒントは隣同士が近くなることがあり、どの数字が今光っている列のものか
      // 見分けられないと誤読につながる。触れている数字自身も光らせる。
      const scope = line.cells.slice();
      const on  = ()=>{ showScope(scope, null); t.setAttribute('fill', 'var(--magenta)'); t.setAttribute('font-weight','900'); };
      const off = ()=>{ clearScope(); t.setAttribute('fill', '#b9d6f2'); t.setAttribute('font-weight','700'); };
      t.addEventListener('mouseenter', on);
      t.addEventListener('mouseleave', off);
      t.addEventListener('pointerdown', e=>{ e.preventDefault(); on(); });
      t.addEventListener('pointerup', off);
      t.addEventListener('pointercancel', off);
      lineNodeMap.set(h, t);
      viewGroup.appendChild(t);
    }

    hintNodes.lines = lineNodeMap;

    // セル
    cellNodes = [];
    board.cells.forEach((c,i)=>{
      const p = pos(i);
      const g = el('g', { class:'cell' });
      const hex = el('polygon', { class:'hexFill', points:hexPoints(p.x, p.y, size*0.92) });
      const label = el('text', { class:'label', x:p.x, y:p.y, 'font-size':(size*0.52).toFixed(1) });
      g.appendChild(hex); g.appendChild(label);
      viewGroup.appendChild(g);
      cellNodes.push({ g:g, hex:hex, label:label });
      bindInput(g, i);
    });

    // 最前面へ。pointer-events:none なので下のセルの操作を妨げない
    hlLayer = el('g', { id:'hl' });
    viewGroup.appendChild(hlLayer);
    view = { x:0, y:0, k:1 };
    applyView();
    paintAll();
  }

  // ヒントが数えている範囲を光らせる。srcIndex はヒント自身のマス
  function showScope(cells, srcIndex){
    if(!hlLayer || !layout) return;
    clearScope();
    for(const i of cells){
      const p = layout.at(i);
      hlLayer.appendChild(el('polygon', {
        points: hexPoints(p.x, p.y, layout.size*0.92),
        class: (i === srcIndex) ? 'src' : ''
      }));
    }
    if(srcIndex !== undefined && srcIndex !== null && cells.indexOf(srcIndex) < 0){
      const p = layout.at(srcIndex);
      hlLayer.appendChild(el('polygon', {
        points: hexPoints(p.x, p.y, layout.size*0.92), class:'src'
      }));
    }
  }
  function clearScope(){ if(hlLayer) hlLayer.innerHTML = ''; }

  function paintCell(i){
    const n = cellNodes[i], v = state[i], h = cellHint[i];
    if(v === UNKNOWN){
      n.hex.setAttribute('fill', 'var(--unknown)');
      n.hex.setAttribute('stroke', 'rgba(32,230,255,.30)');
      n.hex.setAttribute('stroke-width', '1.5');
      n.label.textContent = '';
    } else if(v === BLUE){
      n.hex.setAttribute('fill', 'var(--cyan)');
      n.hex.setAttribute('stroke', 'rgba(32,230,255,.9)');
      n.hex.setAttribute('stroke-width', '2');
      n.label.setAttribute('fill', '#04202c');
      n.label.textContent = (h && h.kind === 'blue') ? String(h.count) : '';
    } else {
      n.hex.setAttribute('fill', 'var(--void)');
      n.hex.setAttribute('stroke', 'rgba(125,139,171,.35)');
      n.hex.setAttribute('stroke-width', '1.5');
      n.label.setAttribute('fill', '#9fb4d6');
      n.label.textContent = (h && h.kind === 'black') ? decorate(h.count, h.mode) : '';
    }
  }
  function paintAll(){ for(let i=0;i<board.size;i++) paintCell(i); updateStats(); }

  function updateStats(){
    let remain = 0;
    for(let i=0;i<board.size;i++) if(puzzle.truth[i] === BLUE && state[i] !== BLUE) remain++;
    statRemain.textContent = remain;
    statMiss.textContent = mistakes;
    if(remain === 0) finish();
  }

  // ---------- 入力 ----------
  // スマホには右クリックが無い。タップ=原子あり、長押し=空孔で分ける。
  // 長押し中は枠色を変えて、判定に入ったことを見せる。
  function bindInput(node, i){
    let timer = null, longFired = false;
    // 指が動いた時に外から打ち切れるよう、進行中の操作を共有しておく
    const abort = ()=>{
      if(timer){ clearTimeout(timer); timer = null; }
      longFired = true;          // 以降のpointerupでマークさせない
      clearScope();
      paintCell(i);
    };

    const startPress = ()=>{
      // 数字を持つ確定済みのマスは、押している間だけ対象範囲を見せる
      if(state[i] !== UNKNOWN){
        if(cellHint[i] && cellHint[i].cells.length) showScope(cellHint[i].cells, i);
        return;
      }
      if(busy) return;
      longFired = false;
      cellNodes[i].hex.setAttribute('stroke', 'var(--magenta)');
      cellNodes[i].hex.setAttribute('stroke-width', '3');
      timer = setTimeout(()=>{ longFired = true; timer = null; commit(i, BLACK); }, LONG_MS);
      activePress = { abort:abort };
    };
    const endPress = ()=>{
      activePress = null;
      clearScope();
      if(timer){ clearTimeout(timer); timer = null; if(!longFired) commit(i, BLUE); }
      else if(!longFired) paintCell(i);
    };
    const cancelPress = ()=>{
      activePress = null;
      clearScope();
      if(timer){ clearTimeout(timer); timer = null; }
      if(!longFired) paintCell(i);
    };
    // PCはホバーだけで範囲が見えたほうが速い
    node.addEventListener('mouseenter', ()=>{ if(state[i] !== UNKNOWN && cellHint[i] && cellHint[i].cells.length) showScope(cellHint[i].cells, i); });
    node.addEventListener('mouseleave', clearScope);

    node.addEventListener('pointerdown', e=>{
      if(e.pointerType === 'mouse' && e.button === 2) return; // PCの右クリックは contextmenu で拾う
      e.preventDefault(); startPress();
    });
    node.addEventListener('pointerup', e=>{ e.preventDefault(); endPress(); });
    node.addEventListener('pointerleave', cancelPress);
    node.addEventListener('pointercancel', cancelPress);
    node.addEventListener('contextmenu', e=>{ e.preventDefault(); if(!busy) commit(i, BLACK); });
  }

  function commit(i, guess){
    if(busy || state[i] !== UNKNOWN) return;
    const actual = puzzle.truth[i];
    if(guess !== actual) mistakes++;   // 間違えても失敗にはせず、正しい値を開く
    state[i] = actual;
    paintCell(i);
    solvedCount++;
    advanceLesson();
    updateStats();
  }

  // ---------- 次の一手 ----------
  // 詰まった時に「どのヒントを見ればよいか」だけを示す。
  // 答えのマスは出さない。推測なしで解ける設計なので、必ず見落としがある。
  // ---------- チュートリアルの解説 ----------
  // 規則が多く、いきなり盤面を出しても何を見ればよいか分からない。
  // 面ごとに規則を1つずつ足し、解いた数に応じて次の説明へ進める。
  const lessonBox = $('lesson'), lessonBody = lessonBox.querySelector('.body'),
        lessonStep = lessonBox.querySelector('.step');
  let lessons = [], lessonIdx = -1, solvedCount = 0;

  function initLessons(){
    lessons = (current.type === 'tutorial' && LESSONS[current.stage.key]) || [];
    lessonIdx = -1; solvedCount = 0;
    lessonBox.classList.add('hidden');
    advanceLesson();
  }
  function advanceLesson(){
    // 条件を満たしたものの中で最後を出す。まとめて進んだ時に説明を飛ばさないため。
    let next = lessonIdx;
    for(let i=0;i<lessons.length;i++) if(solvedCount >= lessons[i].after) next = i;
    if(next === lessonIdx) return;
    lessonIdx = next;
    lessonStep.textContent = 'RULE ' + (lessonIdx+1) + ' / ' + lessons.length;
    lessonBody.innerHTML = lessons[lessonIdx].text;
    lessonBox.classList.remove('hidden');   // 閉じていても新しい説明は出し直す
  }
  $('lessonClose').addEventListener('click', ()=> lessonBox.classList.add('hidden'));

  let hintNodes = { cells:[], lines:[] };   // 描画時に作った参照
  let hintBusy = false;
  let hintFlash = null;   // 実行中の点滅。重なると前の後始末が新しい表示を消してしまう

  function flashHint(indices){
    if(hintFlash){ hintFlash(); hintFlash = null; }   // 前の点滅を片付けてから始める
    // 該当するヒントを一定時間だけ強く光らせる
    const targets = [];
    for(const hi of indices){
      const h = puzzle.hints[hi];
      if(!h) continue;
      if(h.owner !== null && h.owner !== undefined){
        const n = cellNodes[h.owner];
        if(n) targets.push({ el:n.hex, attr:'stroke', from:n.hex.getAttribute('stroke') });
      } else {
        const t = hintNodes.lines.get(h);
        if(t) targets.push({ el:t, attr:'fill', from:t.getAttribute('fill') });
      }
      if(h.cells && h.cells.length) showScope(h.cells, (h.owner === null || h.owner === undefined) ? null : h.owner);
    }
    // 押した瞬間から光らせる。初回を間隔待ちにすると反応が無いように見える
    let on = false, count = 0;
    let timer = null;
    const tick = ()=>{
      on = !on; count++;
      for(const t of targets) t.el.setAttribute(t.attr, on ? 'var(--magenta)' : t.from);
      if(count >= 8) stop();
    };
    const stop = ()=>{
      if(timer) clearInterval(timer);
      timer = null;
      for(const t of targets) t.el.setAttribute(t.attr, t.from);
      clearScope();
      hintFlash = null;
    };
    hintFlash = stop;
    tick();
    timer = setInterval(tick, 300);
  }

  function requestHint(){
    if(hintBusy || busy || !puzzle) return;
    hintBusy = true;
    const note = msg => { $('hintbar').textContent = msg; hintBusy = false; };
    const done = res =>{
      if(!res){ note('確定できるマスが見つかりませんでした'); return; }
      flashHint(res.hints);
      note(res.depth === 1
        ? '光っているヒントだけで1マス確定できます'
        : '光っている2つのヒントを見比べると1マス確定できます');
      setTimeout(()=>{ $('hintbar').textContent = HINT_TEXT; }, 6000);
    };
    const req = { type:'next', shape:current.shape, hints:puzzle.hints, state:state };
    const w = ensureWorker();
    if(w){
      const prev = w.onmessage;
      w.onmessage = e =>{
        if(e.data.type === 'next'){ w.onmessage = prev; done(e.data.result); }
        else if(prev) prev(e);
      };
      w.postMessage(req);
    } else {
      const api = ensureLocalApi();
      done(api.nextStep(api.makeBoard(current.shape), puzzle.hints, state));
    }
  }

  // ---------- 盤面の移動と拡大縮小 ----------
  // 盤面は端末によらず同じ大きさで作る(デイリーの公平性のため)。
  // 画面に収まらない分は、見る側を動かして対応する。
  svg.addEventListener('pointerdown', e=>{
    pointers.set(e.pointerId, { x:e.clientX, y:e.clientY, sx:e.clientX, sy:e.clientY });
    if(pointers.size === 2){
      // 2本目が触れた時点で、進行中のタップ/長押しは取り消す
      if(activePress){ activePress.abort(); activePress = null; }
      const [a,b] = [...pointers.values()];
      pinchStart = {
        dist: Math.hypot(a.x-b.x, a.y-b.y),
        k: view.k,
        cx: (a.x+b.x)/2, cy: (a.y+b.y)/2
      };
      panning = false;
    }
  });

  svg.addEventListener('pointermove', e=>{
    const p = pointers.get(e.pointerId);
    if(!p) return;
    const prevX = p.x, prevY = p.y;
    p.x = e.clientX; p.y = e.clientY;

    if(pointers.size >= 2 && pinchStart){
      const [a,b] = [...pointers.values()];
      const dist = Math.hypot(a.x-b.x, a.y-b.y);
      if(pinchStart.dist > 0){
        const target = Math.max(MIN_K, Math.min(MAX_K, pinchStart.k * (dist / pinchStart.dist)));
        const r = svg.getBoundingClientRect();
        const cx = pinchStart.cx - r.left, cy = pinchStart.cy - r.top;
        const real = target / view.k;
        view.x = cx - (cx - view.x) * real;
        view.y = cy - (cy - view.y) * real;
        view.k = target;
        applyView();
      }
      return;
    }

    // 指1本。閾値を超えたらタップではなく移動に切り替える
    if(!panning){
      const moved = Math.hypot(e.clientX - p.sx, e.clientY - p.sy);
      if(moved < DRAG_THRESHOLD) return;
      panning = true;
      if(activePress){ activePress.abort(); activePress = null; }
    }
    view.x += e.clientX - prevX;
    view.y += e.clientY - prevY;
    applyView();
  });

  const endPointer = e=>{
    pointers.delete(e.pointerId);
    if(pointers.size < 2) pinchStart = null;
    if(pointers.size === 0) panning = false;
  };
  svg.addEventListener('pointerup', endPointer);
  svg.addEventListener('pointercancel', endPointer);
  svg.addEventListener('pointerleave', endPointer);

  // PCはホイールで拡大縮小
  svg.addEventListener('wheel', e=>{
    e.preventDefault();
    const p = svgPoint(e);
    zoomAt(p.x, p.y, e.deltaY < 0 ? 1.12 : 1/1.12);
  }, { passive:false });

  // 表示を初期状態へ戻す
  function resetView(){ view = { x:0, y:0, k:1 }; applyView(); }
  window.addEventListener('keydown', e=>{ if(e.key === '0') resetView(); });


  // ---------- 画面遷移 ----------
  const SCREENS = ['title','stageSelect','sizeSelect'];
  function showScreen(id){
    for(const s of SCREENS) $(s).classList.toggle('hidden', s !== id);
    const playing = !id;
    $('toTitle').style.visibility = playing ? 'visible' : 'hidden';
    $('hintBtn').style.visibility = playing ? 'visible' : 'hidden';
    if(playing) $('hintbar').textContent = HINT_TEXT;
    $('hintbar').style.visibility = playing ? 'visible' : 'hidden';
    if(!playing){ stopTimer(); result.classList.add('hidden'); loading.classList.add('hidden'); }
  }

  // ---------- 経過時間 ----------
  let startedAt = 0, timerId = null;
  function startTimer(){
    stopTimer();
    startedAt = Date.now();
    $('statTime').textContent = '0:00';
    timerId = setInterval(()=>{ $('statTime').textContent = fmtTime(Date.now()-startedAt); }, 500);
  }
  function stopTimer(){ if(timerId){ clearInterval(timerId); timerId = null; } }

  // ---------- 選択画面の中身 ----------
  function recordLine(id){
    const r = records[id];
    return r ? '自己ベスト ' + fmtTime(r.time) + ' / ミス ' + r.mistakes
             : '未クリア';
  }
  function buildStageGrid(){
    const grid = $('stageGrid');
    grid.innerHTML = '';
    STAGES.forEach((st,i)=>{
      const b = document.createElement('button');
      b.className = 'card';
      const rec = records['stage-'+st.key];
      b.innerHTML = '<div class="cName">' + (i+1) + '. ' + st.name + '</div>' +
        '<div class="cSub">' + st.formula + '　' + SHAPES[st.key].length + 'マス</div>' +
        '<div class="cRec' + (rec ? '' : ' none') + '">' + recordLine('stage-'+st.key) + '</div>';
      b.addEventListener('click', ()=> startMode({
        type:'tutorial', id:'stage-'+st.key, stage:st, seed:st.seed,
        shape:SHAPES[st.key], keepRatio:st.keepRatio, density:st.density,
        notation:st.notation, omitBlue:st.omitBlue, silentRatio:st.silentRatio
      }));
      grid.appendChild(b);
    });
  }
  function buildSizeGrid(){
    const grid = $('sizeGrid');
    grid.innerHTML = '';
    for(const sz of SIZES){
      const b = document.createElement('button');
      b.className = 'card';
      b.innerHTML = '<div class="cName">' + sz.name + '</div>' +
        '<div class="cSub">' + sz.cells + 'マス　' + sz.note + '</div>' +
        '<div class="cRec' + (records['size-'+sz.name] ? '' : ' none') + '">' + recordLine('size-'+sz.name) + '</div>';
      b.addEventListener('click', ()=> startMode({
        type:'infinite', id:'size-'+sz.name, size:sz,
        shape:hexagonShape(sz.R), keepRatio:0, density:0.44
      }));
      grid.appendChild(b);
    }
  }

  // ---------- モード開始 ----------
  let current = null;
  function startMode(cfg){
    current = cfg;
    showScreen(null);
    newPuzzle();
  }

  document.querySelectorAll('[data-go]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const to = b.dataset.go;
      if(to === 'stageSelect') buildStageGrid();
      if(to === 'sizeSelect') buildSizeGrid();
      showScreen(to);
    });
  });
  document.querySelectorAll('[data-back]').forEach(b=> b.addEventListener('click', ()=> showScreen('title')));
  $('toTitle').addEventListener('click', ()=>{ stopTimer(); lessonBox.classList.add('hidden'); showScreen('title'); });
  $('hintBtn').addEventListener('click', ()=> requestHint());
  $('dailyBtn').addEventListener('click', ()=> startMode({
    type:'daily', id:'daily-'+dailySeed(), seed:dailySeed(),
    shape:hexagonShape(DAILY_R), keepRatio:0, density:0.44
  }));

  // ---------- 生成 ----------
  function newPuzzle(){
    busy = true;
    result.classList.add('hidden');
    loading.classList.remove('hidden');
    loadBar.style.width = '0%';
    loadNote.textContent = '結合を検証中…';

    const shape = current.shape;
    // デイリーは日付から決まる種を使う。全員が同じ盤面になることが前提。
    const seed = current.seed !== undefined
      ? current.seed
      : ((Date.now() ^ Math.floor(Math.random()*1e9)) >>> 0);
    const w = ensureWorker();
    const handle = m=>{
      if(m.type === 'progress'){
        const pct = Math.round(m.done / m.total * 100);
        loadBar.style.width = pct + '%';
        loadNote.textContent = m.attempt > 0
          ? '構造を組み替えています…（' + (m.attempt+1) + '回目）'
          : 'ヒントを削っています ' + m.done + ' / ' + m.total;
        return;
      }
      if(m.type === 'done'){
        if(!m.puzzle){ loadNote.textContent = '生成に失敗しました。再試行します…'; newPuzzle(); return; }
        puzzle = m.puzzle;
        board = rebuildBoard(m.shape);
        state = new Array(board.size).fill(UNKNOWN);
        cellHint = new Array(board.size).fill(null);
        for(const h of puzzle.hints){
          if(h.owner === null || h.owner === undefined) continue;
          // 隠れている黒マスの数字も覚えておく。黒と確定した時点で表示する。
          cellHint[h.owner] = h;
          if(h.shown) state[h.owner] = (h.kind === 'blue') ? BLUE : BLACK;
        }
        mistakes = 0;
        busy = false;
        loading.classList.add('hidden');
        render();
        initLessons();
        startTimer();
      }
    };

    const req = { shape:shape, seed:seed, density:current.density, keepRatio:current.keepRatio,
                  notation:current.notation, omitBlue:current.omitBlue, silentRatio:current.silentRatio };
    if(w){ w.onmessage = e => handle(e.data); w.postMessage(req); }
    else  { generateLocally(req, handle); }
  }

  function finish(){
    if(busy) return;
    busy = true;
    stopTimer();
    const elapsed = Date.now() - startedAt;
    const isBest = saveRecord(current.id, elapsed, mistakes);

    let head = '', body = '';
    if(current.type === 'tutorial'){
      head = current.stage.name + '　' + current.stage.formula;
      body = current.stage.trivia;
    } else if(current.type === 'daily'){
      head = 'DAILY　' + new Date().toLocaleDateString('ja-JP');
      body = '全員が同じ盤面に挑んでいます。';
    } else {
      head = 'INFINITE　' + current.size.name;
      body = current.size.cells + 'マスを復元しました。';
    }
    $('resultTitle').textContent = mistakes === 0 ? 'PERFECT' : 'STRUCTURE RESTORED';
    $('resultMolecule').textContent = head;
    $('resultTrivia').textContent = body +
      '　／　' + fmtTime(elapsed) + '　ミス ' + mistakes +
      (isBest ? '　★自己ベスト更新' : '');
    result.classList.remove('hidden');
  }

  $('againBtn').addEventListener('click', ()=>{
    busy = false;
    if(current && current.type === 'daily'){ showScreen('title'); return; } // 同じ盤面を再挑戦させない
    if(current && current.type === 'tutorial'){ buildStageGrid(); showScreen('stageSelect'); return; }
    newPuzzle();
  });
  document.addEventListener('contextmenu', e=>{ if(e.target.closest('#board')) e.preventDefault(); });
  window.addEventListener('resize', ()=>{ if(board && !busy) render(); });

  showScreen('title');
})();
</script>
</body>
</html>
