<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#05070d">
<title>HEXAMINE</title>
<style>
  :root{
    --bg:#05070d; --panel:#0c1322; --line:rgba(32,230,255,.28);
    --cyan:#20e6ff; --magenta:#ff2ba6; --text:#dfe9ff; --muted:#7d8bab;
    --unknown:#243049; --void:#0a0f1c;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; height:100%; background:var(--bg); color:var(--text);
    font-family:'Segoe UI',system-ui,sans-serif; overflow:hidden;
    -webkit-user-select:none; user-select:none; touch-action:manipulation;}
  #app{position:relative; width:100%; height:100%; display:flex; flex-direction:column;}

  /* ---- HUD ---- */
  #hud{flex:0 0 auto; display:flex; align-items:center; justify-content:space-between;
    padding:10px 14px; border-bottom:1px solid var(--line); background:rgba(6,10,18,.9);}
  .brand{font-size:13px; letter-spacing:.28em; color:var(--cyan); text-shadow:0 0 14px rgba(32,230,255,.5);}
  .stats{display:flex; gap:16px; font-size:12px; letter-spacing:.08em;}
  .stat b{display:block; font-size:17px; font-weight:700; letter-spacing:0;}
  .stat span{color:var(--muted); font-size:10px;}
  .stat.bad b{color:var(--magenta);}

  /* ---- 盤面 ---- */
  #boardWrap{flex:1 1 auto; position:relative; overflow:hidden;}
  #board{position:absolute; inset:0; width:100%; height:100%;}
  .cell{cursor:pointer;}
  .cell .hexFill{transition:fill .18s, stroke .18s;}
  .cell .label{font-weight:700; text-anchor:middle; dominant-baseline:central; pointer-events:none;}
  .bond{stroke:rgba(32,230,255,.10); stroke-width:2; pointer-events:none;}
  /* ヒントの対象範囲。どのマスを数えているのかが分からないと推理できないため、
     本家と同じく触れている間だけ範囲を光らせる。 */
  #hl{pointer-events:none;}
  #hl polygon{fill:rgba(255,43,166,.13); stroke:var(--magenta); stroke-width:2.4;}
  #hl .src{fill:rgba(255,43,166,.30);}
  .lineHint{cursor:pointer;}

  /* ---- 画面(タイトル・選択) ---- */
  .screen{position:absolute; inset:0; z-index:4; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:16px; padding:22px 16px;
    background:radial-gradient(ellipse at 50% 30%,rgba(32,230,255,.07),transparent 60%),rgba(5,7,13,.98);
    overflow-y:auto;}
  .screen.hidden{display:none;}
  .logo{font-size:clamp(30px,9vw,52px); letter-spacing:.22em; color:var(--cyan);
    text-shadow:0 0 26px rgba(32,230,255,.55),0 0 60px rgba(255,43,166,.22);}
  .sub{margin-top:-6px; font-size:11px; letter-spacing:.14em; color:var(--muted);}
  .menu{display:flex; flex-direction:column; gap:11px; width:min(100%,330px); margin-top:12px;}
  .menuBtn{display:flex; flex-direction:column; gap:4px; padding:14px 18px; text-align:left;
    background:linear-gradient(135deg,rgba(17,20,37,.95),rgba(6,8,16,.9));
    border:1px solid var(--line); color:var(--text); cursor:pointer; transition:border-color .2s, transform .1s;}
  .menuBtn b{font-size:15px; letter-spacing:.16em; color:var(--cyan);}
  .menuBtn span{font-size:11px; color:var(--muted);}
  .menuBtn:hover{border-color:var(--cyan);}
  .menuBtn:active{transform:translateY(1px);}
  .menuBtn.accent b{color:var(--magenta);}
  .menuBtn.accent:hover{border-color:var(--magenta);}
  .foot{font-size:10px; color:var(--muted); letter-spacing:.08em; text-align:center;}
  .screenHead{display:flex; align-items:center; gap:14px; width:min(100%,520px);}
  .screenHead h2{margin:0; font-size:14px; letter-spacing:.2em; color:var(--cyan);}
  .backBtn{padding:7px 13px; background:transparent; border:1px solid var(--line);
    color:var(--muted); font-size:11px; cursor:pointer;}
  .backBtn:hover{color:var(--cyan); border-color:var(--cyan);}
  .stageGrid,.sizeGrid{display:grid; gap:10px; width:min(100%,520px);
    grid-template-columns:repeat(auto-fit,minmax(150px,1fr));}
  .card{padding:13px 15px; text-align:left; background:rgba(17,20,37,.85);
    border:1px solid var(--line); color:var(--text); cursor:pointer; transition:border-color .2s, transform .1s;}
  .card:hover{border-color:var(--cyan);} .card:active{transform:translateY(1px);}
  .card .cName{font-size:14px; color:var(--cyan);}
  .card .cSub{margin-top:3px; font-size:10px; color:var(--muted);}
  .card .cRec{margin-top:6px; font-size:11px; color:#c8d6ef;}
  .card .cRec.none{color:#5c6884;}
  .badge{display:inline-block; margin-left:7px; padding:1px 6px; font-size:9px;
    border:1px solid rgba(255,43,166,.5); color:var(--magenta);}

  /* ---- 生成中 ---- */
  #loading{position:absolute; inset:0; z-index:5; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:18px; background:rgba(5,7,13,.96);}
  #loading.hidden{display:none;}
  .loadTitle{font-size:13px; letter-spacing:.2em; color:var(--cyan);}
  .loadBarOuter{width:min(70%,320px); height:6px; background:#111a2c; border:1px solid var(--line); overflow:hidden;}
  .loadBar{height:100%; width:0%; background:linear-gradient(90deg,var(--cyan),var(--magenta)); transition:width .12s linear;}
  .loadNote{font-size:10px; color:var(--muted); letter-spacing:.1em;}
  .spinner{width:74px; height:74px;}
  .spinner circle{fill:none; stroke:var(--cyan); stroke-width:2; opacity:.85;}
  .spinner .orbit{stroke:rgba(32,230,255,.22);}

  /* ---- 結果 ---- */
  #result{position:absolute; inset:0; z-index:6; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:14px; background:rgba(5,7,13,.93);}
  #result.hidden{display:none;}
  #result h2{margin:0; font-size:22px; letter-spacing:.2em; color:var(--cyan);}
  #result .molecule{font-size:13px; color:var(--text);}
  #result .trivia{max-width:min(90%,420px); font-size:12px; line-height:1.8; color:var(--muted); text-align:center;}
  .btn{margin-top:8px; padding:11px 26px; background:transparent; color:var(--cyan);
    border:1px solid var(--cyan); letter-spacing:.16em; font-size:12px; cursor:pointer;}
  .btn:active{transform:translateY(1px);}

  #hintbar{flex:0 0 auto; padding:8px 14px 12px; text-align:center; font-size:10.5px;
    color:var(--muted); letter-spacing:.06em; border-top:1px solid rgba(32,230,255,.12);}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <button class="backBtn" id="toTitle" style="visibility:hidden">← MENU</button>
    <div class="stats">
      <div class="stat"><span>TIME</span><b id="statTime">0:00</b></div>
      <div class="stat"><span>REMAINING</span><b id="statRemain">-</b></div>
      <div class="stat bad"><span>MISTAKES</span><b id="statMiss">0</b></div>
    </div>
  </div>

  <div id="boardWrap">
    <svg id="board" xmlns="http://www.w3.org/2000/svg"></svg>

    <div id="title" class="screen">
      <div class="logo">HEXAMINE</div>
      <div class="sub">分子構造を、論理だけで復元する</div>
      <div class="menu">
        <button class="menuBtn" data-go="stageSelect">
          <b>TUTORIAL</b><span>6つの分子。操作と規則を覚える</span>
        </button>
        <button class="menuBtn" data-go="sizeSelect">
          <b>INFINITE</b><span>好きな大きさで、何度でも</span>
        </button>
        <button class="menuBtn accent" id="dailyBtn">
          <b>DAILY</b><span id="dailyLabel">今日の分子。全員が同じ盤面</span>
        </button>
      </div>
      <div class="foot">推測は要りません。必ず論理だけで解けます</div>
    </div>

    <div id="stageSelect" class="screen hidden">
      <div class="screenHead"><button class="backBtn" data-back>← 戻る</button><h2>TUTORIAL</h2></div>
      <div class="stageGrid" id="stageGrid"></div>
    </div>

    <div id="sizeSelect" class="screen hidden">
      <div class="screenHead"><button class="backBtn" data-back>← 戻る</button><h2>INFINITE</h2></div>
      <div class="sizeGrid" id="sizeGrid"></div>
      <div class="foot">大きいほど生成に時間がかかります</div>
    </div>

    <div id="loading">
      <svg class="spinner" viewBox="0 0 100 100">
        <circle class="orbit" cx="50" cy="50" r="34"></circle>
        <circle cx="50" cy="16" r="5">
          <animateTransform attributeName="transform" type="rotate" from="0 50 50" to="360 50 50" dur="2.4s" repeatCount="indefinite"/>
        </circle>
        <circle cx="50" cy="84" r="4">
          <animateTransform attributeName="transform" type="rotate" from="0 50 50" to="-360 50 50" dur="3.2s" repeatCount="indefinite"/>
        </circle>
        <circle cx="50" cy="50" r="7" style="fill:var(--cyan); stroke:none; opacity:.9"></circle>
      </svg>
      <div class="loadTitle">分子構造を組み立てています</div>
      <div class="loadBarOuter"><div class="loadBar" id="loadBar"></div></div>
      <div class="loadNote" id="loadNote">結合を検証中…</div>
    </div>

    <div id="result" class="hidden">
      <h2 id="resultTitle">STRUCTURE RESTORED</h2>
      <div class="molecule" id="resultMolecule"></div>
      <div class="trivia" id="resultTrivia"></div>
      <button class="btn" id="againBtn">NEXT</button>
    </div>
  </div>

  <div id="hintbar">タップ＝原子あり　／　長押し＝空孔　／　ドラッグで移動・ピンチで拡大（PCは左右クリックとホイール、0キーで表示リセット）</div>
</div>

<!--
  盤面生成はここに書いたコードを Web Worker として動かす。
  生成には1〜3秒かかるため、同じスレッドで回すとロード画面のアニメーションまで止まる。
  Blob経由でWorker化しているので、単一HTMLのままで別スレッドにできる。

  ★このブロックがソルバーの唯一の正本。tools/hex/solver.test.mjs はここから
  　コードを取り出して検証する。二重管理して食い違うのを避けるため。
-->
<script type="javascript/worker" id="solverSource">
// ---------- 六角格子(axial座標) ----------
// 隣接の順序は時計回りで固定する。{n} の連続判定が順序に依存するため。
const DIRS = [[1,0],[1,-1],[0,-1],[-1,0],[-1,1],[0,1]];
const key = (q,r)=>q+','+r;
const hexDistance = (a,b)=>
  (Math.abs(a[0]-b[0]) + Math.abs(a[1]-b[1]) + Math.abs(a[0]+a[1]-b[0]-b[1])) / 2;
const UNKNOWN = 0, BLUE = 1, BLACK = 2;

function makeBoard(cellList){
  const cells = cellList.map(c=>[c[0],c[1]]);
  const index = new Map(cells.map((c,i)=>[key(c[0],c[1]), i]));
  const at = (q,r)=> index.has(key(q,r)) ? index.get(key(q,r)) : null;
  const ring = cells.map(c=>DIRS.map(d=>at(c[0]+d[0], c[1]+d[1])));
  const halo = cells.map((c,i)=>
    cells.map((o,j)=>[o,j]).filter(p=>{
      const d = hexDistance(c,p[0]);
      return p[1]!==i && d>=1 && d<=2;
    }).map(p=>p[1])
  );
  const lines = [];
  for(const axis of ['q','r','s']){
    const groups = new Map();
    cells.forEach((c,i)=>{
      const g = axis==='q' ? c[0] : axis==='r' ? c[1] : c[0]+c[1];
      if(!groups.has(g)) groups.set(g, []);
      groups.get(g).push(i);
    });
    for(const entry of groups){
      const list = entry[1];
      if(list.length < 2) continue;
      list.sort((a,b)=> axis==='q' ? cells[a][1]-cells[b][1] : cells[a][0]-cells[b][0]);
      lines.push({ axis, cells:list });
    }
  }
  return { cells, index, at, ring, halo, lines, size:cells.length };
}

// 盤外(null)は隙間として扱う。ring=true は輪として見る
function isConsecutive(order, blueSet, ring){
  const seq = order.map(i => (i!==null && blueSet.has(i)) ? '1' : '0').join('');
  const n = (seq.match(/1/g) || []).length;
  if(n <= 1) return true;
  const runs = (ring ? seq + seq : seq).match(/1+/g) || [];
  return runs.some(run => run.length >= n);
}

// ---------- ヒント ----------
function makeHint(kind, scope, order, ring, count, mode, reveal){
  return { kind:kind, cells:scope, order:order, ring:ring, count:count, mode:mode, reveal:reveal };
}

function buildAllHints(board, truth){
  const hints = [];
  const blueSet = new Set();
  truth.forEach((v,i)=>{ if(v===BLUE) blueSet.add(i); });

  board.cells.forEach((c,i)=>{
    if(truth[i] === BLACK){
      const order = board.ring[i];
      const scope = order.filter(x=>x!==null);
      const count = scope.filter(j=>truth[j]===BLUE).length;
      const consec = isConsecutive(order, blueSet, true);
      // 0個や多すぎる場合に並び情報を付けても推理の足しにならないため素の数字にする
      const mode = (count>=2 && count<=4) ? (consec?'consec':'split') : 'plain';
      hints.push(makeHint('black', scope, order, true, count, mode, [i, BLACK]));
    } else {
      const scope = board.halo[i];
      const count = scope.filter(j=>truth[j]===BLUE).length;
      hints.push(makeHint('blue', scope, scope, false, count, 'plain', [i, BLUE]));
    }
  });

  for(const line of board.lines){
    const count = line.cells.filter(j=>truth[j]===BLUE).length;
    const consec = isConsecutive(line.cells, blueSet, false);
    const mode = (count>=2) ? (consec?'consec':'split') : 'plain';
    hints.push(makeHint('line', line.cells, line.cells, false, count, mode, null));
  }

  // 残り原子数のカウンター。実際のプレイでも推理に使える情報なので制約として持つ
  hints.push(makeHint('total', board.cells.map((_,i)=>i), null, false, blueSet.size, 'plain', null));
  return hints;
}

// ---------- 列挙 ----------
const ENUM_LIMIT = 16;

function enumerateHint(hint, state){
  const unknown = hint.cells.filter(i => state[i] === UNKNOWN);
  const knownBlue = hint.cells.filter(i => state[i] === BLUE).length;
  const need = hint.count - knownBlue;
  if(need < 0 || need > unknown.length) return { contradiction:true };
  if(unknown.length === 0) return { skip:true };

  // 素の個数指定から確定できるのは、両端の場合だけ。
  // 「この範囲に n 個ある」という情報だけでは、n が 0 でも全部でもない限り
  // どのマスが青かは決まらない。並べても答えが出ないので列挙しない。
  // 大きい盤面では長い列のヒントがここに来るため、効き幅が非常に大きい。
  if(hint.mode === 'plain'){
    if(need === 0) return { unknown:unknown, forced:BLACK };
    if(need === unknown.length) return { unknown:unknown, forced:BLUE };
    return { skip:true };
  }

  // 連続/非連続の指定がある時だけ、並び方を実際に試す必要がある
  if(unknown.length > ENUM_LIMIT) return { skip:true };
  const fixedBlue = hint.cells.filter(i => state[i] === BLUE);
  const valid = [];
  const combo = [];
  const check = ()=>{
    const set = new Set(fixedBlue);
    for(const i of combo) set.add(i);
    const consec = isConsecutive(hint.order, set, hint.ring);
    return hint.mode === 'consec' ? consec : !consec;
  };
  (function pick(pos, left){
    if(left === 0){ if(check()) valid.push(combo.slice()); return; }
    if(pos >= unknown.length || unknown.length - pos < left) return;
    combo.push(unknown[pos]); pick(pos+1, left-1); combo.pop();
    pick(pos+1, left);
  })(0, need);

  if(!valid.length) return { contradiction:true };
  return { unknown:unknown, valid:valid };
}

// ---------- ソルバー ----------
// 総当たりは使わない。人間と同じ推論だけで解け切るかを見るため、
// 解け切ること自体が「推測不要」の保証になる。
// depth1 = ヒント単独 / depth2 = 重なる2ヒントの突き合わせ
function solve(board, hints, revealed, opts){
  const maxDepth = (opts && opts.maxDepth) || 2;
  const state = new Array(board.size).fill(UNKNOWN);
  for(const rv of revealed) state[rv[0]] = rv[1];
  let usedDepth = 0, steps = 0;

  // どのマスがどのヒントに含まれるかを先に引けるようにする。
  // 1マス確定するたび全ヒントを見直していると、盤面が大きいほど無駄が効いてくる。
  const byCell = new Array(board.size);
  for(let i=0;i<board.size;i++) byCell[i] = [];
  hints.forEach((h,hi)=>{ for(const c of h.cells) byCell[c].push(hi); });

  // 見直すべきヒントだけを順に処理する。確定したマスを含むヒントだけを積み直す。
  const queued = new Uint8Array(hints.length);
  let queue = [], qh = 0;
  const push = hi =>{ if(!queued[hi]){ queued[hi] = 1; queue.push(hi); } };
  const resolve = (i, v)=>{
    state[i] = v; steps++;
    for(const hi of byCell[i]) push(hi);
  };
  for(let hi=0; hi<hints.length; hi++) push(hi);

  const runQueue = ()=>{
    while(qh < queue.length){
      const hi = queue[qh++];
      queued[hi] = 0;
      const res = enumerateHint(hints[hi], state);
      if(res.contradiction) return false;
      if(res.skip) continue;
      if(res.forced !== undefined){
        for(const i of res.unknown) resolve(i, res.forced);
        usedDepth = Math.max(usedDepth, 1);
        continue;
      }
      for(const i of res.unknown){
        const inAll  = res.valid.every(v => v.indexOf(i) >= 0);
        const inNone = res.valid.every(v => v.indexOf(i) < 0);
        if(inAll){ resolve(i, BLUE); usedDepth = Math.max(usedDepth, 1); }
        else if(inNone){ resolve(i, BLACK); usedDepth = Math.max(usedDepth, 1); }
      }
    }
    queue = []; qh = 0;
    return true;
  };

  // 重なる2ヒントの突き合わせ。
  // 同じ未確定マスを含むヒント同士だけを候補にする(共有マスが確定済みの組は
  // 互いに新しい情報を与えないため見なくてよい)。同じ組を二度試さないよう記録する。
  const popcount = x =>{
    x = x - ((x >> 1) & 0x55555555);
    x = (x & 0x33333333) + ((x >> 2) & 0x33333333);
    x = (x + (x >> 4)) & 0x0f0f0f0f;
    return (x * 0x01010101) >> 24;
  };
  const PAIR_LIMIT = 14; // 2^14 まで。ここを上げると解ける範囲は広がるが急激に重くなる
  const applyPair = ()=>{
    // 1件見つけるたびに戻ると、そのたびに走査が最初からやり直しになる。
    // 1回の走査で見つかった分をまとめて適用してから戻す。
    let anyProgress = false;
    const seen = new Set();
    for(let c=0;c<board.size;c++){
      if(state[c] !== UNKNOWN) continue;
      const list = byCell[c];
      for(let a=0;a<list.length;a++){
        for(let b=a+1;b<list.length;b++){
          const ia = list[a], ib = list[b];
          const pairKey = ia * hints.length + ib;
          if(seen.has(pairKey)) continue;
          seen.add(pairKey);

          const A = hints[ia], B = hints[ib];
          const union = [...new Set(A.cells.concat(B.cells))];
          const unknown = union.filter(i => state[i] === UNKNOWN);
          const n = unknown.length;
          if(!n || n > PAIR_LIMIT) continue;

          // 未確定マスをビット位置へ割り当て、配列を作り直さずに数え上げる。
          // ここで state.slice() を毎回作ると、桁違いに遅くなる。
          const slot = new Map();
          for(let k=0;k<n;k++) slot.set(unknown[k], k);
          const prep = h =>{
            let m = 0, known = 0;
            for(const i of h.cells){
              if(state[i] === BLUE) known++;
              else if(slot.has(i)) m |= (1 << slot.get(i));
            }
            return { m:m, need:h.count - known, h:h };
          };
          const pa = prep(A), pb = prep(B);
          if(pa.need < 0 || pb.need < 0) return 'contradiction';

          const ok = [];
          const total = 1 << n;
          for(let mask=0; mask<total; mask++){
            if(popcount(mask & pa.m) !== pa.need) continue;
            if(popcount(mask & pb.m) !== pb.need) continue;
            if(A.mode !== 'plain' || B.mode !== 'plain'){
              let fits = true;
              for(const p of [pa, pb]){
                if(p.h.mode === 'plain') continue;
                const blues = new Set();
                for(const i of p.h.cells){
                  if(state[i] === BLUE) blues.add(i);
                  else if(slot.has(i) && (mask >> slot.get(i) & 1)) blues.add(i);
                }
                const consec = isConsecutive(p.h.order, blues, p.h.ring);
                if(p.h.mode === 'consec' ? !consec : consec){ fits = false; break; }
              }
              if(!fits) continue;
            }
            ok.push(mask);
          }
          if(!ok.length) return 'contradiction';

          let progress = false;
          for(let k=0;k<n;k++){
            const all  = ok.every(m => (m >> k & 1));
            const none = ok.every(m => !(m >> k & 1));
            if(all){ resolve(unknown[k], BLUE); progress = true; }
            else if(none){ resolve(unknown[k], BLACK); progress = true; }
          }
          if(progress){ usedDepth = 2; anyProgress = true; }
        }
      }
    }
    return anyProgress;
  };

  for(;;){
    if(!runQueue()) return { ok:false, solved:false, state:state, depth:usedDepth, steps:steps };
    if(maxDepth < 2) break;
    const pair = applyPair();
    if(pair === 'contradiction') return { ok:false, solved:false, state:state, depth:usedDepth, steps:steps };
    if(!pair) break;
  }
  return { ok:true, solved: state.every(v => v !== UNKNOWN), state:state, depth:usedDepth, steps:steps };
}

const revealedFrom = hints => hints.filter(h => h.reveal).map(h => h.reveal);

// ---------- 生成 ----------
// 全ヒントから始めて、解ける限り削る。削るほど難しくなるので、
// 「どこまで削るか」がそのまま難易度のつまみになる。
function mulberry32(seed){
  let a = seed >>> 0;
  return ()=>{
    a = (a + 0x6D2B79F5) >>> 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function generate(board, opts, onProgress){
  const o = opts || {};
  const seed = o.seed || 1, density = o.density || 0.42;
  const maxDepth = o.maxDepth || 2, keepRatio = o.keepRatio || 0;
  // 削る試行の上限。盤面が大きいほど試行数が増えて生成時間が伸びるため、
  // ここで頭打ちにする。上限に当たった場合はヒントが多めに残る＝少し易しくなるだけで、
  // 「推測なしで解ける」という保証は変わらない。
  const maxTries = o.maxTries || Infinity;
  const rnd = mulberry32(seed);
  const truth = board.cells.map(()=> rnd() < density ? BLUE : BLACK);
  const blues = truth.filter(v=>v===BLUE).length;
  if(blues < 3 || blues > board.size - 3) return null;

  const all = buildAllHints(board, truth);
  if(!solve(board, all, revealedFrom(all), {maxDepth:maxDepth}).solved) return null;

  const order = all.map((_,i)=>i);
  for(let i=order.length-1;i>0;i--){
    const j = Math.floor(rnd()*(i+1));
    const t = order[i]; order[i] = order[j]; order[j] = t;
  }
  // keepRatio の抽選は先に済ませる。手順を種だけで決まる形にしておく。
  const skipFlag = order.map(()=> keepRatio > 0 && rnd() < keepRatio);

  // まとめて削る方式も試したが、削れるヒントの割合が低く、
  // 大半のまとめ削除が失敗して解き直しが増えるため、1つずつのほうが速い。
  let kept = all.slice();
  let tries = 0;
  for(let n=0; n<order.length; n++){
    if(tries >= maxTries) break;
    if(skipFlag[n]) continue;
    const target = all[order[n]];
    const trial = kept.filter(h => h !== target);
    if(!trial.length) continue;
    tries++;
    if(solve(board, trial, revealedFrom(trial), {maxDepth:maxDepth}).solved){
      kept = trial;
    } else if(target.kind === 'black' && target.count !== null && target.cells.length){
      // 丸ごと消せないなら「?」へ落とす。マスは黒だと見せるが、数字は伏せる。
      // 「消す」と「残す」の間に一段挟むことで、難易度の刻みが細かくなる。
      // cells を空にしてあるので制約としては何も課さず、開示だけが残る。
      const q = { kind:'black', cells:[], order:[], ring:false,
                  count:null, mode:'plain', reveal:target.reveal };
      const trial2 = kept.map(h => h === target ? q : h);
      if(solve(board, trial2, revealedFrom(trial2), {maxDepth:maxDepth}).solved) kept = trial2;
    }
    if(onProgress && (n & 3) === 0) onProgress(n, order.length);
  }

  const final = solve(board, kept, revealedFrom(kept), {maxDepth:maxDepth});
  return { truth:truth, hints:kept, totalHints:all.length, blues:blues,
           depth:final.depth, steps:final.steps, solved:final.solved };
}

function hexagon(R){
  const out=[];
  for(let q=-R;q<=R;q++) for(let r=-R;r<=R;r++) if(Math.abs(q+r)<=R) out.push([q,r]);
  return out;
}

// ---------- Worker側の入口 ----------
// Worker として動いている時だけ待ち受ける。Node のテストから読んだ時は素通りする
if(typeof importScripts === 'function'){
  self.onmessage = function(e){
    const req = e.data;
    const board = makeBoard(req.shape);
    let puzzle = null, seed = req.seed;
    // 生成に失敗する種(青が偏りすぎ等)は隣の種へずらして再挑戦する
    for(let attempt=0; attempt<40 && !puzzle; attempt++, seed++){
      puzzle = generate(board, { seed:seed, density:req.density, keepRatio:req.keepRatio },
        (done,total)=> postMessage({ type:'progress', done:done, total:total, attempt:attempt }));
    }
    postMessage({ type:'done', puzzle:puzzle, seed:seed, shape:req.shape });
  };
}

  function clearScope(){ if(hlLayer) hlLayer.innerHTML = ''; }

  function paintCell(i){
    const n = cellNodes[i], v = state[i], h = cellHint[i];
    if(v === UNKNOWN){
      n.hex.setAttribute('fill', 'var(--unknown)');
      n.hex.setAttribute('stroke', 'rgba(32,230,255,.30)');
      n.hex.setAttribute('stroke-width', '1.5');
      n.label.textContent = '';
    } else if(v === BLUE){
      n.hex.setAttribute('fill', 'var(--cyan)');
      n.hex.setAttribute('stroke', 'rgba(32,230,255,.9)');
      n.hex.setAttribute('stroke-width', '2');
      n.label.setAttribute('fill', '#04202c');
      n.label.textContent = (h && h.kind === 'blue') ? String(h.count) : '';
    } else {
      n.hex.setAttribute('fill', 'var(--void)');
      n.hex.setAttribute('stroke', 'rgba(125,139,171,.35)');
      n.hex.setAttribute('stroke-width', '1.5');
      n.label.setAttribute('fill', '#9fb4d6');
      n.label.textContent = (h && h.kind === 'black') ? decorate(h.count, h.mode) : '';
    }
  }
  function paintAll(){ for(let i=0;i<board.size;i++) paintCell(i); updateStats(); }

  function updateStats(){
    let remain = 0;
    for(let i=0;i<board.size;i++) if(puzzle.truth[i] === BLUE && state[i] !== BLUE) remain++;
    statRemain.textContent = remain;
    statMiss.textContent = mistakes;
    if(remain === 0) finish();
  }

  // ---------- 入力 ----------
  // スマホには右クリックが無い。タップ=原子あり、長押し=空孔で分ける。
  // 長押し中は枠色を変えて、判定に入ったことを見せる。
  function bindInput(node, i){
    let timer = null, longFired = false;
    // 指が動いた時に外から打ち切れるよう、進行中の操作を共有しておく
    const abort = ()=>{
      if(timer){ clearTimeout(timer); timer = null; }
      longFired = true;          // 以降のpointerupでマークさせない
      clearScope();
      paintCell(i);
    };

    const startPress = ()=>{
      // 数字を持つ確定済みのマスは、押している間だけ対象範囲を見せる
      if(state[i] !== UNKNOWN){
        if(cellHint[i] && cellHint[i].cells.length) showScope(cellHint[i].cells, i);
        return;
      }
      if(busy) return;
      longFired = false;
      cellNodes[i].hex.setAttribute('stroke', 'var(--magenta)');
      cellNodes[i].hex.setAttribute('stroke-width', '3');
      timer = setTimeout(()=>{ longFired = true; timer = null; commit(i, BLACK); }, LONG_MS);
      activePress = { abort:abort };
    };
    const endPress = ()=>{
      activePress = null;
      clearScope();
      if(timer){ clearTimeout(timer); timer = null; if(!longFired) commit(i, BLUE); }
      else if(!longFired) paintCell(i);
    };
    const cancelPress = ()=>{
      activePress = null;
      clearScope();
      if(timer){ clearTimeout(timer); timer = null; }
      if(!longFired) paintCell(i);
    };
    // PCはホバーだけで範囲が見えたほうが速い
    node.addEventListener('mouseenter', ()=>{ if(state[i] !== UNKNOWN && cellHint[i] && cellHint[i].cells.length) showScope(cellHint[i].cells, i); });
    node.addEventListener('mouseleave', clearScope);

    node.addEventListener('pointerdown', e=>{
      if(e.pointerType === 'mouse' && e.button === 2) return; // PCの右クリックは contextmenu で拾う
      e.preventDefault(); startPress();
    });
    node.addEventListener('pointerup', e=>{ e.preventDefault(); endPress(); });
    node.addEventListener('pointerleave', cancelPress);
    node.addEventListener('pointercancel', cancelPress);
    node.addEventListener('contextmenu', e=>{ e.preventDefault(); if(!busy) commit(i, BLACK); });
  }

  function commit(i, guess){
    if(busy || state[i] !== UNKNOWN) return;
    const actual = puzzle.truth[i];
    if(guess !== actual) mistakes++;   // 間違えても失敗にはせず、正しい値を開く
    state[i] = actual;
    paintCell(i);
    updateStats();
  }

  // ---------- 盤面の移動と拡大縮小 ----------
  // 盤面は端末によらず同じ大きさで作る(デイリーの公平性のため)。
  // 画面に収まらない分は、見る側を動かして対応する。
  svg.addEventListener('pointerdown', e=>{
    pointers.set(e.pointerId, { x:e.clientX, y:e.clientY, sx:e.clientX, sy:e.clientY });
    if(pointers.size === 2){
      // 2本目が触れた時点で、進行中のタップ/長押しは取り消す
      if(activePress){ activePress.abort(); activePress = null; }
      const [a,b] = [...pointers.values()];
      pinchStart = {
        dist: Math.hypot(a.x-b.x, a.y-b.y),
        k: view.k,
        cx: (a.x+b.x)/2, cy: (a.y+b.y)/2
      };
      panning = false;
    }
  });

  svg.addEventListener('pointermove', e=>{
    const p = pointers.get(e.pointerId);
    if(!p) return;
    const prevX = p.x, prevY = p.y;
    p.x = e.clientX; p.y = e.clientY;

    if(pointers.size >= 2 && pinchStart){
      const [a,b] = [...pointers.values()];
      const dist = Math.hypot(a.x-b.x, a.y-b.y);
      if(pinchStart.dist > 0){
        const target = Math.max(MIN_K, Math.min(MAX_K, pinchStart.k * (dist / pinchStart.dist)));
        const r = svg.getBoundingClientRect();
        const cx = pinchStart.cx - r.left, cy = pinchStart.cy - r.top;
        const real = target / view.k;
        view.x = cx - (cx - view.x) * real;
        view.y = cy - (cy - view.y) * real;
        view.k = target;
        applyView();
      }
      return;
    }

    // 指1本。閾値を超えたらタップではなく移動に切り替える
    if(!panning){
      const moved = Math.hypot(e.clientX - p.sx, e.clientY - p.sy);
      if(moved < DRAG_THRESHOLD) return;
      panning = true;
      if(activePress){ activePress.abort(); activePress = null; }
    }
    view.x += e.clientX - prevX;
    view.y += e.clientY - prevY;
    applyView();
  });

  const endPointer = e=>{
    pointers.delete(e.pointerId);
    if(pointers.size < 2) pinchStart = null;
    if(pointers.size === 0) panning = false;
  };
  svg.addEventListener('pointerup', endPointer);
  svg.addEventListener('pointercancel', endPointer);
  svg.addEventListener('pointerleave', endPointer);

  // PCはホイールで拡大縮小
  svg.addEventListener('wheel', e=>{
    e.preventDefault();
    const p = svgPoint(e);
    zoomAt(p.x, p.y, e.deltaY < 0 ? 1.12 : 1/1.12);
  }, { passive:false });

  // 表示を初期状態へ戻す
  function resetView(){ view = { x:0, y:0, k:1 }; applyView(); }
  window.addEventListener('keydown', e=>{ if(e.key === '0') resetView(); });


  // ---------- 画面遷移 ----------
  const SCREENS = ['title','stageSelect','sizeSelect'];
  function showScreen(id){
    for(const s of SCREENS) $(s).classList.toggle('hidden', s !== id);
    const playing = !id;
    $('toTitle').style.visibility = playing ? 'visible' : 'hidden';
    $('hintbar').style.visibility = playing ? 'visible' : 'hidden';
    if(!playing){ stopTimer(); result.classList.add('hidden'); loading.classList.add('hidden'); }
  }

  // ---------- 経過時間 ----------
  let startedAt = 0, timerId = null;
  function startTimer(){
    stopTimer();
    startedAt = Date.now();
    $('statTime').textContent = '0:00';
    timerId = setInterval(()=>{ $('statTime').textContent = fmtTime(Date.now()-startedAt); }, 500);
  }
  function stopTimer(){ if(timerId){ clearInterval(timerId); timerId = null; } }

  // ---------- 選択画面の中身 ----------
  function recordLine(id){
    const r = records[id];
    return r ? '自己ベスト ' + fmtTime(r.time) + ' / ミス ' + r.mistakes
             : '未クリア';
  }
  function buildStageGrid(){
    const grid = $('stageGrid');
    grid.innerHTML = '';
    STAGES.forEach((st,i)=>{
      const b = document.createElement('button');
      b.className = 'card';
      const rec = records['stage-'+st.key];
      b.innerHTML = '<div class="cName">' + (i+1) + '. ' + st.name + '</div>' +
        '<div class="cSub">' + st.formula + '　' + SHAPES[st.key].length + 'マス</div>' +
        '<div class="cRec' + (rec ? '' : ' none') + '">' + recordLine('stage-'+st.key) + '</div>';
      b.addEventListener('click', ()=> startMode({
        type:'tutorial', id:'stage-'+st.key, stage:st,
        shape:SHAPES[st.key], keepRatio:st.keepRatio, density:st.density
      }));
      grid.appendChild(b);
    });
  }
  function buildSizeGrid(){
    const grid = $('sizeGrid');
    grid.innerHTML = '';
    for(const sz of SIZES){
      const b = document.createElement('button');
      b.className = 'card';
      b.innerHTML = '<div class="cName">' + sz.name + '</div>' +
        '<div class="cSub">' + sz.cells + 'マス　' + sz.note + '</div>' +
        '<div class="cRec' + (records['size-'+sz.name] ? '' : ' none') + '">' + recordLine('size-'+sz.name) + '</div>';
      b.addEventListener('click', ()=> startMode({
        type:'infinite', id:'size-'+sz.name, size:sz,
        shape:hexagonShape(sz.R), keepRatio:0, density:0.44
      }));
      grid.appendChild(b);
    }
  }

  // ---------- モード開始 ----------
  let current = null;
  function startMode(cfg){
    current = cfg;
    showScreen(null);
    newPuzzle();
  }

  document.querySelectorAll('[data-go]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const to = b.dataset.go;
      if(to === 'stageSelect') buildStageGrid();
      if(to === 'sizeSelect') buildSizeGrid();
      showScreen(to);
    });
  });
  document.querySelectorAll('[data-back]').forEach(b=> b.addEventListener('click', ()=> showScreen('title')));
  $('toTitle').addEventListener('click', ()=>{ stopTimer(); showScreen('title'); });
  $('dailyBtn').addEventListener('click', ()=> startMode({
    type:'daily', id:'daily-'+dailySeed(), seed:dailySeed(),
    shape:hexagonShape(DAILY_R), keepRatio:0, density:0.44
  }));

  // ---------- 生成 ----------
  function newPuzzle(){
    busy = true;
    result.classList.add('hidden');
    loading.classList.remove('hidden');
    loadBar.style.width = '0%';
    loadNote.textContent = '結合を検証中…';

    const shape = current.shape;
    // デイリーは日付から決まる種を使う。全員が同じ盤面になることが前提。
    const seed = current.seed !== undefined
      ? current.seed
      : ((Date.now() ^ Math.floor(Math.random()*1e9)) >>> 0);
    const w = ensureWorker();
    const handle = m=>{
      if(m.type === 'progress'){
        const pct = Math.round(m.done / m.total * 100);
        loadBar.style.width = pct + '%';
        loadNote.textContent = m.attempt > 0
          ? '構造を組み替えています…（' + (m.attempt+1) + '回目）'
          : 'ヒントを削っています ' + m.done + ' / ' + m.total;
        return;
      }
      if(m.type === 'done'){
        if(!m.puzzle){ loadNote.textContent = '生成に失敗しました。再試行します…'; newPuzzle(); return; }
        puzzle = m.puzzle;
        board = rebuildBoard(m.shape);
        state = new Array(board.size).fill(UNKNOWN);
        cellHint = new Array(board.size).fill(null);
        for(const h of puzzle.hints){
          if(h.reveal){ cellHint[h.reveal[0]] = h; state[h.reveal[0]] = h.reveal[1]; }
        }
        mistakes = 0;
        busy = false;
        loading.classList.add('hidden');
        render();
        startTimer();
      }
    };

    const req = { shape:shape, seed:seed, density:current.density, keepRatio:current.keepRatio };
    if(w){ w.onmessage = e => handle(e.data); w.postMessage(req); }
    else  { generateLocally(req, handle); }
  }

  function finish(){
    if(busy) return;
    busy = true;
    stopTimer();
    const elapsed = Date.now() - startedAt;
    const isBest = saveRecord(current.id, elapsed, mistakes);

    let head = '', body = '';
    if(current.type === 'tutorial'){
      head = current.stage.name + '　' + current.stage.formula;
      body = current.stage.trivia;
    } else if(current.type === 'daily'){
      head = 'DAILY　' + new Date().toLocaleDateString('ja-JP');
      body = '全員が同じ盤面に挑んでいます。';
    } else {
      head = 'INFINITE　' + current.size.name;
      body = current.size.cells + 'マスを復元しました。';
    }
    $('resultTitle').textContent = mistakes === 0 ? 'PERFECT' : 'STRUCTURE RESTORED';
    $('resultMolecule').textContent = head;
    $('resultTrivia').textContent = body +
      '　／　' + fmtTime(elapsed) + '　ミス ' + mistakes +
      (isBest ? '　★自己ベスト更新' : '');
    result.classList.remove('hidden');
  }

  $('againBtn').addEventListener('click', ()=>{
    busy = false;
    if(current && current.type === 'daily'){ showScreen('title'); return; } // 同じ盤面を再挑戦させない
    if(current && current.type === 'tutorial'){ buildStageGrid(); showScreen('stageSelect'); return; }
    newPuzzle();
  });
  document.addEventListener('contextmenu', e=>{ if(e.target.closest('#board')) e.preventDefault(); });
  window.addEventListener('resize', ()=>{ if(board && !busy) render(); });

  showScreen('title');
})();
</script>
</body>
</html>
