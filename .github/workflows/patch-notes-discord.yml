# index.html のパッチノートが増えたら、その追加分だけを Discord へ流す。
#
# Webhook URL はリポジトリの Settings → Secrets and variables → Actions に
# DISCORD_WEBHOOK_URL という名前で登録する。このリポジトリは公開のため、
# ファイルへ直接書くと誰でもそのチャンネルへ投稿できてしまう。
name: パッチノートをDiscordへ通知

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
  # 手動実行。過去分をまとめて流したい時や、送り直したい時に使う
  workflow_dispatch:
    inputs:
      mode:
        description: '送る範囲'
        required: true
        default: 'diff'
        type: choice
        options:
          - diff   # 比較元との差分だけ（通常）
          - all    # 現在のパッチノート全件。チャンネル開設直後の一括投稿用
      base:
        description: 'diffモードの比較元コミット'
        required: false
        default: 'HEAD~1'

jobs:
  notify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # 1つ前のコミットと差分を取るため、2世代ぶん取得する
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: パッチノートを送信
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MODE: ${{ github.event.inputs.mode || 'diff' }}
          BASE: ${{ github.event.inputs.base || 'HEAD~1' }}
        run: |
          if [ "$MODE" = "all" ]; then
            node tools/patch-notes-to-discord.mjs --all
          else
            node tools/patch-notes-to-discord.mjs --base "$BASE"
          fi
