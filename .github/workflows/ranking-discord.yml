# ランキングの1位が更新されていたら Discord へ通知する。
#
# 「前回の1位」を tools/ranking-state.json に持ち、変化した時だけ投稿する。
# 状態ファイルはこのワークフローが書き戻すため contents: write が必要。
#
# 必要なSecrets:
#   DISCORD_RANKING_WEBHOOK_URL  ランキング専用チャンネルのWebhook。任意
#   DISCORD_WEBHOOK_URL          上が未設定のときの投稿先（パッチノートと同じ場所になる）
#   NG_WORDS                     任意。カンマ区切り。名前に含まれたら伏せ字にする
#
# Discordのウェブフックは発行したチャンネルに固定されるため、送信先の指定は
# URLそのものが担う。チャンネルを分けたい場合は、そのチャンネルで発行した
# URLを DISCORD_RANKING_WEBHOOK_URL へ入れる。
name: ランキング更新をDiscordへ通知

on:
  schedule:
    # 記録更新の熱量を保つため5分ごと。GitHubの混雑状況により数分遅れることがある。
    - cron: '*/5 * * * *'
  workflow_dispatch:

# 同時に走って状態ファイルの書き戻しが衝突しないようにする
concurrency:
  group: ranking-discord
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 1位の更新を確認して送信
        env:
          # ランキング専用のWebhookがあればそちらへ。無ければパッチノートと同じ場所へ送る
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_RANKING_WEBHOOK_URL || secrets.DISCORD_WEBHOOK_URL }}
          NG_WORDS: ${{ secrets.NG_WORDS }}
        run: node tools/ranking-to-discord.mjs

      - name: 状態ファイルを保存
        run: |
          if git diff --quiet -- tools/ranking-state.json; then
            echo "更新なし。コミットしない。"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/ranking-state.json
          # [skip ci] を付けて、この書き戻しで他のワークフローが走らないようにする
          git commit -m "chore: ランキングの通知済み記録を更新 [skip ci]"
          git push
