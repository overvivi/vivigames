<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <!-- カセットの殻の寸法基準図。赤い枠にはラベルを描かないこと。 -->
  <rect width="600" height="800" fill="#0b0d14"/>
  <text x="18" y="30" font-size="19" fill="#dfe7ff" font-family="sans-serif">cartridge-shell.png / 600 x 800 / 背景は透過</text>

  <rect x="24" y="48" width="552" height="736" rx="14"
        fill="none" stroke="#3f4a63" stroke-width="3" stroke-dasharray="9 7"/>

  <!-- ラベルのくぼみ -->
  <rect x="60" y="88" width="480" height="480" rx="6"
        fill="rgba(255,60,120,.12)" stroke="#ff3c78" stroke-width="4"/>
  <text x="60" y="80" font-size="20" fill="#ff7aa5" font-family="sans-serif">ラベルのくぼみ（無地・正方形）</text>
  <text x="128" y="330" font-size="24" fill="#ff7aa5" font-family="sans-serif">絵も文字も</text>
  <text x="128" y="362" font-size="24" fill="#ff7aa5" font-family="sans-serif">描かない</text>

  <text x="200" y="640" font-size="20" fill="#6d7a99" font-family="sans-serif">↓ 端子の切り欠き</text>
  <text x="330" y="80" font-size="20" fill="#6d7a99" font-family="sans-serif">持ち手のリブ ↑</text>
</svg>
