<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" width="1600" height="760">
  <!-- 本体画像の寸法基準図。生成AIへ「構図の参考」として見せる。
       赤い枠の中には何も置かないこと。ここへHTML側で部品を重ねる。
       青い枠は逆に、しっかり描き込んでほしい場所。 -->
  <rect width="1600" height="760" fill="#0b0d14"/>
  <text x="30" y="742" font-size="22" fill="#dfe7ff" font-family="sans-serif">console-body.png / 1600 x 760 / 背景は透過 / スケルトンの横長携帯機（発光させない）</text>

  <!-- 本体が収まる範囲 -->
  <rect x="30" y="52" width="1540" height="686" rx="60"
        fill="none" stroke="#3f4a63" stroke-width="3" stroke-dasharray="10 8"/>
  <text x="44" y="40" font-size="19" fill="#6d7a99" font-family="sans-serif">本体はこの内側に収める（外は余白）</text>

  <!-- 画面：空き地 -->
  <rect x="528" y="99" width="544" height="479" rx="10"
        fill="rgba(255,60,120,.12)" stroke="#ff3c78" stroke-width="4"/>
  <text x="548" y="90" font-size="22" fill="#ff7aa5" font-family="sans-serif">画面：平らな暗いくぼみにする。中に何も描かない</text>
  <text x="596" y="330" font-size="26" fill="#ff7aa5" font-family="sans-serif" opacity=".9">画面はHTMLで描く</text>

  <!-- PLAY：空き地 -->
  <rect x="608" y="608" width="384" height="106" rx="53"
        fill="rgba(255,60,120,.12)" stroke="#ff3c78" stroke-width="4"/>
  <text x="620" y="598" font-size="20" fill="#ff7aa5" font-family="sans-serif">PLAY：平らな空き地。ボタンも文字も描かない</text>

  <!-- 差込口：描いてよい -->
  <rect x="608" y="0" width="384" height="52" rx="6"
        fill="rgba(60,180,255,.14)" stroke="#3cb4ff" stroke-width="4"/>
  <text x="1010" y="34" font-size="20" fill="#7ecbff" font-family="sans-serif">← 上端の差込口。ここは作り込んでよい</text>

  <!-- 自由に描く場所 -->
  <rect x="130" y="210" width="220" height="230" rx="12"
        fill="rgba(60,180,255,.10)" stroke="#3cb4ff" stroke-width="3" stroke-dasharray="8 6"/>
  <text x="140" y="200" font-size="20" fill="#7ecbff" font-family="sans-serif">十字キー</text>

  <rect x="1150" y="200" width="320" height="240" rx="12"
        fill="rgba(60,180,255,.10)" stroke="#3cb4ff" stroke-width="3" stroke-dasharray="8 6"/>
  <text x="1160" y="190" font-size="20" fill="#7ecbff" font-family="sans-serif">A・Bボタン</text>

  <rect x="1230" y="530" width="240" height="150" rx="12"
        fill="rgba(60,180,255,.10)" stroke="#3cb4ff" stroke-width="3" stroke-dasharray="8 6"/>
  <text x="1240" y="520" font-size="20" fill="#7ecbff" font-family="sans-serif">スピーカー</text>

  <text x="150" y="620" font-size="21" fill="#6d7a99" font-family="sans-serif">残りの面は、透けた樹脂ごしに</text>
  <text x="150" y="650" font-size="21" fill="#6d7a99" font-family="sans-serif">基板・配線・部品が見える状態にする</text>
  <text x="150" y="686" font-size="21" fill="#6d7a99" font-family="sans-serif">（発光はさせない。色はCSSで乗せる）</text>
</svg>
